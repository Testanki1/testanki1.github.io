<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>电影级宣传片合集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      /* 原始核心色调保持不变 */
      --base: #001926;
      --green: #76FF33;
      --green-glow: rgba(118, 255, 51, 0.28);
      --blue: #BFD5FF;
      --ink: #ffffff;
      --muted: rgba(191, 213, 255, 0.72);
      --outline: rgba(191, 213, 255, 0.16);
      --outline-variant: rgba(191, 213, 255, 0.08);

      /* 表面层级变量 */
      --surface-container-low: rgba(191, 213, 255, 0.04);
      --surface-container: rgba(191, 213, 255, 0.07);
      --surface-container-high: rgba(191, 213, 255, 0.12);
      --surface-container-highest: rgba(191, 213, 255, 0.18);
      
      /* 动态曲线 */
      --ease-expressive: cubic-bezier(0.34, 1.4, 0.64, 1);
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--base);
      background-image: 
        radial-gradient(ellipse 65% 35% at 50% -5%, rgba(118, 255, 51, 0.08), transparent 70%),
        radial-gradient(ellipse 45% 25% at 85% 15%, rgba(191, 213, 255, 0.05), transparent 60%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: Rubik, 'M PLUS 1p', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, video:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    .shell {
      width: min(1080px, 100%);
      margin: auto;
      padding: 0 32px 96px;
    }

    /* 头部区域 */
    .intro {
      padding: 60px 0 32px;
    }

    .eyebrow {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: var(--green);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(118, 255, 51, 0.08);
      border: 1px solid rgba(118, 255, 51, 0.22);
      margin-bottom: 8px;
    }
    .eyebrow::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    h1 {
      margin: 16px 0 14px;
      font-weight: 800;
      font-size: clamp(34px, 5.2vw, 56px);
      letter-spacing: -.035em;
      line-height: 1.08;
    }
    h1 span {
      color: var(--green);
    }

    .intro p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      max-width: 680px;
      margin: 0;
    }

    /* 工具栏 & 搜索框 */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--outline-variant);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Filter 芯片 */
    .filter {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--blue);
      background: var(--surface-container);
      border: 1px solid var(--outline);
      border-radius: 20px;
      transition: all 0.26s var(--ease-expressive);
      position: relative;
      overflow: hidden;
    }
    .filter:hover {
      background: var(--surface-container-high);
      transform: translateY(-2px) scale(1.04);
      color: #fff;
    }
    .filter:active {
      transform: scale(0.94);
    }
    .filter[aria-pressed=true] {
      background: var(--green);
      color: var(--base);
      border-color: var(--green);
      border-radius: 9999px;
      transform: scale(1.05);
      box-shadow: 0 4px 20px var(--green-glow);
    }
    .filter[aria-pressed=true]:hover {
      transform: scale(1.08);
      background: var(--green);
      color: var(--base);
    }
    .filter img {
      height: 26px;
      width: 26px;
      object-fit: contain;
      pointer-events: none;
    }
    .filter .material-symbols-rounded {
      font-size: 24px;
    }

    /* 胶囊搜索框 */
    .searchbox {
      height: 52px;
      border: 1px solid var(--outline);
      background: var(--surface-container);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      color: var(--blue);
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(8px);
      transition: all 0.2s var(--ease-standard);
    }
    .searchbox:hover {
      background: var(--surface-container-high);
      border-color: rgba(191, 213, 255, 0.3);
    }
    .searchbox:focus-within {
      background: rgba(191, 213, 255, 0.12);
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(191, 213, 255, 0.2);
    }
    .searchbox span {
      font-size: 22px;
      color: var(--blue);
    }
    .searchbox input {
      border: 0;
      outline: 0 !important;
      min-width: 0;
      width: 100%;
      color: #fff;
      background: transparent;
      font-size: 14.5px;
      font-weight: 500;
    }
    .searchbox input::placeholder {
      color: rgba(191, 213, 255, 0.5);
    }

    .list-head {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
      margin: 24px 6px 14px;
      letter-spacing: .02em;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Card 列表项 */
    .video-row {
      background: var(--surface-container-low);
      border: 1px solid var(--outline-variant);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      overflow: visible;
      transition: all 0.28s var(--ease-standard);
    }
    .video-row:hover {
      background: var(--surface-container);
      border-color: rgba(191, 213, 255, 0.24);
      transform: translateY(-1px);
    }
    .video-row:has(.row-button[aria-expanded=true]) {
      background: var(--surface-container);
      border-color: rgba(118, 255, 51, 0.45);
      box-shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(118, 255, 51, 0.2);
    }

    .row-button {
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 74px;
      padding: 14px 22px;
      background: transparent;
      border: 0;
      color: #fff;
      text-align: left;
      transition: background 0.2s var(--ease-standard);
    }
    .row-button:hover {
      background: rgba(191, 213, 255, 0.04);
    }
    .row-title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 15.5px;
      letter-spacing: -.01em;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .row-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* Tokenized 装备徽章容器 */
    .badge {
      height: 34px;
      width: 34px;
      display: grid;
      place-items: center;
      background: rgba(191, 213, 255, 0.06);
      border: 1px solid rgba(191, 213, 255, 0.1);
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .video-row:hover .badge {
      border-color: rgba(191, 213, 255, 0.2);
    }
    .badge img {
      height: 22px;
      width: 22px;
      object-fit: contain;
    }

    .row-expand {
      flex: 0 0 auto;
      color: var(--blue);
      font-size: 24px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      transition: transform 0.3s var(--ease-expressive), background 0.2s;
    }
    .row-button:hover .row-expand {
      background: rgba(191, 213, 255, 0.08);
    }
    .row-button[aria-expanded=true] .row-expand {
      transform: rotate(180deg);
      color: var(--green);
      background: rgba(118, 255, 51, 0.12);
    }

    .unknown {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(191, 213, 255, 0.05);
    }

    .message {
      padding: 36px;
      border: 1px dashed var(--outline);
      border-radius: 24px;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
      background: var(--surface-container-low);
    }

    /* 播放器核心容器 */
    .inline-player {
      padding: 0 16px 18px;
    }

    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000c14;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(191, 213, 255, 0.1);
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .player-frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000c14;
      pointer-events: none;
    }
    .video-interaction {
      position: absolute;
      inset: 0;
      -webkit-touch-callout: none;
      user-select: none;
      cursor: pointer;
    }

    /* 浮动岛台式播放控制器 */
    .controls {
      padding: 16px 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .seek-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time {
      min-width: 42px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    /* Slider 现代化进度条 */
    .range {
      appearance: none;
      -webkit-appearance: none;
      min-width: 0;
      height: 8px;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--green) 0%, var(--green) var(--progress, 0%), rgba(191, 213, 255, 0.18) var(--progress, 0%), rgba(191, 213, 255, 0.18) 100%);
      cursor: pointer;
      transition: height 0.15s var(--ease-standard);
    }
    .range:hover:not(:disabled) {
      height: 10px;
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--base);
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
      transition: transform 0.18s var(--ease-expressive), width 0.18s, height 0.18s;
    }
    .range:hover:not(:disabled)::-webkit-slider-thumb {
      transform: scale(1.25);
    }
    .range::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid var(--base);
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
      transition: transform 0.18s var(--ease-expressive);
    }
    .range:hover:not(:disabled)::-moz-range-thumb {
      transform: scale(1.25);
    }
    .range:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .seek {
      flex: 1;
    }

    /* 控制按键群 */
    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control {
      border: 0;
      cursor: pointer;
      text-decoration: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--blue);
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      transition: all 0.22s var(--ease-expressive);
    }
    .control:hover {
      background: var(--surface-container-highest);
      color: #fff;
      transform: translateY(-2px);
    }
    .control:active {
      transform: scale(0.92);
      border-radius: 9999px;
    }

    /* 主播放键 (FAB/Squircle 强调设计) */
    .control.main {
      width: 54px;
      height: 54px;
      background: var(--green);
      color: var(--base);
      border-radius: 20px;
      border: 0;
      box-shadow: 0 6px 20px var(--green-glow);
    }
    .control.main:hover {
      background: var(--blue);
      color: var(--base);
      box-shadow: 0 6px 20px rgba(191, 213, 255, 0.35);
      transform: translateY(-2px) scale(1.05);
    }
    .control.main:active {
      transform: scale(0.95);
      border-radius: 50%;
    }
    .control.main .material-symbols-rounded {
      font-size: 30px;
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }

    .volume {
      width: 76px;
    }

    /* 全屏状态悬浮条适配 */
    .inline-player:fullscreen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      padding: 0;
      display: block;
    }
    .inline-player:fullscreen .player-frame {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }
    .inline-player:fullscreen .controls {
      position: absolute;
      z-index: 10;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      bottom: max(24px, env(safe-area-inset-bottom));
      width: min(840px, calc(100% - 48px));
      padding: 16px 24px;
      background: rgba(0, 25, 38, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(191, 213, 255, 0.16);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-standard), transform 0.3s var(--ease-expressive);
    }
    .inline-player:fullscreen.controls-visible .controls {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* 浮动缓冲状态芯片 (Floating Buffer Chip) */
    .buffer-overlay {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      max-width: calc(100% - 24px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -42%) scale(.9);
      pointer-events: none;
      transition: opacity .28s var(--ease-standard), transform .28s var(--ease-expressive), visibility 0s linear .28s;
    }
    .buffer-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity .28s var(--ease-standard), transform .28s var(--ease-expressive), visibility 0s;
    }
    .buffer-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 48px;
      padding: 10px 20px;
      background: rgba(0, 25, 38, 0.85);
      border: 1px solid rgba(191, 213, 255, 0.2);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--blue);
    }
    .buffer-spinner {
      color: var(--green);
      font-size: 22px;
      animation: buffer-spin 1.2s linear infinite;
    }
    .transfer-status {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @keyframes buffer-spin {
      to { transform: rotate(360deg); }
    }

    /* 响应式断点 */
    @media (max-width: 600px) {
      .shell {
        padding: 0 16px 60px;
      }
      .intro {
        padding: 40px 0 24px;
      }
      .filter {
        width: 44px;
        height: 44px;
      }
      .row-button {
        padding: 12px 14px;
        gap: 10px;
      }
      .row-title {
        font-size: 14.5px;
      }
      .badge {
        width: 30px;
        height: 30px;
      }
      .badge img {
        width: 19px;
        height: 19px;
      }
      .inline-player {
        padding: 0 8px 12px;
      }
      .control {
        width: 40px;
        height: 40px;
        border-radius: 14px;
      }
      .control.main {
        width: 48px;
        height: 48px;
        border-radius: 18px;
      }
      .volume {
        display: none;
      }
      .time {
        min-width: 36px;
        font-size: 11px;
      }
      .controls-row {
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
<main class="shell">
  <header class="intro">
    <div class="eyebrow" data-i18n="archive">3D坦克 · 玩家收集</div>
    <h1><span data-i18n="title" style="color:inherit">电影级宣传片合集</span><span>.</span></h1>
    <p data-i18n="description">玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。</p>
  </header>
  <section class="toolbar" data-i18n-aria="filters" aria-label="系列筛选">
    <div class="filter-bar" id="filters" role="group" data-i18n-aria="filters" aria-label="系列筛选"></div>
    <label class="searchbox"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索宣传片名称" aria-label="搜索宣传片名称"></label>
  </section>
  <p class="list-head" id="status" role="status" aria-live="polite">正在读取宣传片…</p>
  <section class="list" id="list" data-i18n-aria="list" aria-label="宣传片列表"></section>
</main>
<script>
const SKIN_SERIES = [
  {key:'standard',icon:'standard.svg'},
  {key:'XT',icon:'XT_HD.svg'},
  {key:'LC',icon:'LC.svg'},
  {key:'DC',icon:'DC.svg'},
  {key:'PR',icon:'PR.svg'},
  {key:'UT',icon:'UT.svg'},
  {key:'SP',icon:'SP.svg'},
  {key:'SE',icon:'SE.svg'},
  {key:'RF',icon:'RF.svg'},
  {key:'GT',icon:'GT.svg'},
  {key:'ICE',icon:'ICE.svg'},
  {key:'DK',icon:'DK.svg'},
  {key:'VT',icon:'VT.svg'},
];
// 这些名称和 SVG 来自仓库的 equipment_icons；非装备宣传不靠猜测归类。
const EQUIPMENT = [
  {key:'firebird',icon:'firebird.svg'},
  {key:'freeze',icon:'freeze.svg'},
  {key:'isida',icon:'isida.svg'},
  {key:'hammer',icon:'hammer.svg'},
  {key:'twins',icon:'twins.svg'},
  {key:'ricochet',icon:'ricochet.svg'},
  {key:'smoky',icon:'smoky.svg'},
  {key:'striker',icon:'striker.svg'},
  {key:'vulcan',icon:'vulcan.svg'},
  {key:'thunder',icon:'thunder.svg'},
  {key:'railgun',icon:'railgun.svg'},
  {key:'shaft',icon:'shaft.svg'},
  {key:'magnum',icon:'magnum.svg'},
  {key:'gauss',icon:'gauss.svg'},
  {key:'tesla',icon:'tesla.svg'},
  {key:'scorpion',icon:'scorpion.svg'},
  {key:'tsunami',icon:'tsunami.svg'},
  {key:'wasp',icon:'wasp.svg'},
  {key:'hornet',icon:'hornet.svg'},
  {key:'hunter',icon:'hunter.svg'},
  {key:'viking',icon:'viking.svg'},
  {key:'dictator',icon:'dictator.svg'},
  {key:'titan',icon:'titan.svg'},
  {key:'mammoth',icon:'mammoth.svg'},
  {key:'ares',icon:'ares.svg'},
  {key:'crusader',icon:'crusader.svg'},
  {key:'paladin',icon:'paladin.svg'},
  {key:'hopper',icon:'hopper.svg'},
  {key:'bonk',icon:'bonk.svg'},
  {key:'juggernaut',icon:'juggernaut.svg'},
  {key:'terminator',icon:'terminator.svg'},
  {key:'tomato_gun',icon:null},
];

// 宣传片资料从 /promo-videos/catalog.json 读取；数组自身的顺序就是显示顺序。
const catalogByName = new Map();
// GitHub Pages 没有后端：只有在该站点上使用现有的 Cloudflare 视频接口。
const VIDEO_API_ORIGIN = location.hostname.endsWith('.github.io')
  ? `https://${location.hostname.slice(0, -'.github.io'.length)}.pages.dev`
