<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>电影级宣传片合集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    /* =========================================================
       Tokens & Motion Curves
       ========================================================= */
    :root {
      color-scheme: dark;
      --base: #001926;
      --green: #76FF33;
      --green-glow: rgba(118, 255, 51, .35);
      --blue: #BFD5FF;
      --ink: #fff;
      --muted: rgba(191, 213, 255, .72);
      --outline: rgba(191, 213, 255, .18);

      /* Motion Physics */
      --m3-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --m3-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
      --m3-expand: cubic-bezier(0.16, 1, 0.3, 1);
      --m3-standard: cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background: var(--base);
      color: var(--ink);
      font-family: Rubik, 'M PLUS 1p', sans-serif;
      min-height: 100vh;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; background: transparent; }
    
    /* 排除 range slider 的全局外框，防止滑块出现方形暗框 */
    button:focus-visible, a:focus-visible, select:focus-visible, video:focus-visible, input:not([type="range"]):focus-visible {
      outline: 2.5px solid var(--green);
      outline-offset: 3px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      transition: font-variation-settings .2s ease;
    }

    /* =========================================================
       Header & Entrance
       ========================================================= */
    .shell {
      width: min(1080px, 100%);
      margin: auto;
      padding: 0 32px 80px;
    }

    .intro {
      padding: 52px 0 28px;
      animation: introEnter .5s var(--m3-decel) backwards;
    }

    @keyframes introEnter {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--green);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .eyebrow:before {
      content: '';
      width: 25px;
      height: 2px;
      background: var(--green);
      border-radius: 2px;
    }

    h1 {
      margin: 14px 0 12px;
      font-weight: 700;
      font-size: clamp(34px, 5vw, 58px);
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    h1 span { color: var(--green); }

    .intro p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin: 0;
    }

    /* =========================================================
       Toolbar: Filter Bar & Search Box
       ========================================================= */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--outline);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--blue);
      background: rgba(191, 213, 255, .08);
      border: 1px solid var(--outline);
      border-radius: 16px;
      transition: 
        border-radius .3s var(--m3-spring),
        transform .18s var(--m3-spring),
        background-color .2s ease,
        color .2s ease;
    }

    .filter:active {
      transform: scale(0.9) !important;
    }

    .filter[aria-pressed=true] {
      background: var(--green);
      color: var(--base);
      border-color: var(--green);
      border-radius: 24px;
    }

    .filter img {
      height: 27px;
      width: 27px;
      object-fit: contain;
      transition: transform .25s var(--m3-spring);
    }

    .filter .material-symbols-rounded { font-size: 23px; }

    @media (hover: hover) and (pointer: fine) {
      .filter:hover {
        background: rgba(191, 213, 255, .16);
        transform: translateY(-2px);
      }
      .filter:hover img, .filter[aria-pressed=true] img {
        transform: scale(1.08);
      }
      .video-row:hover {
        background: rgba(191, 213, 255, .075);
        border-color: rgba(191, 213, 255, .28);
      }
      .video-row:hover .badge img {
        transform: translateY(-2px) scale(1.08);
      }
      .row-button:hover {
        background: rgba(191, 213, 255, .04);
      }
      .control:hover {
        background: rgba(191, 213, 255, .2);
        transform: translateY(-2px);
      }
      .control.main:hover {
        background: #8BFF4D;
        transform: scale(1.06) translateY(-2px);
      }
    }

    .searchbox {
      height: 50px;
      border: 1px solid var(--outline);
      background: rgba(191, 213, 255, .06);
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      color: var(--blue);
      max-width: 440px;
      width: 100%;
      transition: border-color .25s ease, background-color .25s ease, box-shadow .25s var(--m3-spring);
    }

    .searchbox:focus-within {
      outline: 0;
      border-color: var(--green);
      background: rgba(191, 213, 255, .09);
      box-shadow: 0 0 0 3px rgba(118, 255, 51, .25);
    }

    .searchbox span { 
      font-size: 21px;
      transition: transform .25s var(--m3-spring), color .2s ease;
    }

    .searchbox:focus-within span {
      color: var(--green);
      transform: scale(1.08);
    }

    .searchbox input {
      border: 0;
      outline: 0 !important;
      min-width: 0;
      width: 100%;
      color: #fff;
      background: transparent;
      font-size: 14px;
    }

    .searchbox input::placeholder { color: rgba(191, 213, 255, .6); }

    .list-head {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
      margin: 22px 2px 13px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================
       Video Rows & 列表交互
       ========================================================= */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-row {
      background: rgba(191, 213, 255, .055);
      border: 1px solid rgba(191, 213, 255, .15);
      border-radius: 23px;
      overflow: hidden;
      transition: 
        border-color .3s ease, 
        background-color .3s ease;
      animation: rowEntrance .38s var(--m3-decel) backwards;
    }

    @keyframes rowEntrance {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .video-row:has(.row-button[aria-expanded=true]) {
      background: rgba(191, 213, 255, .08);
      border-color: rgba(118, 255, 51, .65);
    }

    .row-button {
      border-radius: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 14px 18px;
      color: #fff;
      text-align: left;
      transition: background-color .15s ease, transform .15s var(--m3-spring);
    }

    /* 点击下压弹性触觉反馈 */
    .row-button:active {
      transform: scale(0.985);
      background: rgba(191, 213, 255, .08);
    }

    .row-title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .row-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      height: 30px;
      width: 30px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
    }

    .badge img {
      height: 23px;
      width: 23px;
      object-fit: contain;
      transition: transform .25s var(--m3-spring);
    }

    /* 
       纯净的右侧展开箭头：
       移除圆形背景和宽高，颜色始终保持统一的柔和蓝，仅靠 180° 旋转表达状态
    */
    .row-expand {
      flex: 0 0 auto;
      color: var(--blue);
      font-size: 24px;
      background: transparent;
      border: 0;
      transition: transform .35s var(--m3-spring);
    }

    .row-button[aria-expanded=true] .row-expand {
      transform: rotate(180deg);
    }

    .unknown {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .message {
      padding: 28px;
      border: 1px dashed var(--outline);
      border-radius: 22px;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
    }

    /* =========================================================
       CSS Grid 物理抽屉式平滑展开体系 (Smooth Accordion)
       ========================================================= */
    .inline-player {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-8px);
      transition: 
        grid-template-rows .42s var(--m3-expand),
        opacity .32s ease,
        transform .42s var(--m3-expand);
    }

    .inline-player:not(.is-expanded):not(:fullscreen) {
      pointer-events: none;
    }

    .inline-player.is-expanded {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0);
    }

    .player-accordion-inner {
      min-height: 0;
      overflow: hidden;
      padding: 0 14px 16px;
      transition: padding-bottom .42s var(--m3-expand);
    }

    .inline-player:not(.is-expanded):not(:fullscreen) .player-accordion-inner {
      padding-bottom: 0;
    }

    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: transparent;
      border-radius: 17px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .player-frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .video-interaction {
      position: absolute;
      inset: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .controls {
      padding: 14px 6px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seek-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time {
      min-width: 38px;
      text-align: center;
      font-size: 12px;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* M3 精致进度条（4px -> 6px） */
    .range {
      appearance: none;
      -webkit-appearance: none;
      min-width: 0;
      height: 4px;
      border: 0 !important;
      outline: none !important;
      border-radius: 99px;
      background: linear-gradient(to right, var(--green) 0%, var(--green) var(--progress, 0%), rgba(191, 213, 255, .25) var(--progress, 0%), rgba(191, 213, 255, .25) 100%);
      cursor: pointer;
      transition: height .2s var(--m3-standard);
    }

    .range:focus, .range:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }

    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border: 0 !important;
      outline: none !important;
      border-radius: 50%;
      background: var(--green);
      transition: transform .2s var(--m3-spring);
    }

    .range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0 !important;
      outline: none !important;
      border-radius: 50%;
      background: var(--green);
      transition: transform .2s var(--m3-spring);
    }

    .range::-moz-focus-outer {
      border: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .range:hover {
        height: 6px;
      }
      .range:hover::-webkit-slider-thumb, .range:active::-webkit-slider-thumb {
        transform: scale(1.35);
      }
      .range:hover::-moz-range-thumb, .range:active::-moz-range-thumb {
        transform: scale(1.35);
      }
    }

    .range:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .seek { flex: 1; }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control {
      border: 0;
      text-decoration: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--blue);
      background: rgba(191, 213, 255, .1);
      transition: 
        background-color .2s ease,
        transform .15s var(--m3-spring),
        border-radius .2s var(--m3-spring);
    }

    .control:active {
      transform: scale(0.88) !important;
      border-radius: 22px;
    }

    .control.main {
      width: 50px;
      height: 50px;
      background: var(--green);
      color: var(--base);
      border-radius: 18px;
      transition: 
        transform .2s var(--m3-spring),
        background-color .2s ease,
        border-radius .2s var(--m3-spring);
    }

    .control.main:active {
      transform: scale(0.9) !important;
      border-radius: 24px;
    }

    .control.main .material-symbols-rounded {
      font-size: 27px;
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      transition: transform .2s var(--m3-spring);
    }

    .volume { width: 70px; }

    /* =========================================================
       Buffering Indicator (纯净加载)
       ========================================================= */
    .buffer-overlay {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      max-width: calc(100% - 24px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -42%) scale(.88);
      pointer-events: none;
      transition: 
        opacity .25s var(--m3-standard),
        transform .25s var(--m3-spring),
        visibility 0s linear .25s;
    }

    .buffer-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity .25s var(--m3-standard), transform .25s var(--m3-spring), visibility 0s;
    }

    .buffer-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 40px;
      padding: 6px 14px;
      color: #fff;
      background: transparent;
      border: 0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
    }

    .buffer-spinner {
      color: var(--green);
      font-size: 24px;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,.8));
      animation: buffer-spin 1.2s linear infinite;
    }

    .transfer-status {
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    @keyframes buffer-spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================================
       Fullscreen Presentation
       ========================================================= */
    .inline-player:fullscreen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      padding: 0;
      display: block !important;
      grid-template-rows: none !important;
      opacity: 1 !important;
      transform: none !important;
    }

    .inline-player:fullscreen .player-accordion-inner {
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .inline-player:fullscreen .player-frame {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }

    .inline-player:fullscreen .controls {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 44px max(24px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: transparent;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity .28s var(--m3-standard), transform .28s var(--m3-standard);
    }

    .inline-player:fullscreen.controls-visible .controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* =========================================================
       Mobile Adaptation
       ========================================================= */
    @media (max-width: 600px) {
      .shell { padding: 0 16px 60px; }
      .intro { padding: 38px 0 24px; }
      .filter { width: 44px; height: 44px; }
      .row-button { padding: 12px; gap: 9px; }
      .row-title { font-size: 14px; }
      .badge { width: 26px; height: 26px; }
      .badge img { width: 21px; height: 21px; }
      .player-accordion-inner { padding: 0 9px 12px; }
      .control { width: 38px; height: 38px; border-radius: 14px; }
      .control.main { width: 44px; height: 44px; border-radius: 16px; }
      .volume { display: none; }
      .time { min-width: 33px; font-size: 11px; }
      .controls-row { gap: 6px; }

      /* M3 Expressive: keep the filter controls in one swipeable rail. */
      #filters.filter-bar {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        padding: 2px 2px 10px;
        margin: 0 -2px;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
        scrollbar-color: rgba(191, 213, 255, .32) transparent;
      }

      #filters.filter-bar > .filter {
        flex: 0 0 44px;
        scroll-snap-align: start;
      }

      #filters.filter-bar::-webkit-scrollbar { height: 3px; }
      #filters.filter-bar::-webkit-scrollbar-track { background: transparent; }
      #filters.filter-bar::-webkit-scrollbar-thumb {
        background: rgba(191, 213, 255, .32);
        border-radius: 999px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
<main class="shell">
  <header class="intro">
    <div class="eyebrow" data-i18n="archive">3D坦克 · 玩家收集</div>
    <h1><span data-i18n="title" style="color:inherit">电影级宣传片合集</span><span>.</span></h1>
    <p data-i18n="description">玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。</p>
  </header>
  <section class="toolbar" data-i18n-aria="filters" aria-label="系列筛选">
    <div class="filter-bar" id="filters" role="group" data-i18n-aria="filters" aria-label="系列筛选"></div>
    <label class="searchbox"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索宣传片名称" aria-label="搜索宣传片名称"></label>
  </section>
  <p class="list-head" id="status" role="status" aria-live="polite">正在读取宣传片…</p>
  <section class="list" id="list" data-i18n-aria="list" aria-label="宣传片列表"></section>
</main>
<script>
const SKIN_SERIES = [
  {key:'standard',icon:'standard.svg'},
  {key:'XT',icon:'XT_HD.svg'},
  {key:'LC',icon:'LC.svg'},
  {key:'DC',icon:'DC.svg'},
  {key:'PR',icon:'PR.svg'},
  {key:'UT',icon:'UT.svg'},
  {key:'SP',icon:'SP.svg'},
  {key:'SE',icon:'SE.svg'},
  {key:'RF',icon:'RF.svg'},
  {key:'GT',icon:'GT.svg'},
  {key:'ICE',icon:'ICE.svg'},
  {key:'DK',icon:'DK.svg'},
  {key:'VT',icon:'VT.svg'},
];

const EQUIPMENT = [
  {key:'firebird',icon:'firebird.svg'},
  {key:'freeze',icon:'freeze.svg'},
  {key:'isida',icon:'isida.svg'},
  {key:'hammer',icon:'hammer.svg'},
  {key:'twins',icon:'twins.svg'},
  {key:'ricochet',icon:'ricochet.svg'},
  {key:'smoky',icon:'smoky.svg'},
  {key:'striker',icon:'striker.svg'},
  {key:'vulcan',icon:'vulcan.svg'},
  {key:'thunder',icon:'thunder.svg'},
  {key:'railgun',icon:'railgun.svg'},
  {key:'shaft',icon:'shaft.svg'},
  {key:'magnum',icon:'magnum.svg'},
  {key:'gauss',icon:'gauss.svg'},
  {key:'tesla',icon:'tesla.svg'},
  {key:'scorpion',icon:'scorpion.svg'},
  {key:'tsunami',icon:'tsunami.svg'},
  {key:'wasp',icon:'wasp.svg'},
  {key:'hornet',icon:'hornet.svg'},
  {key:'hunter',icon:'hunter.svg'},
  {key:'viking',icon:'viking.svg'},
  {key:'dictator',icon:'dictator.svg'},
  {key:'titan',icon:'titan.svg'},
  {key:'mammoth',icon:'mammoth.svg'},
  {key:'ares',icon:'ares.svg'},
  {key:'crusader',icon:'crusader.svg'},
  {key:'paladin',icon:'paladin.svg'},
  {key:'hopper',icon:'hopper.svg'},
  {key:'bonk',icon:'bonk.svg'},
  {key:'juggernaut',icon:'juggernaut.svg'},
  {key:'terminator',icon:'terminator.svg'},

    meterAvailable = available;
    const source = available ? '/promo-videos/__stream?file=' + encodeURIComponent(item.name) + '&session=' + encodeURIComponent(session) : videoApiUrl('video', item.name);
    video.src = source; video.load();
    if (activePlayer === player) video.play().catch(() => {});
  });
}

search.addEventListener('input',() => { renderFilters(); renderList(); });

async function loadVideos() {
  try {
    const [response, catalogResponse] = await Promise.all([
      fetch(videoApiUrl('list'),{cache:'no-store'}),
      fetch('/promo-videos/catalog.json',{cache:'no-store'}),
    ]);
    if (!response.ok) throw new Error(t.loadFailure);
    if (!catalogResponse.ok) throw new Error(t.catalogFailure);
    const [data, catalog] = await Promise.all([response.json(), catalogResponse.json()]);
    if (!Array.isArray(data.videos)) throw new Error(t.badList);
    if (!Array.isArray(catalog)) throw new Error(t.badCatalog);
    catalogByName.clear();
    for (const entry of catalog) {
      if (!entry || typeof entry.name !== 'string' || typeof entry.zh !== 'string' ||
          !(entry.series === null || typeof entry.series === 'string') ||
          !Array.isArray(entry.equipment) || entry.equipment.some(key => typeof key !== 'string') ||
          catalogByName.has(entry.name) ||
          (entry.series && !SKIN_SERIES.some(series => series.key === entry.series)) ||
          (entry.category !== undefined && !['maps','events'].includes(entry.category)) ||
          (entry.series && entry.category !== undefined) ||
          entry.equipment.some(key => !EQUIPMENT.some(equipment => equipment.key === key))) throw new Error(t.badCatalog);
      catalogByName.set(entry.name, entry);
    }
    const driveFiles = data.videos.filter(v => typeof v.name === 'string');
    const byName = new Map();
    for (const file of driveFiles) {
      if (!byName.has(file.name)) byName.set(file.name, []);
      byName.get(file.name).push(file);
    }
    const arranged = [];
    for (const entry of catalog) arranged.push(...(byName.get(entry.name) || []));
    for (const file of driveFiles) if (!catalogByName.has(file.name)) arranged.push(file);
    videos = arranged.map(v => ({...v,...classify(v.name)}));
    renderFilters(); renderList();
  } catch (error) {
    status.textContent = t.loadError;
    const message = document.createElement('div'); message.className = 'message';
    message.textContent = error instanceof SyntaxError ? t.badCatalog :
      ([t.loadFailure,t.catalogFailure].some(text => error.message?.startsWith(text)) || error.message === t.badList || error.message === t.badCatalog ? error.message : t.loadFailure);
    list.replaceChildren(message);
  }
}
loadVideos();
</script>
