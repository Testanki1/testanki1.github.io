<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>电影级宣传片合集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #060b11;
      --bg-surface: rgba(18, 28, 42, 0.65);
      --bg-surface-hover: rgba(28, 42, 62, 0.75);
      --bg-surface-active: rgba(20, 35, 52, 0.95);
      --accent: #00f076;
      --accent-glow: rgba(0, 240, 118, 0.28);
      --accent-soft: rgba(0, 240, 118, 0.12);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.25);
      --blue-muted: #8eaecf;
      --ink: #f8fafc;
      --ink-dim: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.35);
      --border-active: var(--accent);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --glass-blur: blur(16px);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 8%, rgba(56, 189, 248, 0.14), transparent 45%),
        radial-gradient(circle at 90% 15%, rgba(0, 240, 118, 0.1), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.08), transparent 50%),
        linear-gradient(180deg, #070e17 0%, #03060a 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: Rubik, 'M PLUS 1p', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 22px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 0 28px 90px;
    }

    /* ── Header ── */
    .intro {
      padding: 64px 0 36px;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px 6px 10px;
      border-radius: 99px;
      background: rgba(0, 240, 118, 0.08);
      border: 1px solid rgba(0, 240, 118, 0.25);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .eyebrow::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-weight: 800;
      font-size: clamp(36px, 5.5vw, 62px);
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 40%, var(--blue-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 span.dot {
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .intro p {
      color: var(--ink-dim);
      font-size: 15px;
      line-height: 1.7;
      max-width: 640px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 12px 0 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .filter-bar::-webkit-scrollbar {
      height: 4px;
    }
    .filter-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }

    .filter {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--blue-muted);
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all 0.24s var(--ease);
      position: relative;
    }

    .filter:hover {
      background: var(--bg-surface-hover);
      color: #fff;
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .filter[aria-pressed="true"] {
      background: var(--accent);
      color: #031207;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .filter img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
      transition: transform 0.2s var(--ease);
    }

    .filter:hover img {
      transform: scale(1.1);
    }

    .searchbox {
      height: 52px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      color: var(--blue-muted);
      max-width: 480px;
      width: 100%;
      transition: all 0.25s var(--ease);
    }

    .searchbox:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 24px var(--cyan-glow), inset 0 0 12px rgba(56, 189, 248, 0.1);
      color: #fff;
    }

    .searchbox input {
      border: 0;
      outline: 0 !important;
      min-width: 0;
      width: 100%;
      color: #fff;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
    }

    .searchbox input::placeholder {
      color: rgba(142, 174, 207, 0.55);
    }

    .list-head {
      color: var(--ink-dim);
      font-size: 13px;
      font-weight: 500;
      margin: 22px 4px 14px;
      letter-spacing: 0.02em;
    }

    /* ── Video List & Card ── */
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-row {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    }

    .video-row:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: var(--bg-surface-hover);
    }

    .video-row:has(.row-button[aria-expanded="true"]) {
      background: var(--bg-surface-active);
      border-color: var(--border-active);
      box-shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.65), 0 0 24px var(--accent-glow);
    }

    .row-button {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 74px;
      padding: 16px 22px;
      color: #fff;
      text-align: left;
      transition: background 0.2s;
    }

    .row-title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .row-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      height: 34px;
      width: 34px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      transition: transform 0.2s;
    }

    .badge img {
      height: 22px;
      width: 22px;
      object-fit: contain;
    }

    .unknown {
      font-size: 11px;
      font-weight: 500;
      color: var(--blue-muted);
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      white-space: nowrap;
    }

    .row-expand {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      color: var(--blue-muted);
      font-size: 24px;
      transition: transform 0.35s var(--ease), color 0.2s, background 0.2s;
    }

    .row-button:hover .row-expand {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .row-button[aria-expanded="true"] .row-expand {
      transform: rotate(180deg);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .message {
      padding: 38px 24px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      color: var(--ink-dim);
      text-align: center;
      line-height: 1.7;
      background: rgba(10, 18, 28, 0.4);
    }

    /* ── Inline Player ── */
    .inline-player {
      padding: 0 18px 20px;
      animation: fadeIn 0.3s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      user-select: none;
      -webkit-user-select: none;
    }

    .player-frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    .video-interaction {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    /* ── Player Controls HUD ── */
    .controls {
      padding: 16px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .seek-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time {
      min-width: 42px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', Rubik, monospace;
      color: var(--blue-muted);
      font-variant-numeric: tabular-nums;
    }

    .range {
      appearance: none;
      -webkit-appearance: none;
      min-width: 0;
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress, 0%), rgba(255, 255, 255, 0.15) var(--progress, 0%), rgba(255, 255, 255, 0.15) 100%);
      cursor: pointer;
      transition: height 0.15s;
    }

    .range:hover {
      height: 8px;
    }

    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.15s;
    }

    .range:hover::-webkit-slider-thumb {
      transform: scale(1.2);
    }

    .range::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .range:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .seek { flex: 1; }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control {
      border: 0;
      cursor: pointer;
      text-decoration: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      color: var(--blue-muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s var(--ease);
    }

    .control:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .control:active {
      transform: scale(0.94);
    }

    .control.main {
      width: 52px;
      height: 52px;
      background: var(--accent);
      color: #031207;
      border-radius: 18px;
      border: none;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .control.main:hover {
      background: #39ff92;
      color: #000;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 24px rgba(0, 240, 118, 0.45);
    }

    .control.main .material-symbols-rounded {
      font-size: 30px;
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }

    .volume { width: 80px; }

    /* ── Buffer Overlay HUD ── */
    .buffer-overlay {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      max-width: calc(100% - 24px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -45%) scale(0.92);
      pointer-events: none;
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease), visibility 0s linear 0.25s;
    }

    .buffer-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease), visibility 0s;
    }

    .buffer-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 18px;
      background: rgba(6, 12, 20, 0.82);
      border: 1px solid rgba(0, 240, 118, 0.35);
      border-radius: 99px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), 0 0 18px var(--accent-glow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .buffer-spinner {
      color: var(--accent);
      font-size: 22px;
      animation: buffer-spin 1.1s linear infinite;
    }

    .transfer-status {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    @keyframes buffer-spin {
      to { transform: rotate(360deg); }
    }

    /* ── Fullscreen Experience ── */
    .inline-player:fullscreen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .inline-player:fullscreen .player-frame {
      width: 100%;
      height: 100%;
      border-radius: 0;
      box-shadow: none;
    }

    .inline-player:fullscreen .controls {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 50px max(32px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
      background: linear-gradient(to top, rgba(0, 6, 12, 0.95) 0%, rgba(0, 6, 12, 0.6) 60%, transparent 100%);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }

    .inline-player:fullscreen.controls-visible .controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ── Responsive Rules ── */
    @media (max-width: 640px) {
      .shell { padding: 0 16px 70px; }
      .intro { padding: 42px 0 24px; }
      .filter { width: 44px; height: 44px; }
      .row-button { padding: 14px 16px; gap: 10px; min-height: 66px; }
      .row-title { font-size: 14px; }
      .badge { width: 30px; height: 30px; }
      .badge img { width: 18px; height: 18px; }
      .inline-player { padding: 0 10px 14px; }
      .control { width: 40px; height: 40px; border-radius: 12px; }
      .control.main { width: 46px; height: 46px; border-radius: 14px; }
      .volume { display: none; }
      .time { min-width: 34px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
<main class="shell">
  <header class="intro">
    <div class="eyebrow" data-i18n="archive">3D坦克 · 玩家收集</div>
    <h1><span data-i18n="title" style="color:inherit">电影级宣传片合集</span><span class="dot">.</span></h1>
    <p data-i18n="description">玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。</p>
  </header>
  
  <section class="toolbar" data-i18n-aria="filters" aria-label="系列筛选">
    <div class="filter-bar" id="filters" role="group" data-i18n-aria="filters" aria-label="系列筛选"></div>
    <label class="searchbox">
      <span class="material-symbols-rounded" aria-hidden="true">search</span>
      <input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索宣传片名称" aria-label="搜索宣传片名称">
    </label>
  </section>
  
  <p class="list-head" id="status" role="status" aria-live="polite">正在读取宣传片…</p>
  <section class="list" id="list" data-i18n-aria="list" aria-label="宣传片列表"></section>
</main>

<script>
const SKIN_SERIES = [
  {key:'standard',icon:'standard.svg'},
  {key:'XT',icon:'XT_HD.svg'},
  {key:'LC',icon:'LC.svg'},
  {key:'DC',icon:'DC.svg'},
  {key:'PR',icon:'PR.svg'},
  {key:'UT',icon:'UT.svg'},
  {key:'SP',icon:'SP.svg'},
  {key:'SE',icon:'SE.svg'},
  {key:'RF',icon:'RF.svg'},
  {key:'GT',icon:'GT.svg'},
  {key:'ICE',icon:'ICE.svg'},
  {key:'DK',icon:'DK.svg'},
  {key:'VT',icon:'VT.svg'},
];

const EQUIPMENT = [
  {key:'firebird',icon:'firebird.svg'},
  {key:'freeze',icon:'freeze.svg'},
  {key:'isida',icon:'isida.svg'},
  {key:'hammer',icon:'hammer.svg'},
  {key:'twins',icon:'twins.svg'},
  {key:'ricochet',icon:'ricochet.svg'},
  {key:'smoky',icon:'smoky.svg'},
  {key:'striker',icon:'striker.svg'},
  {key:'vulcan',icon:'vulcan.svg'},
  {key:'thunder',icon:'thunder.svg'},
  {key:'railgun',icon:'railgun.svg'},
  {key:'shaft',icon:'shaft.svg'},
  {key:'magnum',icon:'magnum.svg'},
  {key:'gauss',icon:'gauss.svg'},
  {key:'tesla',icon:'tesla.svg'},
  {key:'scorpion',icon:'scorpion.svg'},
  {key:'tsunami',icon:'tsunami.svg'},
  {key:'wasp',icon:'wasp.svg'},
  {key:'hornet',icon:'hornet.svg'},
  {key:'hunter',icon:'hunter.svg'},
  {key:'viking',icon:'viking.svg'},
  {key:'dictator',icon:'dictator.svg'},
  {key:'titan',icon:'titan.svg'},
  {key:'mammoth',icon:'mammoth.svg'},
  {key:'ares',icon:'ares.svg'},
  {key:'crusader',icon:'crusader.svg'},
  {key:'paladin',icon:'paladin.svg'},
  {key:'hopper',icon:'hopper.svg'},
  {key:'bonk',icon:'bonk.svg'},
  {key:'juggernaut',icon:'juggernaut.svg'},
  {key:'terminator',icon:'terminator.svg'},
  {key:'tomato_gun',icon:null},
];

const catalogByName = new Map();
const VIDEO_API_ORIGIN = location.hostname.endsWith('.github.io')
  ? `https://${location.hostname.slice(0, -'.github.io'.length)}.pages.dev`
  : location.origin;

function videoApiUrl(action, file, download = false, filename = null) {
  const url = new URL('/api/promo-videos', VIDEO_API_ORIGIN);
  url.searchParams.set('action', action);
  if (file) url.searchParams.set('file', file);
  if (download) {
    url.searchParams.set('download', '1');
    if (filename) url.searchParams.set('filename', filename);
  }
  return url.href;
}

const isChinese = /^zh(?:-|$)/i.test(navigator.language || '');
const t = isChinese ? {
  archive:'3D坦克 · 玩家收集', title:'电影级宣传片合集',
  description:'玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。',
  filters:'系列筛选', list:'宣传片列表', search:'搜索宣传片名称', maps:'地图与车库', events:'活动',
  series:(name) => `${name} 系列`, playName:(name) => `播放 ${name}`, closeName:(name) => `收起 ${name}`,
  unclassified:'未分类', loading:'正在读取宣传片…', loadError:'加载失败',
  loadFailure:'加载失败，请稍后重试。',
  badList:'加载失败，请稍后重试。', catalogFailure:'加载失败，请稍后重试。', badCatalog:'加载失败，请稍后重试。', noResults:'没有找到符合条件的宣传片。',
  count:(shown,total) => `显示 ${shown} 个 · 共 ${total} 个`,
  play:'播放', pause:'暂停', seek:'播放进度',
  mute:'静音', unmute:'取消静音', volume:'音量', download:'下载视频', fullscreen:'全屏', exitFullscreen:'退出全屏', close:'关闭播放器',
  buffering:'缓冲中…', speedUnavailable:'缓冲中 · 无法测量加载速度', transfer:(value) => `加载速度 ${value}`,
} : {
  archive:'Tanki Online · Fan collection', title:'Cinematic promo collection',
  description:'Official promos covering skins, equipment, maps, and events, collected by a fan. This is not an official release.',
  filters:'Series filters', list:'Promo list', search:'Search promo titles', maps:'Maps & garages', events:'Events',
  series:(name) => `${name} series`, playName:(name) => `Play ${name}`, closeName:(name) => `Collapse ${name}`,
  unclassified:'Unclassified', loading:'Loading promos…', loadError:'Loading failed',
  loadFailure:'Unable to load. Please try again later.',
  badList:'Unable to load. Please try again later.', catalogFailure:'Unable to load. Please try again later.', badCatalog:'Unable to load. Please try again later.', noResults:'No promos match your selection.',
  count:(shown,total) => `Showing ${shown} of ${total}`,
  play:'Play', pause:'Pause', seek:'Playback position',
  mute:'Mute', unmute:'Unmute', volume:'Volume', download:'Download video', fullscreen:'Fullscreen', exitFullscreen:'Exit fullscreen', close:'Close player',
  buffering:'Buffering…', speedUnavailable:'Buffering · Speed unavailable', transfer:(value) => `Loading ${value}`,
};

document.documentElement.lang = isChinese ? 'zh-CN' : 'en';
document.title = isChinese ? '电影级宣传片合集' : 'Cinematic promo collection';

function localize(root) {
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  root.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t[el.dataset.i18nPlaceholder]; });
}
localize(document);

function classify(name) {
  const entry = catalogByName.get(name);
  if (!entry) return { skins: [], equipment: [], category: 'events', displayName: name, zhName: '', known: false };
  const series = entry.series ? SKIN_SERIES.find(item => item.key === entry.series) : null;
  const equipment = entry.equipment.map(key => EQUIPMENT.find(item => item.key === key)).filter(Boolean);
  return { skins: series ? [series] : [], equipment, category: series ? null : (entry.category || 'events'), displayName: isChinese ? entry.zh : name, zhName: entry.zh, known: true };
}

function image(kind, item) {
  const img = document.createElement('img');
  img.src = `/${kind === 'skin' ? 'skin_icons' : 'equipment_icons'}/${item.icon}`;
  img.alt = ''; img.loading = 'lazy';
  img.addEventListener('error', () => { img.hidden = true; });
  return img;
}

function icon(name) {
  const el = document.createElement('span'); el.className = 'material-symbols-rounded';
  el.textContent = name; el.setAttribute('aria-hidden','true'); return el;
}

const filters = document.getElementById('filters'), list = document.getElementById('list');
const search = document.getElementById('search'), status = document.getElementById('status');
let videos = [], activeFilter = 'standard', activePlayer = null;

status.textContent = t.loading;

const STREAM_WORKER = '/promo-videos/stream-sw.js?v=6';
const meterReady = (async () => {
  if (!('serviceWorker' in navigator) || typeof ReadableStream === 'undefined') return false;
  try {
    const registration = await navigator.serviceWorker.register(STREAM_WORKER, {scope:'/promo-videos/'});
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller?.scriptURL.includes(STREAM_WORKER)) return true;
    return await new Promise(resolve => {
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(timer); navigator.serviceWorker.removeEventListener('controllerchange', check); resolve(!!navigator.serviceWorker.controller?.scriptURL.includes(STREAM_WORKER)); };
      const check = () => { if (navigator.serviceWorker.controller?.scriptURL.includes(STREAM_WORKER)) finish(); };
      const timer = setTimeout(finish, 3500);
      navigator.serviceWorker.addEventListener('controllerchange', check);
      check();
    });
  } catch { return false; }
})();

function formatRate(bytesPerSecond) {
  if (!Number.isFinite(bytesPerSecond) || bytesPerSecond < 0) return '';
  return bytesPerSecond >= 1024 * 1024 ? `${(bytesPerSecond / 1024 / 1024).toFixed(2)} MB/s` : `${(bytesPerSecond / 1024).toFixed(0)} KB/s`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', event => {
  const data = event.data;
  if (data?.type === 'promo-transfer' && activePlayer?.session === data.session) activePlayer.transfer(data);
});

function closePlayer(restoreFocus = false) {
  if (!activePlayer) return;
  const { video, panel, trigger, fullHandler, cleanup, itemName, session } = activePlayer;
  activePlayer = null;
  if (session && 'serviceWorker' in navigator) {
    try { navigator.serviceWorker.controller?.postMessage({type:'promo-cancel',session}); } catch {}
  }
  cleanup();
  if (document.fullscreenElement === panel && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  document.removeEventListener('fullscreenchange', fullHandler);
  video.pause(); video.removeAttribute('src'); video.load(); panel.remove();
  trigger.setAttribute('aria-expanded','false'); trigger.setAttribute('aria-label',t.playName(itemName));
  if (restoreFocus) trigger.focus();
}

function makeFilter(key, label, node) {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'filter';
  button.setAttribute('aria-label', label); button.setAttribute('aria-pressed', String(!search.value.trim() && activeFilter === key));
  button.title = label; button.append(node);
  button.addEventListener('click', () => { activeFilter = key; search.value = ''; renderFilters(); renderList(); });
  filters.append(button);
}

function renderFilters() {
  filters.replaceChildren();
  const available = SKIN_SERIES.filter(series => series.icon && videos.some(v => v.skins.some(x => x.key === series.key)));
  const extras = [
    {key:'maps', label:t.maps, icon:'map'},
    {key:'events', label:t.events, icon:'celebration'},
  ].filter(category => videos.some(v => v.category === category.key));
  if (!available.some(series => series.key === activeFilter) && !extras.some(category => category.key === activeFilter)) {
    activeFilter = available[0]?.key || extras[0]?.key || '';
  }
  for (const series of available) makeFilter(series.key, t.series(series.key.replace(/_/g,' ')), image('skin',series));
  for (const category of extras) makeFilter(category.key, category.label, icon(category.icon));
}

function filteredVideos() {
  const word = search.value.trim().toLocaleLowerCase();
  return videos.filter(v => {
    if (word) return v.name.toLocaleLowerCase().includes(word) || v.zhName.toLocaleLowerCase().includes(word);
    return v.category === activeFilter || v.skins.some(s => s.key === activeFilter);
  });
}

function renderList() {
  closePlayer(); list.replaceChildren();
  const shown = filteredVideos(); status.textContent = t.count(shown.length, videos.length);
  if (!shown.length) { const message = document.createElement('div'); message.className = 'message'; message.textContent = t.noResults; list.append(message); return; }
  for (const item of shown) {
    const row = document.createElement('article'); row.className = 'video-row';
    const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'row-button';
    trigger.setAttribute('aria-expanded','false'); trigger.setAttribute('aria-label',t.playName(item.displayName));
    const title = document.createElement('span'); title.className = 'row-title'; title.textContent = item.displayName;
    const badges = document.createElement('span'); badges.className = 'row-icons';
    for (const obj of item.equipment) {
      if (!obj.icon) continue;
      const badge = document.createElement('span'); badge.className = 'badge'; badge.append(image('equipment',obj)); badges.append(badge);
    }
    if (!item.known) { const tag = document.createElement('span'); tag.className = 'unknown'; tag.textContent = t.unclassified; badges.append(tag); }
    const expand = icon('expand_more'); expand.classList.add('row-expand');
    trigger.append(title,badges,expand); row.append(trigger);
    trigger.addEventListener('click', () => {
      if (activePlayer?.trigger === trigger) { closePlayer(true); return; }
      closePlayer(); openPlayer(item,row,trigger);
    });
    list.append(row);
  }
}

function formatTime(value) {
  if (!Number.isFinite(value) || value < 0) return '0:00';
  const sec = Math.floor(value), h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function openPlayer(item,row,trigger) {
  const panel = document.createElement('div'); panel.className = 'inline-player';
  panel.innerHTML = `
    <div class="player-frame">
      <video playsinline preload="metadata" tabindex="0" draggable="false" controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <div class="video-interaction" aria-hidden="true"></div>
      <div class="buffer-overlay" aria-hidden="true">
        <div class="buffer-chip">
          <span class="material-symbols-rounded buffer-spinner" aria-hidden="true">progress_activity</span>
          <span class="transfer-status"></span>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="seek-row">
        <span class="time current">0:00</span>
        <input class="range seek" type="range" min="0" max="0" step="any" value="0" disabled data-i18n-aria="seek">
        <span class="time duration">0:00</span>
      </div>
      <div class="controls-row">
        <button class="control mute" type="button" data-i18n-aria="mute"><span class="material-symbols-rounded" aria-hidden="true">volume_up</span></button>
        <input class="range volume" type="range" min="0" max="1" step="0.05" value="1" data-i18n-aria="volume">
        <button class="control main play" type="button" data-i18n-aria="play"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span></button>
        <a class="control download" data-i18n-aria="download" download><span class="material-symbols-rounded" aria-hidden="true">download</span></a>
        <button class="control full" type="button" data-i18n-aria="fullscreen"><span class="material-symbols-rounded" aria-hidden="true">fullscreen</span></button>
      </div>
    </div>`;
  localize(panel);
  
  const q = selector => panel.querySelector(selector), video = q('video'), seek = q('.seek'), current = q('.current'), duration = q('.duration');
  const play = q('.play'), playIcon = play.querySelector('.material-symbols-rounded'), mute = q('.mute'), vol = q('.volume'), volIcon = mute.querySelector('.material-symbols-rounded');
  const full = q('.full'), fullIcon = full.querySelector('.material-symbols-rounded');
  const download = q('.download'), surface = q('.video-interaction'), transferStatus = q('.transfer-status'), bufferOverlay = q('.buffer-overlay');
  
  download.href = videoApiUrl('video', item.name, true, item.displayName);
  download.download = item.displayName; download.title = t.download;
  
  const session = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
  let seeking = false, buffering = false, meterAvailable = false, transferTimer = null, bufferingDelay = null, progressFrame = null;
  let lastRate = '', lastRateTime = 0;
  
  video.setAttribute('aria-label', t.playName(item.displayName));
  const label = (button, text) => { button.setAttribute('aria-label',text); button.title = text; };

  function progress() {
    const total = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
    const position = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    seek.disabled = !total; seek.max = String(total); duration.textContent = formatTime(total);
    if (!seeking) seek.value = String(Math.min(position,total));
    current.textContent = formatTime(seeking ? Number(seek.value) : position);
    seek.style.setProperty('--progress', `${total ? Math.min(100, Math.max(0, Number(seek.value) / total * 100)) : 0}%`);
    seek.setAttribute('aria-valuetext', `${formatTime(Number(seek.value))} / ${formatTime(total)}`);
  }

  function updateProgressFrame() {
    progressFrame = null;
    if (video.paused || video.ended) return;
    progress();
    progressFrame = requestAnimationFrame(updateProgressFrame);
  }

  function startProgressFrames() {
    if (progressFrame === null && !video.paused && !video.ended) progressFrame = requestAnimationFrame(updateProgressFrame);
  }

  function stopProgressFrames() {
    if (progressFrame !== null) cancelAnimationFrame(progressFrame);
    progressFrame = null;
  }

  function setTransferStatus(text) {
    transferStatus.textContent = text;
    bufferOverlay.classList.toggle('is-visible', !!text);
    bufferOverlay.setAttribute('aria-hidden', String(!text));
  }

  function clearBuffering() {
    buffering = false;
    clearTimeout(bufferingDelay); bufferingDelay = null;
    clearTimeout(transferTimer); transferTimer = null;
    setTransferStatus('');
  }

  function updatePlay() { const paused = video.paused || video.ended; playIcon.textContent = paused ? 'play_arrow' : 'pause'; label(play,paused ? t.play : t.pause); }
  function updateVolume() { const effective = video.muted ? 0 : video.volume; vol.value = String(effective); vol.style.setProperty('--progress', `${effective * 100}%`); volIcon.textContent = effective === 0 ? 'volume_off' : effective < .5 ? 'volume_down' : 'volume_up'; label(mute,effective === 0 ? t.unmute : t.mute); }
  
  async function togglePlay() { try { if (video.paused || video.ended) await video.play(); else video.pause(); } catch { clearBuffering(); } }
  
  play.addEventListener('click',togglePlay);
  surface.addEventListener('click',() => { if (document.fullscreenElement === panel) panel.classList.toggle('controls-visible'); else togglePlay(); });
  
  for (const target of [video,surface]) {
    target.addEventListener('contextmenu',event => event.preventDefault());
    target.addEventListener('dragstart',event => event.preventDefault());
  }

  seek.addEventListener('pointerdown',() => { seeking = true; clearBuffering(); });
  for (const event of ['pointerup','pointercancel','change']) seek.addEventListener(event,() => {
    seeking = false; progress();
    if (!video.paused && !video.ended && video.readyState < 3) scheduleBuffering();
  });
  seek.addEventListener('input',() => { if (Number.isFinite(video.duration)) video.currentTime = Math.min(video.duration,Number(seek.value)); progress(); });
  vol.addEventListener('input',() => { video.volume = Number(vol.value); video.muted = video.volume === 0; });
  mute.addEventListener('click',() => { if (video.muted || video.volume === 0) { if (video.volume === 0) video.volume = 1; video.muted = false; } else video.muted = true; });

  for (const event of ['timeupdate','loadedmetadata','durationchange','emptied','seeked']) video.addEventListener(event,progress);
  video.addEventListener('play',() => { updatePlay(); startProgressFrames(); });
  for (const event of ['pause','ended']) video.addEventListener(event,() => {
    updatePlay(); stopProgressFrames(); progress(); clearBuffering();
  });
  video.addEventListener('volumechange',updateVolume);
  
  video.addEventListener('error',() => {
    if (meterAvailable && activePlayer?.video === video) {
      meterAvailable = false; activePlayer.session = null; lastRate = ''; clearTimeout(transferTimer); transferTimer = null;
      setTransferStatus(buffering && !video.paused ? t.speedUnavailable : '');
      video.src = videoApiUrl('video', item.name);
      video.load(); video.play().catch(() => {}); return;
    }
    clearBuffering();
  });

  function scheduleBuffering() {
    if (seeking || video.paused || video.ended || buffering || bufferingDelay !== null) return;
    bufferingDelay = setTimeout(() => {
      bufferingDelay = null;
      if (seeking || video.paused || video.ended || video.readyState >= 3) return;
      buffering = true;
      clearTimeout(transferTimer); transferTimer = null;
      const age = Date.now() - lastRateTime;
      if (!meterAvailable) setTransferStatus(t.speedUnavailable);
      else if (lastRate && age < 1800) {
        setTransferStatus(t.transfer(lastRate));
        transferTimer = setTimeout(() => {
          transferTimer = null;
          setTransferStatus(buffering && !video.paused && !video.ended ? t.buffering : '');
        }, 1800 - age);
      } else setTransferStatus(t.buffering);
    }, 450);
  }

  video.addEventListener('waiting',scheduleBuffering);
  video.addEventListener('seeked',() => {
    if (video.readyState >= 3) clearBuffering();
    else scheduleBuffering();
  });
  video.addEventListener('playing',() => { clearBuffering(); startProgressFrames(); });
  video.addEventListener('keydown',event => { if (event.key === ' ' || event.key === 'k') { event.preventDefault(); togglePlay(); } });

  function showFullscreenControls() {
    if (document.fullscreenElement === panel) panel.classList.add('controls-visible');
  }
  panel.addEventListener('focusin',showFullscreenControls);
  panel.addEventListener('keydown',showFullscreenControls);

  full.addEventListener('click',async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else if (panel.requestFullscreen) await panel.requestFullscreen(); else if (video.webkitEnterFullscreen) { video.controls = true; video.webkitEnterFullscreen(); } } catch { video.controls = false; } });
  video.addEventListener('webkitendfullscreen',() => { video.controls = false; });

  const fullHandler = () => {
    const active = document.fullscreenElement === panel;
    fullIcon.textContent = active ? 'fullscreen_exit' : 'fullscreen'; label(full,active ? t.exitFullscreen : t.fullscreen);
    panel.classList.remove('controls-visible');
  };
  document.addEventListener('fullscreenchange',fullHandler);
  full.title = full.getAttribute('aria-label');

  row.append(panel); trigger.setAttribute('aria-expanded','true'); trigger.setAttribute('aria-label',t.closeName(item.displayName));
  
  const transfer = data => {
    if (data.event === 'speed') {
      const rate = formatRate(data.bytesPerSecond);
      if (!rate) return;
      lastRate = rate; lastRateTime = Date.now();
      if (!buffering || video.paused || video.ended) return;
      setTransferStatus(t.transfer(rate));
      clearTimeout(transferTimer);
      transferTimer = setTimeout(() => {
        transferTimer = null;
        setTransferStatus(buffering && !video.paused && !video.ended ? t.buffering : '');
      }, 1800);
    }
    if (data.event === 'error' && buffering && !video.paused && !video.ended) setTransferStatus(t.speedUnavailable);
  };

  activePlayer = {video,panel,trigger,fullHandler,session,transfer,itemName:item.displayName,cleanup:() => { clearBuffering(); stopProgressFrames(); }};
  updatePlay(); progress(); updateVolume();

  Promise.race([meterReady, new Promise(resolve => setTimeout(() => resolve(false), 5000))]).then(available => {
    if (activePlayer?.video !== video) return;
    meterAvailable = available;
    const source = available ? '/promo-videos/__stream?file=' + encodeURIComponent(item.name) + '&session=' + encodeURIComponent(session) : videoApiUrl('video', item.name);
    video.src = source; video.load();
    video.play().catch(() => {});
  });
}

search.addEventListener('input',() => { renderFilters(); renderList(); });

async function loadVideos() {
  try {
    const [response, catalogResponse] = await Promise.all([
      fetch(videoApiUrl('list'),{cache:'no-store'}),
      fetch('/promo-videos/catalog.json',{cache:'no-store'}),
    ]);
    if (!response.ok) throw new Error(t.loadFailure);
    if (!catalogResponse.ok) throw new Error(t.catalogFailure);
    const [data, catalog] = await Promise.all([response.json(), catalogResponse.json()]);
    if (!Array.isArray(data.videos)) throw new Error(t.badList);
    if (!Array.isArray(catalog)) throw new Error(t.badCatalog);
    
    catalogByName.clear();
    for (const entry of catalog) {
      if (!entry || typeof entry.name !== 'string' || typeof entry.zh !== 'string' ||
          !(entry.series === null || typeof entry.series === 'string') ||
          !Array.isArray(entry.equipment) || entry.equipment.some(key => typeof key !== 'string') ||
          catalogByName.has(entry.name) ||
          (entry.series && !SKIN_SERIES.some(series => series.key === entry.series)) ||
          (entry.category !== undefined && !['maps','events'].includes(entry.category)) ||
          (entry.series && entry.category !== undefined) ||
          entry.equipment.some(key => !EQUIPMENT.some(equipment => equipment.key === key))) throw new Error(t.badCatalog);
      catalogByName.set(entry.name, entry);
    }
    
    const driveFiles = data.videos.filter(v => typeof v.name === 'string');
    const byName = new Map();
    for (const file of driveFiles) {
      if (!byName.has(file.name)) byName.set(file.name, []);
      byName.get(file.name).push(file);
    }
    
    const arranged = [];
    for (const entry of catalog) arranged.push(...(byName.get(entry.name) || []));
    for (const file of driveFiles) if (!catalogByName.has(file.name)) arranged.push(file);
    videos = arranged.map(v => ({...v,...classify(v.name)}));
    renderFilters(); renderList();
  } catch (error) {
    status.textContent = t.loadError;
    const message = document.createElement('div'); message.className = 'message';
    message.textContent = error instanceof SyntaxError ? t.badCatalog :
      ([t.loadFailure,t.catalogFailure].some(text => error.message?.startsWith(text)) || error.message === t.badList || error.message === t.badCatalog ? error.message : t.loadFailure);
    list.replaceChildren(message);
  }
}
loadVideos();
</script>
</body>
</html>
