name = "testanki1"
compatibility_date = "2024-09-23"

# 1. 静态网页目录（托管 index.html、assets.json 等）
[assets]
directory = "."
binding = "ASSETS"

# 2. 绑定你的 KV 数据库
# 注意：如果你已经在 Cloudflare 控制台创建了 KV，把真实的 32 位 ID 填在此处；
# 或者直接在 Cloudflare Dashboard -> Workers & Pages -> testanki1 -> Settings -> Bindings 绑定，此处可不填 id
[[kv_namespaces]]
binding = "SFX_NAMES"
id = "18013c9b94ae41fd92a371abd9d1c811"

# 3. 免费版 SQLite Durable Object 绑定与迁移
[[durable_objects.bindings]]
name = "SFX_HUB"
class_name = "SfxHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SfxHub"]
