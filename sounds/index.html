<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D坦克音效展示</title>
<script>
  if (location.hostname.includes('github.io')) {
    location.replace(location.href.replace(location.host, 'testanki1.pages.dev'));
  }
</script>
<!-- 官方规范字体: Rubik 与 M PLUS 1p -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<style>
  /* ==========================================================================
     Tokens & 3D坦克品牌配色映射系统
     ========================================================================== */
  :root {
    /* 核心主色 & 容器 (Primary / Secondary / Tertiary) */
    --md-sys-color-primary: #76FF33;               /* 荧光绿 */
    --md-sys-color-on-primary: #003a00;
    --md-sys-color-primary-container: rgba(118, 255, 51, 0.14);
    --md-sys-color-on-primary-container: #8eff4c;

    --md-sys-color-secondary: #BFD5FF;             /* 冰蓝文字 */
    --md-sys-color-on-secondary: #002f6c;
    --md-sys-color-secondary-container: rgba(191, 213, 255, 0.12);
    --md-sys-color-on-secondary-container: #d9e4ff;

    --md-sys-color-tertiary: #00D4FF;              /* 水晶蓝 */
    --md-sys-color-tertiary-container: rgba(0, 212, 255, 0.14);
    --md-sys-color-on-tertiary-container: #70f0ff;

    --md-sys-color-error: #FF6666;                 /* 警告红 */
    --md-sys-color-error-container: rgba(255, 102, 102, 0.15);
    --md-sys-color-on-error: #5c0000;
    --md-sys-color-on-error-container: #ffb4ab;

    --md-sys-color-tankoins: #FFEE00;

    /* Tonal Surface 容器色阶 (Dark Theme) */
    --md-sys-color-surface: #001926;
    --md-sys-color-surface-dim: #00111a;
    --md-sys-color-surface-container-lowest: #000c14;
    --md-sys-color-surface-container-low: #041d2c;
    --md-sys-color-surface-container: #082638;
    --md-sys-color-surface-container-high: #0d3047;
    --md-sys-color-surface-container-highest: #143b55;

    --md-sys-color-outline: rgba(191, 213, 255, 0.18);
    --md-sys-color-outline-variant: rgba(191, 213, 255, 0.08);

    /* 状态层 (State Layers) */
    --md-sys-state-hover: rgba(255, 255, 255, 0.06);
    --md-sys-state-focus: rgba(255, 255, 255, 0.12);
    --md-sys-state-pressed: rgba(255, 255, 255, 0.14);

    /* 形状标度 (Shape Scale) */
    --md-sys-shape-corner-none: 0px;
    --md-sys-shape-corner-extra-small: 6px;
    --md-sys-shape-corner-small: 10px;
    --md-sys-shape-corner-medium: 14px;
    --md-sys-shape-corner-large: 20px;
    --md-sys-shape-corner-extra-large: 26px;
    --md-sys-shape-corner-full: 9999px;

    /* 物理动效系统 */
    --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
    --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1.0);
    --md-sys-motion-easing-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
    
    --md-sys-motion-duration-short: 200ms;
    --md-sys-motion-duration-medium: 350ms;
    --md-sys-motion-duration-long: 500ms;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Rubik', 'M PLUS 1p', sans-serif;
  }

  html {
    background-color: var(--md-sys-color-surface-dim);
    min-height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% -10%, #0c364f 0%, var(--md-sys-color-surface) 60%, var(--md-sys-color-surface-dim) 100%) no-repeat center top fixed;
    background-attachment: fixed;
    color: var(--md-sys-color-secondary);
    min-height: 100vh;
    padding: 24px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }

  input, button, select, textarea {
    font-family: inherit;
    outline: none;
  }

  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded' !important;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    vertical-align: middle;
    line-height: 1;
  }

  .container {
    max-width: 1380px;
    margin: 0 auto;
  }

  /* Header */
  .header-bar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }

  @media (min-width: 900px) {
    .header-bar {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    background: var(--md-sys-color-primary-container);
    border: 1.5px solid rgba(118, 255, 51, 0.4);
    color: var(--md-sys-color-primary);
    border-radius: var(--md-sys-shape-corner-large);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(118, 255, 51, 0.18);
    flex-shrink: 0;
  }

  .logo-mark .material-symbols-rounded {
    font-size: 28px;
  }

  .title-group h1 {
    font-size: 1.65rem;
    font-weight: 900;
    color: var(--md-sys-color-primary);
    letter-spacing: -0.5px;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .title-group .subtitle {
    font-size: 0.8rem;
    color: var(--md-sys-color-secondary);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
  }

  .auto-meta-badge {
    background: var(--md-sys-color-surface-container-high);
    border: 1px solid var(--md-sys-color-outline);
    color: var(--md-sys-color-primary);
    padding: 3px 10px;
    border-radius: var(--md-sys-shape-corner-full);
    font-size: 0.72rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .badge-pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--md-sys-color-primary);
    animation: dotPulse 1.4s infinite ease-in-out;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @media (min-width: 900px) {
    .toolbar {
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
  }

  .toolbar-search-row {
    width: 100%;
  }

  @media (min-width: 900px) {
    .toolbar-search-row {
      width: 260px;
    }
  }

  .search-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  .search-wrapper .leading-icon {
    position: absolute;
    left: 14px;
    color: var(--md-sys-color-secondary);
    opacity: 0.75;
    font-size: 20px;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 46px;
    background-color: var(--md-sys-color-surface-container);
    border: 1.5px solid transparent;
    border-radius: var(--md-sys-shape-corner-full);
    padding: 0 40px 0 42px;
    color: #ffffff;
    font-size: 0.88rem;
    font-weight: 500;
    outline: none;
    transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  }

  .search-input:hover {
    background-color: var(--md-sys-color-surface-container-high);
  }

  .search-input:focus {
    background-color: var(--md-sys-color-surface-container-highest);
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 0 0 3px var(--md-sys-color-primary-container);
  }

  .search-clear-btn {
    position: absolute;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: var(--md-sys-shape-corner-full);
    background: transparent;
    border: none;
    color: var(--md-sys-color-secondary);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-spring), color 0.15s;
  }

  .search-clear-btn.visible {
    display: flex;
    animation: popIn var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-spring);
  }

  .search-clear-btn:hover { color: #ffffff; background: var(--md-sys-state-hover); }
  .search-clear-btn:active { transform: scale(0.88); }

  .toolbar-controls-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  @media (min-width: 900px) {
    .toolbar-controls-row {
      width: auto;
    }
  }

  /* Segmented Buttons */
  .m3-segmented-group {
    display: inline-flex;
    align-items: center;
    height: 46px;
    background-color: var(--md-sys-color-surface-container);
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-full);
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .m3-segmented-btn {
    position: relative;
    height: 100%;
    background: transparent;
    border: none;
    border-radius: var(--md-sys-shape-corner-full);
    color: var(--md-sys-color-secondary);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  }

  .m3-segmented-btn:hover:not(.active) {
    background-color: var(--md-sys-state-hover);
    color: #ffffff;
  }

  .m3-segmented-btn:active {
    transform: scale(0.95);
  }

  .m3-segmented-btn.active {
    background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    box-shadow: 0 2px 8px rgba(118, 255, 51, 0.3);
  }

  /* Dropdown: 排序依据 */
  .m3-dropdown-wrapper {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .m3-dropdown-btn {
    width: 100%;
    height: 46px;
    background-color: var(--md-sys-color-surface-container);
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-full);
    padding: 0 14px;
    color: var(--md-sys-color-secondary);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    user-select: none;
    white-space: nowrap;
    transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  }

  .m3-dropdown-btn .btn-left-content {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ffffff;
  }

  .m3-dropdown-btn .sort-lead-icon {
    font-size: 19px;
    color: var(--md-sys-color-primary);
  }

  .m3-dropdown-btn:hover {
    background-color: var(--md-sys-color-surface-container-high);
    border-color: var(--md-sys-color-primary);
    color: #ffffff;
  }

  .m3-dropdown-btn:active {
    transform: scale(0.97);
  }

  .m3-dropdown-wrapper.open .m3-dropdown-btn {
    border-color: var(--md-sys-color-primary);
    background-color: var(--md-sys-color-surface-container-highest);
  }

  .m3-dropdown-btn .dropdown-arrow {
    font-size: 20px;
    transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-spring);
    color: var(--md-sys-color-secondary);
  }

  .m3-dropdown-wrapper.open .dropdown-arrow {
    transform: rotate(180deg);
    color: var(--md-sys-color-primary);
  }

  .m3-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 100%;
    min-width: 175px;
    background-color: var(--md-sys-color-surface-container-highest);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-large);
    padding: 6px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.94);
    transform-origin: top center;
    transition: opacity var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized-decelerate), 
                transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-spring), 
                visibility var(--md-sys-motion-duration-short);
    pointer-events: none;
  }

  .m3-dropdown-wrapper.open .m3-dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .m3-dropdown-item {
    position: relative;
    padding: 10px 14px;
    border-radius: var(--md-sys-shape-corner-medium);
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--md-sys-color-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s;
  }

  .m3-dropdown-item:hover {
    background-color: var(--md-sys-state-hover);
    color: #ffffff;
  }

  .m3-dropdown-item:active {
    transform: scale(0.97);
  }

  .m3-dropdown-item.active {
    background-color: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-primary);
    font-weight: 700;
  }

  .m3-dropdown-item .check-icon {
    font-size: 18px;
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
    transition: opacity var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized), 
                transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-spring);
    color: var(--md-sys-color-primary);
  }

  .m3-dropdown-item.active .check-icon {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* Order Icon Button */
  .order-icon-btn {
    position: relative;
    width: 46px;
    height: 46px;
    background-color: var(--md-sys-color-surface-container);
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-full);
    color: var(--md-sys-color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  }

  .order-icon-btn:hover {
    background-color: var(--md-sys-color-surface-container-high);
    border-color: var(--md-sys-color-primary);
  }

  .order-icon-btn:active {
    transform: scale(0.88);
  }

  .order-icon-btn .material-symbols-rounded {
    font-size: 22px;
    transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-spring);
  }

  /* Skeleton Loading State */
  .skeleton-card {
    background-color: var(--md-sys-color-surface-container-low);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .skeleton-shimmer {
    position: relative;
    background: rgba(191, 213, 255, 0.05);
    border-radius: var(--md-sys-shape-corner-full);
    overflow: hidden;
  }

  .skeleton-shimmer::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(118, 255, 51, 0.06) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: skeletonShimmer 1.6s infinite ease-in-out;
  }

  @keyframes skeletonShimmer {
    100% { transform: translateX(100%); }
  }

  .skeleton-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .skeleton-title-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .skeleton-title { width: 60%; height: 20px; }
  .skeleton-tag { width: 42px; height: 18px; border-radius: var(--md-sys-shape-corner-extra-small); }
  .skeleton-badge { width: 90px; height: 24px; }
  .skeleton-footer { width: 45%; height: 16px; }
  .skeleton-circle-btn { width: 44px; height: 44px; border-radius: var(--md-sys-shape-corner-full); flex-shrink: 0; }

  /* Empty State */
  .state-container {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    gap: 14px;
    text-align: center;
    padding: 40px 20px;
  }

  .state-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; }
  .state-desc { font-size: 0.86rem; color: var(--md-sys-color-secondary); opacity: 0.8; max-width: 340px; line-height: 1.5; }
  .empty-icon { font-size: 52px; color: var(--md-sys-color-secondary); opacity: 0.45; }

  /* SFX Grid & Cards */
  .sfx-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    min-height: 300px;
  }

  .sfx-card {
    background-color: var(--md-sys-color-surface-container-low);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    outline: none;
    transition: transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-spring), 
                background-color var(--md-sys-motion-duration-short), 
                border-color var(--md-sys-motion-duration-short), 
                box-shadow var(--md-sys-motion-duration-short);
    animation: fadeInCard 0.3s ease-out backwards;
  }

  @keyframes fadeInCard {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sfx-card:hover {
    transform: translateY(-3px);
    background-color: var(--md-sys-color-surface-container);
    border-color: var(--md-sys-color-outline);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
  }

  .sfx-card.active-play {
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 0 20px rgba(118, 255, 51, 0.35);
  }

  @keyframes cardUpdatePulse {
    0% {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 24px rgba(118, 255, 51, 0.6);
    }
    100% {
      border-color: var(--md-sys-color-outline-variant);
      box-shadow: none;
    }
  }

  .sfx-card.card-flash {
    animation: cardUpdatePulse 1.6s var(--md-sys-motion-easing-emphasized) forwards;
  }

  @keyframes titleSpringPop {
    0% {
      opacity: 0.1;
      transform: scale(0.85);
      filter: brightness(2) drop-shadow(0 0 12px var(--md-sys-color-primary));
    }
    60% {
      transform: scale(1.08);
      filter: brightness(1.3) drop-shadow(0 0 16px var(--md-sys-color-primary));
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: none;
    }
  }

  .title-updated-anim {
    display: inline-block;
    animation: titleSpringPop 0.55s var(--md-sys-motion-easing-spring) forwards;
  }

  .card-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }

  .id-header-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    width: 100%;
  }

  .id-title {
    font-size: 1.08rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }

  .custom-name-text {
    color: #ffffff;
    font-weight: 800;
    white-space: nowrap;
    display: inline-block;
    transform-origin: left center;
  }

  .id-prefix {
    color: var(--md-sys-color-primary);
    font-size: 0.8em;
  }

  .format-tag {
    background-color: var(--md-sys-color-tertiary-container);
    color: var(--md-sys-color-tertiary);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: var(--md-sys-shape-corner-extra-small);
    padding: 2px 6px;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .date-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: var(--md-sys-shape-corner-full);

    to { transform: scale(1); opacity: 1; }

  function getHighInt(longValBigInt) {
    return Number(longValBigInt >> 32n);
  }
  function getLowInt(longValBigInt) {
    return Number(longValBigInt & 0xFFFFFFFFn);
  }
  function toPath_v(id, version) {
    const idBigInt = BigInt(id);
    const versionBigInt = BigInt(version);
    const highId = getHighInt(idBigInt);
    const lowId = getLowInt(idBigInt);

    return [
      highId.toString(8),
      ((lowId >>> 16) & 0xFFFF).toString(8),
      ((lowId >>> 8) & 0xFF).toString(8),
      (lowId & 0xFF).toString(8),
      versionBigInt.toString(8)
    ].join("/");
  }

  // 时区安全的日期格式化（仅年月日，用于徽章展示）
  function formatDateOnly(ts) {
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return isZh ? '未知' : 'Unknown';
    try {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: targetTimeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(d);
      const getVal = type => parts.find(p => p.type === type)?.value || '';
      return `${getVal('year')}-${getVal('month')}-${getVal('day')}`;
    } catch (e) {
      return d.toISOString().split('T')[0];
    }
  }

  // 时区安全的完整日期时间格式化（年月日 时分秒，用于悬浮提示展示）
  function formatFullDateTime(ts) {
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return isZh ? '未知' : 'Unknown';
    try {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: targetTimeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(d);
      const getVal = type => parts.find(p => p.type === type)?.value || '00';
      return `${getVal('year')}-${getVal('month')}-${getVal('day')} ${getVal('hour')}:${getVal('minute')}:${getVal('second')}`;
    } catch (e) {
      return d.toISOString().replace('T', ' ').replace(/\..+/, '');
    }
  }

  function formatBytes(bytes) {
    if (!bytes || isNaN(bytes)) return '加载中...';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function formatSeconds(sec) {
    if (!sec || isNaN(sec)) return '';
    return sec < 10 ? `${sec.toFixed(1)}s` : `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  }

  function autoFitCardTitles() {
    if (autoFitRafId) cancelAnimationFrame(autoFitRafId);
    autoFitRafId = requestAnimationFrame(() => {
      const cards = document.querySelectorAll('.sfx-card');
      if (!cards.length) return;

      const measureList = [];
      cards.forEach(card => {
        const headerLine = card.querySelector('.id-header-line');
        if (!headerLine) return;

        const formatTag = headerLine.querySelector('.format-tag');
        const customNameEl = headerLine.querySelector('.custom-name-text');
        const idTitleEl = headerLine.querySelector('.id-title');
        const targetText = customNameEl || idTitleEl;
        if (!targetText) return;

        targetText.style.fontSize = ''; 
        measureList.push({ headerLine, formatTag, targetText });
      });

      const updateList = [];
      measureList.forEach(({ headerLine, formatTag, targetText }) => {
        const tagWidth = formatTag ? formatTag.offsetWidth : 0;
        const gap = 8;
        const availableWidth = headerLine.clientWidth - tagWidth - gap;

        if (availableWidth <= 20) return;

        const naturalWidth = targetText.scrollWidth;

        if (naturalWidth > availableWidth) {
          const computedStyle = window.getComputedStyle(targetText);
          const baseFontSize = parseFloat(computedStyle.fontSize) || 17;
          const scaleRatio = availableWidth / naturalWidth;
          const minFontSize = 9.5;
          const targetFontSize = Math.max(minFontSize, baseFontSize * scaleRatio * 0.96);

          updateList.push({ targetText, fontSize: `${targetFontSize.toFixed(1)}px` });
        }
      });

      updateList.forEach(({ targetText, fontSize }) => {
        targetText.style.fontSize = fontSize;
      });
    });
  }

  function updateSingleCardTitle(id, newName) {

  function initRealtimeSyncEngine() {
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let wsHost = location.host;
    if (WORKER_API_BASE) {
      wsHost = WORKER_API_BASE.replace(/^https?:\/\//, '');
    }
    const wsUrl = `${wsProtocol}//${wsHost}/api/sfx-ws?lang=${currentLangCode}`;

    function connect() {
      if (sfxSocket && (sfxSocket.readyState === WebSocket.OPEN || sfxSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      sfxSocket = new WebSocket(wsUrl);

      sfxSocket.onopen = () => {
        clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (sfxSocket && sfxSocket.readyState === WebSocket.OPEN) {
            sfxSocket.send(JSON.stringify({ type: 'ping' }));
          }
        }, 30000);
      };

      sfxSocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'sfx_update') {
            if (data.lang && data.lang !== currentLangCode) return;
            updateSingleCardTitle(data.id, data.name);
          }
        } catch (e) {
          console.error('[SFX Push] 解析失败:', e);
        }
      };

      sfxSocket.onclose = () => {
        clearInterval(pingInterval);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      };

      sfxSocket.onerror = () => {
        if (sfxSocket) sfxSocket.close();
      };
    }

    connect();

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && (!sfxSocket || sfxSocket.readyState === WebSocket.CLOSED)) {
        connect();
      }
    });

    window.addEventListener('focus', () => {
      if (!sfxSocket || sfxSocket.readyState === WebSocket.CLOSED) {
        connect();
      }
    });
  }

  async function loadCustomNames() {
    try {
      const url = (WORKER_API_BASE ? `${WORKER_API_BASE}/api/sfx-names` : '/api/sfx-names') + `?lang=${currentLangCode}`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      const resp = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (resp.ok) {
        customNames = await resp.json();
      }
    } catch (e) {
      console.warn('获取自定义名称跳过或失败:', e);
    }
  }

        return {

  async function ensureMetaLoaded(item) {
    if (item.metaLoaded) return;
    const metaUrl = `https://${serverDomain}/${item.path}/meta.info`;
    const resp = await fetch(metaUrl, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    let targetFile = Array.isArray(data) ? data[0] : (data && data.name ? data : null);
    if (!targetFile || !targetFile.name) throw new Error('meta.info missing file');

    let name = targetFile.name;
    let format = name.split('.').pop().toUpperCase();
    if (format === 'SWF') {
      name = name.replace(/\.swf$/i, '.mp3');
      format = 'MP3';
    }

    item.size = targetFile.size || 0;
    item.format = format;
    item.audioUrl = `https://${serverDomain}/${item.path}/${name}`;
    item.metaLoaded = true;

    updateCardMetaDisplay(item);
  }

  async function preloadAllMetaInfo() {
    const concurrency = 12;
    let idx = 0;
    async function worker() {
      while (idx < items.length) {
        const it = items[idx++];
        try {
          await ensureMetaLoaded(it);
        } catch (e) {}
      }
    }
    await Promise.all(Array.from({ length: concurrency }, () => worker()));
  }

  function loadAudioDuration(item) {
    return new Promise(async (resolve) => {
      if (item.duration > 0) return resolve(item.duration);
      if (!item.audioUrl) await ensureMetaLoaded(item);

      const temp = new Audio();
      temp.preload = 'metadata';
      temp.src = item.audioUrl;
      temp.onloadedmetadata = () => {
        item.duration = temp.duration;
        resolve(item.duration);
      };
      temp.onerror = () => {
        item.duration = 0.1;
        resolve(0.1);
      };
    });
  }

  function startOrbitalLoop() {
    if (isAnimationFrameActive) return;
    isAnimationFrameActive = true;

    function frame() {
      let activeCount = 0;

      activePlayInstances.forEach((instances, itemId) => {
        const dotsContainer = document.getElementById(`dots-${itemId}`);
        if (!dotsContainer) return;

        instances.forEach(inst => {
          if (inst.audio.paused && inst.audio.currentTime >= (inst.duration || 0.1)) {
            if (inst.dotEl && inst.dotEl.parentNode) {
              inst.dotEl.parentNode.removeChild(inst.dotEl);
            }
            instances.delete(inst);
          } else {
            activeCount++;
            const progress = inst.duration > 0 ? Math.min(inst.audio.currentTime / inst.duration, 1) : 0;
            const angle = progress * 2 * Math.PI;
            const cx = 25 + 20 * Math.cos(angle);
            const cy = 25 + 20 * Math.sin(angle);
            inst.dotEl.setAttribute('cx', cx.toFixed(2));
            inst.dotEl.setAttribute('cy', cy.toFixed(2));
          }
        });

        if (instances.size === 0) {
          const cardEl = document.getElementById(`card-${itemId}`);
          if (cardEl) cardEl.classList.remove('is-playing');
        }
      });

      if (activeCount > 0) {
        requestAnimationFrame(frame);
      } else {
        isAnimationFrameActive = false;
      }
    }

    requestAnimationFrame(frame);
  }

  function stopAndClearSfx(item) {
    const instances = activePlayInstances.get(item.id);
    if (instances) {
      instances.forEach(inst => {
        try {
          inst.audio.pause();
          inst.audio.currentTime = 0;
        } catch (e) {}
        if (inst.dotEl && inst.dotEl.parentNode) {
          inst.dotEl.parentNode.removeChild(inst.dotEl);
        }
      });
      instances.clear();
    }

    const cardEl = document.getElementById(`card-${item.id}`);
    if (cardEl) {
      cardEl.classList.remove('is-playing', 'active-play');
    }
    const wrapperEl = document.getElementById(`wrapper-${item.id}`);
    if (wrapperEl) {
      wrapperEl.classList.remove('loading');
      item.isBuffering = false;
    }
  }

  async function triggerSfx(item, wrapperEl, cardEl) {
    if (item.isBuffering) return;

    cardEl.classList.remove('active-play');
    void cardEl.offsetWidth;
    cardEl.classList.add('active-play');
    setTimeout(() => cardEl.classList.remove('active-play'), 300);

    if (!item.audioUrl) {
      try {
        item.isBuffering = true;
        wrapperEl.classList.add('loading');
        await ensureMetaLoaded(item);
      } catch (e) {
        item.isBuffering = false;
        wrapperEl.classList.remove('loading');
        showToast('加载失败: ' + e.message);
        return;
      }
    }

    const audio = new Audio();
    audio.src = item.audioUrl;
    audio.preload = 'auto';

    const dotsLayer = document.getElementById(`dots-${item.id}`);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('class', 'play-dot');
    dot.setAttribute('r', '3');
    dot.setAttribute('cx', '25');
    dot.setAttribute('cy', '5');

    const instance = {
      audio: audio,
      dotEl: dot,
      duration: item.duration || 0
    };

    let isReady = false;
    const onPlayReady = () => {
      if (isReady) return;
      isReady = true;
      item.isBuffering = false;
      wrapperEl.classList.remove('loading');

      if (dotsLayer) dotsLayer.appendChild(dot);
      if (!activePlayInstances.has(item.id)) {
        activePlayInstances.set(item.id, new Set());
      }
      activePlayInstances.get(item.id).add(instance);

      cardEl.classList.add('is-playing');

      audio.play().catch(() => {});
      startOrbitalLoop();
    };

    if (audio.readyState >= 3) {
      onPlayReady();
    } else {
      item.isBuffering = true;
      wrapperEl.classList.add('loading');
      audio.addEventListener('canplay', onPlayReady, { once: true });
      audio.addEventListener('playing', onPlayReady, { once: true });
      audio.addEventListener('error', () => {
        item.isBuffering = false;
        wrapperEl.classList.remove('loading');
        showToast('音效加载失败');
      }, { once: true });
      audio.load();
    }

    audio.onloadedmetadata = () => {
      instance.duration = audio.duration;
      item.duration = audio.duration;
      updateCardMetaDisplay(item);
    };
  }

  function updateCardMetaDisplay(item) {
    const card = document.getElementById(`card-${item.id}`);
    if (!card) return;
    const formatEl = card.querySelector('.format-tag');
    if (formatEl) formatEl.textContent = item.format;
    const statsEl = card.querySelector('.meta-stats');
    if (statsEl) {
      const durText = item.duration ? ` • ${formatSeconds(item.duration)}` : '';
      statsEl.textContent = `${formatBytes(item.size)}${durText}`;
    }
    const downloadEl = card.querySelector('.btn-download');
    if (downloadEl && item.audioUrl) {
      downloadEl.href = item.audioUrl;
      downloadEl.setAttribute('download', `${item.id}.${item.format.toLowerCase()}`);
    }
  }

  function applySortAndRender() {
    const query = searchQuery.trim().toLowerCase();
    let list = items.filter(it => {
      if (currentFormatFilter !== 'all') {
        if (it.format.toLowerCase() !== currentFormatFilter.toLowerCase()) {
          return false;
        }
      }
      if (!query) return true;
      const alias = (customNames[it.id] || '').toLowerCase();
      return it.id.includes(query) || alias.includes(query) || it.creationDateStr.includes(query) || it.updateDateTimeStr.includes(query);
    });

    list.sort((a, b) => {
      let diff = 0;
      if (currentSortKey === 'creationDate') {
        if (a.isLegacy && !b.isLegacy) diff = -1;
        else if (!a.isLegacy && b.isLegacy) diff = 1;
        else if (a.isLegacy && b.isLegacy) diff = Number(BigInt(a.id) - BigInt(b.id));
        else diff = a.creationTime - b.creationTime;
      } else if (currentSortKey === 'updateDate') {
        diff = a.updateTime - b.updateTime;
      } else if (currentSortKey === 'name') {
        const nameA = customNames[a.id] || a.id;
        const nameB = customNames[b.id] || b.id;
        diff = nameA.localeCompare(nameB, isZh ? 'zh-CN' : 'en', { numeric: true, sensitivity: 'base' });
      } else if (currentSortKey === 'duration') {
        diff = a.duration - b.duration;
      } else if (currentSortKey === 'fileSize') {
        diff = a.size - b.size;
      }

      return isDescending ? -diff : diff;
    });

    renderGrid(list);
  }

          </div>

          <div class="card-footer-line">
            <div class="meta-stats">
              ${formatBytes(item.size)}${item.duration ? ` • ${formatSeconds(item.duration)}` : ''}
            </div>
            <div class="action-buttons">
              <button class="icon-btn btn-rename" data-id="${item.id}" title="${currentLang.btnRename}">
                <span class="material-symbols-rounded">edit</span>
              </button>
              <button class="icon-btn btn-copy-url" data-id="${item.id}" title="${currentLang.btnCopy}">
                <span class="material-symbols-rounded">link</span>
              </button>
              <a class="icon-btn btn-download" href="${item.audioUrl || '#'}" download="${item.id}.${item.format.toLowerCase()}" target="_blank" title="${currentLang.btnDownload}">
                <span class="material-symbols-rounded">download</span>
              </a>
            </div>
          </div>
        </div>

        <div class="card-controls-right">
          <button class="btn-stop-sfx" data-id="${item.id}" title="${currentLang.stopSfx}">
            <span class="material-symbols-rounded">stop</span>
          </button>
          
          <div class="sfx-trigger-wrapper" id="wrapper-${item.id}">
            <svg class="orbital-svg" viewBox="0 0 50 50">
              <circle class="track-circle" cx="25" cy="25" r="20"></circle>
              <circle class="loading-spinner-circle" cx="25" cy="25" r="20"></circle>
              <g id="dots-${item.id}"></g>
            </svg>
            <button class="sfx-btn" data-id="${item.id}" title="${currentLang.playSfx}">
              <span class="material-symbols-rounded">play_arrow</span>
            </button>
          </div>
        </div>
      </div>
    `}).join('');

    list.forEach(item => {
      const cardEl = document.getElementById(`card-${item.id}`);
      const wrapperEl = document.getElementById(`wrapper-${item.id}`);
      const btnPlay = wrapperEl.querySelector('.sfx-btn');
      const btnStop = cardEl.querySelector('.btn-stop-sfx');
      const btnRename = cardEl.querySelector('.btn-rename');
      const dateBadge = cardEl.querySelector('.date-badge');

      btnPlay.addEventListener('click', () => {
        triggerSfx(item, wrapperEl, cardEl);
      });

      btnStop.addEventListener('click', (e) => {
        e.stopPropagation();
        stopAndClearSfx(item);
      });

      btnRename.addEventListener('click', (e) => {
        e.stopPropagation();
        activeRenameItemId = item.id;
        elRenameInput.value = customNames[item.id] || '';
        elRenameModal.classList.add('show');
        setTimeout(() => elRenameInput.focus(), 150);
      });

      const btnCopy = cardEl.querySelector('.btn-copy-url');
      btnCopy.addEventListener('click', async () => {
        if (!item.audioUrl) await ensureMetaLoaded(item);
        navigator.clipboard.writeText(item.audioUrl);
        showToast(currentLang.copied);
      });

      dateBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActive = dateBadge.classList.contains('tooltip-active');
        document.querySelectorAll('.date-badge.tooltip-active').forEach(b => b.classList.remove('tooltip-active'));
        if (!isActive) dateBadge.classList.add('tooltip-active');
      });
    });

    autoFitCardTitles();
  }

  elBtnRenameConfirm.addEventListener('click', async () => {
    if (!activeRenameItemId) return;
    const newName = elRenameInput.value.trim();
    const url = WORKER_API_BASE ? `${WORKER_API_BASE}/api/sfx-names` : '/api/sfx-names';

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: activeRenameItemId,
          name: newName,
          lang: currentLangCode
        })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      updateSingleCardTitle(activeRenameItemId, newName);

      showToast(currentLang.saveSuccess);
      elRenameModal.classList.remove('show');
    } catch (err) {
      showToast(currentLang.saveFail + err.message);
    }
  });

  elBtnRenameCancel.addEventListener('click', () => {
    elRenameModal.classList.remove('show');
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.date-badge.tooltip-active').forEach(b => b.classList.remove('tooltip-active'));
  });

  document.querySelectorAll('.m3-segmented-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetFormat = btn.getAttribute('data-format');
      if (currentFormatFilter === targetFormat) {
        currentFormatFilter = 'all';
        btn.classList.remove('active');
      } else {
        document.querySelectorAll('.m3-segmented-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFormatFilter = targetFormat;
      }
      applySortAndRender();
    });
  });

  elDropdownBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    elDropdownWrapper.classList.toggle('open');
  });

  document.addEventListener('click', () => {
    elDropdownWrapper.classList.remove('open');
  });

  document.querySelectorAll('.m3-dropdown-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const val = item.getAttribute('data-value');

      if (val === 'duration') {
        elDropdownWrapper.classList.remove('open');
        elModal.classList.add('show');
        return;
      }

      setSortKey(val);
    });
  });

  function setSortKey(key) {
    currentSortKey = key;
    document.querySelectorAll('.m3-dropdown-item').forEach(it => {
      const isMatch = it.getAttribute('data-value') === key;
      it.classList.toggle('active', isMatch);
    });
    elDropdownWrapper.classList.remove('open');
    applySortAndRender();
  }

  elBtnToggleOrder.addEventListener('click', () => {
    isDescending = !isDescending;
    elOrderIcon.textContent = isDescending ? 'arrow_downward' : 'arrow_upward';
    applySortAndRender();
  });

  elBtnModalCancel.addEventListener('click', () => {
    elModal.classList.remove('show');
  });

  elBtnModalConfirm.addEventListener('click', async () => {
    elModal.classList.remove('show');
    setSortKey('duration');

    showToast('正在解析音效时长...');
    const concurrency = 8;
    let idx = 0;

    async function worker() {
      while (idx < items.length) {
        const it = items[idx++];
        await loadAudioDuration(it);
      }
    }
    await Promise.all(Array.from({ length: concurrency }, () => worker()));
    applySortAndRender();
  });

  elSearchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    if (searchQuery.length > 0) {
      elSearchClearBtn.classList.add('visible');
    } else {
      elSearchClearBtn.classList.remove('visible');
    }
    applySortAndRender();
  });

  elSearchClearBtn.addEventListener('click', () => {
    elSearchInput.value = '';
    searchQuery = '';
    elSearchClearBtn.classList.remove('visible');
    elSearchInput.focus();
    applySortAndRender();
  });

  let toastTimer = null;
  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => elToast.classList.remove('show'), 2200);
  }

  window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
