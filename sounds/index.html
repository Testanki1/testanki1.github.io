<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D坦克音效展示</title>
<script>
  if (location.hostname.includes('github.io')) {
    location.replace(location.href.replace(location.host, 'testanki1.pages.dev'));
  }
</script>
<!-- 官方规范字体: Rubik 与 M PLUS 1p -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<style>
  /* ==========================================================================
     Tokens & 3D坦克品牌配色
     ========================================================================== */
  :root {
    --tk-neon-green: #76FF33;    /* 核心主色 Neon Green */
    --tk-bg-dark: #001926;       /* 背景深色 Background */
    --tk-bg-deep: #00111a;       /* 极深底色 */
    --tk-surface: #0a2536;       /* 卡片底色 */
    --tk-surface-hover: #0f344c; /* 卡片悬停色 */
    --tk-surface-elevated: rgba(10, 37, 54, 0.85); /* 浮层毛玻璃 */
    --tk-btn-ice: #BFD5FF;       /* 冰蓝文字与按钮 Buttons */
    --tk-crystals: #00D4FF;      /* 水晶蓝 Crystals */
    --tk-tankoins: #FFEE00;      /* 金币黄 Tankoins */
    --tk-alert: #FF6666;         /* 警告红 Alert */
    --tk-border: rgba(191, 213, 255, 0.18);
    --tk-border-glow: rgba(118, 255, 51, 0.45);

    /* 标准圆角 Token */
    --radius-xs: 6px;
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    --radius-pill: 9999px;

    /* 弹簧物理动效曲线 */
    --m3-motion-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --m3-motion-spring-subtle: cubic-bezier(0.25, 1.2, 0.5, 1);
    --m3-motion-standard: cubic-bezier(0.2, 0, 0, 1);
    --m3-motion-enter: cubic-bezier(0.05, 0.7, 0.1, 1.0);
    --m3-motion-exit: cubic-bezier(0.3, 0, 0.8, 0.15);
    --m3-duration-short: 180ms;
    --m3-duration-medium: 280ms;
    --m3-duration-long: 400ms;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Rubik', 'M PLUS 1p', sans-serif;
  }

  html {
    background-color: var(--tk-bg-dark);
    min-height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 0%, #082d42 0%, var(--tk-bg-dark) 70%, var(--tk-bg-deep) 100%) no-repeat center top fixed;
    background-attachment: fixed;
    background-size: 100vw 100vh;
    color: var(--tk-btn-ice);
    min-height: 100vh;
    padding: 20px 14px 80px;
  }

  input, button, select, textarea {
    font-family: inherit;
  }

  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded' !important;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    vertical-align: middle;
    line-height: 1;
  }

  .container {
    max-width: 1380px;
    margin: 0 auto;
  }

  /* ==========================================================================
     Header & Title Bar
     ========================================================================== */
  .header-bar {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1.5px solid var(--tk-border);
  }

  @media (min-width: 900px) {
    .header-bar {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 44px;
    height: 44px;
    background-color: var(--tk-neon-green);
    color: var(--tk-bg-dark);
    border-radius: var(--radius-m);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(118, 255, 51, 0.4);
    flex-shrink: 0;
  }

  .title-group h1 {
    font-size: 1.65rem;
    font-weight: 900;
    color: var(--tk-neon-green);
    letter-spacing: -0.5px;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .title-group .subtitle {
    font-size: 0.78rem;
    color: var(--tk-btn-ice);
    font-weight: 500;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .auto-meta-badge {
    background: rgba(118, 255, 51, 0.12);
    border: 1px solid var(--tk-neon-green);
    color: var(--tk-neon-green);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 0.72rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: opacity var(--m3-duration-short);
  }

  .badge-pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--tk-neon-green);
    animation: dotPulse 1.2s infinite ease-in-out;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ==========================================================================
     工具栏 (Toolbar & Controls)
     ========================================================================== */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  @media (min-width: 900px) {
    .toolbar {
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
  }

  .toolbar-search-row {
    width: 100%;
  }

  @media (min-width: 900px) {
    .toolbar-search-row {
      width: 240px;
    }
  }

  .search-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  .search-wrapper .leading-icon {
    position: absolute;
    left: 14px;
    color: var(--tk-btn-ice);
    opacity: 0.6;
    font-size: 18px;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 42px;
    background-color: var(--tk-bg-deep);
    border: 1.5px solid var(--tk-border);
    border-radius: var(--radius-pill);
    padding: 0 38px 0 38px;
    color: #ffffff;
    font-size: 0.86rem;
    outline: none;
    transition: border-color var(--m3-duration-short) var(--m3-motion-standard), box-shadow var(--m3-duration-short) var(--m3-motion-standard);
  }

  .search-input:focus {
    border-color: var(--tk-neon-green);
    box-shadow: 0 0 12px rgba(118, 255, 51, 0.3);
  }

  .search-clear-btn {
    position: absolute;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: var(--radius-pill);
    background: transparent;
    border: none;
    color: var(--tk-btn-ice);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform var(--m3-duration-short) var(--m3-motion-spring), color 0.15s;
  }

  .search-clear-btn.visible {
    display: flex;
    animation: popIn var(--m3-duration-short) var(--m3-motion-spring);
  }

  .search-clear-btn:hover { color: #ffffff; }
  .search-clear-btn:active { transform: scale(0.85); }

  .toolbar-controls-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  @media (min-width: 900px) {
    .toolbar-controls-row {
      width: auto;
    }
  }

  .m3-segmented-group {
    display: inline-flex;
    align-items: center;
    height: 42px;
    background-color: var(--tk-surface);
    border: 1.5px solid var(--tk-border);
    border-radius: var(--radius-pill);
    overflow: hidden;
    flex-shrink: 0;
  }

  .m3-segmented-btn {
    position: relative;
    height: 100%;
    background: transparent;
    border: none;
    color: var(--tk-btn-ice);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background-color var(--m3-duration-short) var(--m3-motion-standard), 
                color var(--m3-duration-short) var(--m3-motion-standard),
                transform var(--m3-duration-short) var(--m3-motion-spring);
  }

  .m3-segmented-btn:not(:last-child) {
    border-right: 1.5px solid var(--tk-border);
  }

  .m3-segmented-btn:hover {
    background-color: rgba(191, 213, 255, 0.08);
    color: #ffffff;
  }

  .m3-segmented-btn:active {
    transform: scale(0.94);
  }

  .m3-segmented-btn.active {
    background-color: var(--tk-neon-green);
    color: var(--tk-bg-dark);
  }

  /* 下拉选择器 */
  .m3-dropdown-wrapper {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .m3-dropdown-btn {
    width: 100%;
    height: 42px;
    background-color: var(--tk-surface);
    border: 1.5px solid var(--tk-border);
    border-radius: var(--radius-pill);
    padding: 0 14px;
    color: var(--tk-btn-ice);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    user-select: none;
    white-space: nowrap;
    transition: border-color var(--m3-duration-short) var(--m3-motion-standard), 
                box-shadow var(--m3-duration-short) var(--m3-motion-standard),
                transform var(--m3-duration-short) var(--m3-motion-spring);
  }

  .m3-dropdown-btn:hover {
    border-color: var(--tk-neon-green);
    color: #ffffff;
  }

  .m3-dropdown-btn:active {
    transform: scale(0.97);
  }

  .m3-dropdown-wrapper.open .m3-dropdown-btn {
    border-color: var(--tk-neon-green);
    box-shadow: 0 0 12px rgba(118, 255, 51, 0.25);
  }

  .m3-dropdown-btn .selected-text {
    color: var(--tk-neon-green);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .m3-dropdown-btn .dropdown-arrow {
    font-size: 20px;
    transition: transform var(--m3-duration-medium) var(--m3-motion-spring);
    color: var(--tk-btn-ice);
  }

  .m3-dropdown-wrapper.open .dropdown-arrow {
    transform: rotate(180deg);
    color: var(--tk-neon-green);
  }

  .m3-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 100%;
    min-width: 165px;
    background-color: var(--tk-surface-elevated);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--tk-neon-green);
    border-radius: var(--radius-m);
    padding: 6px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 0 16px rgba(118, 255, 51, 0.15);
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.92);
    transform-origin: top center;
    transition: opacity var(--m3-duration-short) var(--m3-motion-enter), 
                transform var(--m3-duration-medium) var(--m3-motion-spring), 
                visibility var(--m3-duration-short);
    pointer-events: none;
  }

  .m3-dropdown-wrapper.open .m3-dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .m3-dropdown-item {
    position: relative;
    padding: 10px 12px;
    border-radius: var(--radius-s);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--tk-btn-ice);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background-color 0.15s, color 0.15s, transform var(--m3-duration-short) var(--m3-motion-spring);
  }

  .m3-dropdown-item:hover {
    background-color: var(--tk-surface-hover);
    color: #ffffff;
  }

  .m3-dropdown-item:active {
    transform: scale(0.96);
  }

  .m3-dropdown-item.active {
    background-color: rgba(118, 255, 51, 0.16);
    color: var(--tk-neon-green);
    font-weight: 700;
  }

  .m3-dropdown-item .check-icon {
    font-size: 17px;
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
    transition: opacity var(--m3-duration-short) var(--m3-motion-standard), 
                transform var(--m3-duration-medium) var(--m3-motion-spring);
    color: var(--tk-neon-green);
  }

  .m3-dropdown-item.active .check-icon {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .order-icon-btn {
    position: relative;
    width: 42px;
    height: 42px;
    background-color: var(--tk-surface);
    border: 1.5px solid var(--tk-border);
    border-radius: var(--radius-pill);
    color: var(--tk-neon-green);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    transition: border-color var(--m3-duration-short) var(--m3-motion-standard), 
                transform var(--m3-duration-short) var(--m3-motion-spring), 
                background-color 0.15s;
  }

  .order-icon-btn:hover {
    border-color: var(--tk-neon-green);
    background-color: var(--tk-surface-hover);
  }

  .order-icon-btn:active {
    transform: scale(0.88);
  }

  .order-icon-btn .material-symbols-rounded {
    font-size: 20px;
    transition: transform var(--m3-duration-medium) var(--m3-motion-spring);
  }

  /* ==========================================================================
     页面加载状态与空状态 (Loading & Empty State)
     ========================================================================== */
  .state-container {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    gap: 16px;
    text-align: center;
    padding: 40px 20px;
  }

  .loading-spinner-box {
    position: relative;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loading-glow-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(118, 255, 51, 0.15);
    border-top-color: var(--tk-neon-green);
    animation: spinTrack 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    box-shadow: 0 0 16px rgba(118, 255, 51, 0.3);
  }

  .loading-inner-core {
    width: 20px;
    height: 20px;
    background-color: var(--tk-neon-green);
    border-radius: 50%;
    opacity: 0.8;
    animation: corePulse 1.4s ease-in-out infinite alternate;
    box-shadow: 0 0 12px var(--tk-neon-green);
  }

  @keyframes corePulse {
    0% { transform: scale(0.65); opacity: 0.4; }
    100% { transform: scale(1.1); opacity: 0.95; }
  }

  .state-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.2px;
  }

  .state-desc {
    font-size: 0.82rem;
    color: var(--tk-btn-ice);
    opacity: 0.75;
    max-width: 320px;
    line-height: 1.5;
  }

  .empty-icon {
    font-size: 48px;
    color: var(--tk-btn-ice);
    opacity: 0.4;
    margin-bottom: 4px;
  }

  /* ==========================================================================
     音效卡片网格与标题自适应样式
     ========================================================================== */
  .sfx-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    min-height: 300px;
  }

  .sfx-card {
    background-color: var(--tk-surface);
    border: 1.5px solid var(--tk-border);
    border-radius: var(--radius-l);
    padding: 14px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: relative;
    transition: transform var(--m3-duration-short) var(--m3-motion-spring), border-color var(--m3-duration-short), box-shadow var(--m3-duration-short);
    animation: fadeInCard 0.3s ease-out backwards;
  }

  @keyframes fadeInCard {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sfx-card:hover {
    transform: translateY(-2px);
    background-color: var(--tk-surface-hover);
    border-color: var(--tk-btn-ice);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  .sfx-card.active-play {
    border-color: var(--tk-neon-green);
    box-shadow: 0 0 18px var(--tk-border-glow);
  }

  @keyframes cardUpdatePulse {
    0% {
      border-color: var(--tk-neon-green);
      box-shadow: 0 0 22px rgba(118, 255, 51, 0.65);
    }
    100% {
      border-color: var(--tk-border);
      box-shadow: none;
    }
  }

  .sfx-card.card-flash {
    animation: cardUpdatePulse 1.6s var(--m3-motion-standard) forwards;
  }

  @keyframes titleSpringPop {
    0% {
      opacity: 0.1;
      transform: scale(0.85);
      filter: brightness(2) drop-shadow(0 0 12px var(--tk-neon-green));
    }
    60% {
      transform: scale(1.08);
      filter: brightness(1.4) drop-shadow(0 0 16px var(--tk-neon-green));
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: none;
    }
  }

  .title-updated-anim {
    display: inline-block;
    animation: titleSpringPop 0.55s var(--m3-motion-spring) forwards;
  }

  .card-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
    flex: 1;
  }

  .id-header-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-width: 0;
    width: 100%;
  }

  .id-title {
    font-size: 1.05rem;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }

  .custom-name-text {
    color: #ffffff;
    font-weight: 800;
    white-space: nowrap;
    display: inline-block;
    transform-origin: left center;
    transition: font-size 0.15s ease-out;
  }

  .id-prefix {
    color: var(--tk-neon-green);
    font-size: 0.8em;
  }

  .format-tag {
    background-color: rgba(0, 212, 255, 0.15);
    color: var(--tk-crystals);
    border: 1px solid rgba(0, 212, 255, 0.4);
    border-radius: var(--radius-xs);
    padding: 1px 5px;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .date-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    width: fit-content;
    user-select: none;
    transition: transform var(--m3-duration-short) var(--m3-motion-spring);
  }

  .date-badge:active { transform: scale(0.96); }

  .date-badge.legacy {
    background-color: rgba(255, 204, 0, 0.15);
    color: var(--tk-tankoins);
    border: 1px solid rgba(255, 204, 0, 0.4);
  }

  .date-badge.timestamp {
    background-color: rgba(191, 213, 255, 0.12);
    color: var(--tk-btn-ice);
    border: 1px solid rgba(191, 213, 255, 0.3);
  }

  .badge-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    width: 220px;
    background-color: var(--tk-bg-deep);
    border: 1.5px solid var(--tk-neon-green);
    border-radius: var(--radius-m);
    padding: 8px 10px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.85);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px) scale(0.95);
    transition: opacity var(--m3-duration-short) var(--m3-motion-enter), transform var(--m3-duration-short) var(--m3-motion-spring), visibility var(--m3-duration-short);
    pointer-events: none;
  }

  @media (hover: hover) {
    .date-badge:hover .badge-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
  }

  .date-badge.tooltip-active .badge-tooltip {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) scale(1) !important;
  }

  .tooltip-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    margin-bottom: 3px;
  }

  .tooltip-row:last-child { margin-bottom: 0; }
  .tooltip-label { color: var(--tk-btn-ice); opacity: 0.8; }
  .tooltip-val { color: #ffffff; font-weight: 700; }

  .card-footer-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 2px;
    font-size: 0.72rem;
  }

  .meta-stats {
    color: var(--tk-btn-ice);
    opacity: 0.75;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .action-buttons {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  const currentLang = isZh ? i18n.zh : i18n.en;

  function getHighInt(longValBigInt) {
    return Number(longValBigInt >> 32n);
  }
  function getLowInt(longValBigInt) {
    return Number(longValBigInt & 0xFFFFFFFFn);
  }
  function toPath_v(id, version) {
    const idBigInt = BigInt(id);
    const versionBigInt = BigInt(version);
    const highId = getHighInt(idBigInt);
    const lowId = getLowInt(idBigInt);

    return [
      highId.toString(8),
      ((lowId >>> 16) & 0xFFFF).toString(8),
      ((lowId >>> 8) & 0xFF).toString(8),
      (lowId & 0xFF).toString(8),
      versionBigInt.toString(8)
    ].join("/");
  }

  function formatDateOnly(ts) {
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '未知';
    const Y = d.getFullYear();
    const M = String(d.getMonth() + 1).padStart(2, '0');
    const D = String(d.getDate()).padStart(2, '0');
    return `${Y}-${M}-${D}`;
  }

  function formatFullDateTime(ts) {
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '未知';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function formatBytes(bytes) {
    if (!bytes || isNaN(bytes)) return '加载中...';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function formatSeconds(sec) {
    if (!sec || isNaN(sec)) return '';
    return sec < 10 ? `${sec.toFixed(1)}s` : `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  }

  let assetSetVersion = null;
  let items = [];
  let customNames = {};
  let currentSortKey = 'creationDate';
  let currentFormatFilter = 'all';
  let isDescending = true;
  let searchQuery = '';
  let activeRenameItemId = null;
  let lastSyncTimestamp = Date.now();

  const activePlayInstances = new Map();
  let isAnimationFrameActive = false;

  const elAppTitle = document.getElementById('appTitle');
  const elBundleBadge = document.getElementById('bundleVerBadge');
  const elTotalBadge = document.getElementById('totalCountBadge');
  const elSearchInput = document.getElementById('searchInput');
  const elSearchClearBtn = document.getElementById('searchClearBtn');
  const elGrid = document.getElementById('sfxGrid');
  const elToast = document.getElementById('toastBox');

  const elDropdownWrapper = document.getElementById('dropdownWrapper');
  const elDropdownBtn = document.getElementById('dropdownBtn');
  const elCurrentSortText = document.getElementById('currentSortText');
  const elSortPrefixText = document.getElementById('sortPrefixText');

  const elBtnToggleOrder = document.getElementById('btnToggleOrder');
  const elOrderIcon = document.getElementById('orderIcon');

  const elModal = document.getElementById('confirmModal');
  const elBtnModalCancel = document.getElementById('btnModalCancel');
  const elBtnModalConfirm = document.getElementById('btnModalConfirm');

  const elRenameModal = document.getElementById('renameModal');
  const elRenameInput = document.getElementById('renameInput');
  const elBtnRenameCancel = document.getElementById('btnRenameCancel');
  const elBtnRenameConfirm = document.getElementById('btnRenameConfirm');

  function autoFitCardTitles() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.sfx-card').forEach(card => {
        const headerLine = card.querySelector('.id-header-line');
        if (!headerLine) return;

        const customNameEl = headerLine.querySelector('.custom-name-text');
        const idTitleEl = headerLine.querySelector('.id-title');
        const targetText = customNameEl || idTitleEl;
        if (!targetText) return;

        targetText.style.fontSize = '';

        const formatTag = headerLine.querySelector('.format-tag');
        const tagWidth = formatTag ? (formatTag.offsetWidth + 10) : 0;
        const maxAvailableWidth = headerLine.clientWidth - tagWidth;

        if (maxAvailableWidth <= 0) return;

        const currentTextWidth = targetText.scrollWidth;

        if (currentTextWidth > maxAvailableWidth) {
          const computedStyle = window.getComputedStyle(targetText);
          const currentFontSize = parseFloat(computedStyle.fontSize);
          const scaleRatio = maxAvailableWidth / currentTextWidth;
          
          const minFontSize = 9.5; 
          const idealFontSize = Math.max(minFontSize, currentFontSize * scaleRatio * 0.96);
          
          targetText.style.fontSize = `${idealFontSize.toFixed(1)}px`;
        }
      });
    });
  }

  window.addEventListener('resize', autoFitCardTitles);

  function updateSingleCardTitle(id, newName) {
    const oldName = customNames[id] || '';
    const normalizedNew = newName || '';
    const isChanged = oldName !== normalizedNew;

    if (newName) {
      customNames[id] = newName;
    } else {
      delete customNames[id];
    }

    const card = document.getElementById(`card-${id}`);
    if (!card) return;

    const titleWrapper = card.querySelector('.id-title');
    if (titleWrapper) {
      titleWrapper.title = newName ? `${newName} (ID: ${id})` : id;
      titleWrapper.innerHTML = newName 
        ? `<span class="custom-name-text">${newName}</span>` 
        : `<span class="id-prefix">ID:</span><span>${id}</span>`;

      if (isChanged) {
        const animTarget = titleWrapper.querySelector('.custom-name-text') || titleWrapper;
        animTarget.classList.remove('title-updated-anim');
        void animTarget.offsetWidth;
        animTarget.classList.add('title-updated-anim');

        card.classList.remove('card-flash');
        void card.offsetWidth;
        card.classList.add('card-flash');
      }
    }

    autoFitCardTitles();
  }

  async function checkRemoteDelta() {
    try {
      const url = WORKER_API_BASE 
        ? `${WORKER_API_BASE}/api/sfx-sync?since=${lastSyncTimestamp}` 
        : `/api/sfx-sync?since=${lastSyncTimestamp}`;
      
      const resp = await fetch(url);
      if (resp.ok) {
        const data = await resp.json();
        if (data.changed) {
          lastSyncTimestamp = data.ts || Date.now();
          if (data.changes && Array.isArray(data.changes)) {
            data.changes.forEach(ch => {
              updateSingleCardTitle(ch.id, ch.name);
            });
          }
        }
      }
    } catch (e) {}
  }

  function initRealtimeSyncEngine() {
    setInterval(checkRemoteDelta, 2500);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkRemoteDelta();
    });

    window.addEventListener('focus', () => {
      checkRemoteDelta();
    });
  }

  async function loadCustomNames() {
    try {
      const url = WORKER_API_BASE ? `${WORKER_API_BASE}/api/sfx-names` : '/api/sfx-names';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000);

      const resp = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (resp.ok) {
        customNames = await resp.json();
      }
    } catch (e) {
      console.warn('获取自定义名称跳过或失败:', e);
    }
  }

  async function initApp() {
    elAppTitle.textContent = currentLang.title;
    elSearchInput.placeholder = currentLang.searchPlaceholder;
    elSortPrefixText.textContent = currentLang.sortPrefix;
    elCurrentSortText.textContent = currentLang.creationDate;

    // 语言初始化时配置加载文本
    const loadingTitleEl = document.getElementById('loadingTextTitle');
    const loadingDescEl = document.getElementById('loadingTextDesc');
    if (loadingTitleEl) loadingTitleEl.textContent = currentLang.loadingTitle;
    if (loadingDescEl) loadingDescEl.textContent = currentLang.loadingDesc;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (currentLang[k]) el.textContent = currentLang[k];
    });

    await loadCustomNames();

    try {
      const resp = await fetch('assets.json');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      assetSetVersion = data.assetSetVersion || 7;

      items = (data.assets || []).map((entry, idx) => {
        const idBigInt = BigInt(entry.id);
        const isTimestampId = idBigInt >= 1000000000000n;
        const creationTime = isTimestampId ? Number(entry.id) : 0;
        const updateTime = Number(entry.version);

        return {
          index: idx,
          id: entry.id,
          version: entry.version,
          path: toPath_v(entry.id, entry.version),
          isLegacy: !isTimestampId,
          creationTime: creationTime,
          updateTime: updateTime,
          creationDateStr: isTimestampId ? formatDateOnly(creationTime) : currentLang.legacyBadge,
          updateDateTimeStr: formatFullDateTime(updateTime),
          audioUrl: null,
          duration: 0,
          size: 0,
          format: 'MP3',
          metaLoaded: false,
          isBuffering: false
        };
      });

      // 数据加载完成后，才展示版本号与实际总数量
      elBundleBadge.textContent = `${currentLang.setPrefix}${assetSetVersion}`;
      elTotalBadge.innerHTML = `<span class="material-symbols-rounded" style="font-size: 14px;">equalizer</span> ${items.length}${currentLang.sfxSuffix}`;

      applySortAndRender();
      preloadAllMetaInfo();
      initRealtimeSyncEngine();
    } catch (e) {
      console.error('加载 assets.json 失败:', e);
      elTotalBadge.textContent = '加载失败';
      elGrid.innerHTML = `
        <div class="state-container">
          <span class="material-symbols-rounded empty-icon" style="color: var(--tk-alert);">error</span>
          <div class="state-title" style="color: var(--tk-alert);">数据加载失败</div>
          <div class="state-desc">${e.message}</div>
        </div>
      `;
      showToast('加载音效数据失败: ' + e.message);
    }
  }

  async function ensureMetaLoaded(item) {
    if (item.metaLoaded) return;
    const metaUrl = `https://${serverDomain}/${item.path}/meta.info`;
    const resp = await fetch(metaUrl, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    let targetFile = Array.isArray(data) ? data[0] : (data && data.name ? data : null);
    if (!targetFile || !targetFile.name) throw new Error('meta.info missing file');

    let name = targetFile.name;
    let format = name.split('.').pop().toUpperCase();
    if (format === 'SWF') {
      name = name.replace(/\.swf$/i, '.mp3');
      format = 'MP3';
    }

    item.size = targetFile.size || 0;
    item.format = format;
    item.audioUrl = `https://${serverDomain}/${item.path}/${name}`;
    item.metaLoaded = true;

    updateCardMetaDisplay(item);
  }

  async function preloadAllMetaInfo() {
    const concurrency = 12;
    let idx = 0;
    async function worker() {
      while (idx < items.length) {
        const it = items[idx++];
        try {
          await ensureMetaLoaded(it);
        } catch (e) {}
      }
    }
    await Promise.all(Array.from({ length: concurrency }, () => worker()));
    applySortAndRender();
  }

  function loadAudioDuration(item) {
    return new Promise(async (resolve) => {
      if (item.duration > 0) return resolve(item.duration);
      if (!item.audioUrl) await ensureMetaLoaded(item);

      const temp = new Audio();
      temp.preload = 'metadata';
      temp.src = item.audioUrl;
      temp.onloadedmetadata = () => {
        item.duration = temp.duration;
        resolve(item.duration);
      };
      temp.onerror = () => {
        item.duration = 0.1;
        resolve(0.1);
      };
    });
  }

  function startOrbitalLoop() {
    if (isAnimationFrameActive) return;
    isAnimationFrameActive = true;

    function frame() {
      let activeCount = 0;

      activePlayInstances.forEach((instances, itemId) => {
        const dotsContainer = document.getElementById(`dots-${itemId}`);
        if (!dotsContainer) return;

        instances.forEach(inst => {
          if (inst.audio.paused && inst.audio.currentTime >= (inst.duration || 0.1)) {
            if (inst.dotEl && inst.dotEl.parentNode) {
              inst.dotEl.parentNode.removeChild(inst.dotEl);
            }
            instances.delete(inst);
          } else {
            activeCount++;
            const progress = inst.duration > 0 ? Math.min(inst.audio.currentTime / inst.duration, 1) : 0;
            const angle = progress * 2 * Math.PI;
            const cx = 25 + 20 * Math.cos(angle);
            const cy = 25 + 20 * Math.sin(angle);
            inst.dotEl.setAttribute('cx', cx.toFixed(2));
            inst.dotEl.setAttribute('cy', cy.toFixed(2));
          }
        });

        if (instances.size === 0) {
          const cardEl = document.getElementById(`card-${itemId}`);
          if (cardEl) cardEl.classList.remove('is-playing');
        }
      });

      if (activeCount > 0) {
        requestAnimationFrame(frame);
      } else {
        isAnimationFrameActive = false;
      }
    }

    requestAnimationFrame(frame);
  }

  function stopAndClearSfx(item) {
    const instances = activePlayInstances.get(item.id);
    if (instances) {
      instances.forEach(inst => {
        try {
          inst.audio.pause();
          inst.audio.currentTime = 0;
        } catch (e) {}
        if (inst.dotEl && inst.dotEl.parentNode) {
          inst.dotEl.parentNode.removeChild(inst.dotEl);
        }
      });
      instances.clear();
    }

    const cardEl = document.getElementById(`card-${item.id}`);
    if (cardEl) {
      cardEl.classList.remove('is-playing', 'active-play');
    }
    const wrapperEl = document.getElementById(`wrapper-${item.id}`);
    if (wrapperEl) {
      wrapperEl.classList.remove('loading');
      item.isBuffering = false;
    }
  }

  async function triggerSfx(item, wrapperEl, cardEl) {
    if (item.isBuffering) return;

    cardEl.classList.remove('active-play');
    void cardEl.offsetWidth;
    cardEl.classList.add('active-play');
    setTimeout(() => cardEl.classList.remove('active-play'), 300);

    if (!item.audioUrl) {
      try {
        item.isBuffering = true;
        wrapperEl.classList.add('loading');
        await ensureMetaLoaded(item);
      } catch (e) {
        item.isBuffering = false;
        wrapperEl.classList.remove('loading');
        showToast('加载失败: ' + e.message);
        return;
      }
    }

    const audio = new Audio();
    audio.src = item.audioUrl;
    audio.preload = 'auto';

    const dotsLayer = document.getElementById(`dots-${item.id}`);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('class', 'play-dot');
    dot.setAttribute('r', '3');
    dot.setAttribute('cx', '25');
    dot.setAttribute('cy', '5');

    const instance = {
      audio: audio,
      dotEl: dot,
      duration: item.duration || 0
    };

    let isReady = false;
    const onPlayReady = () => {
      if (isReady) return;
      isReady = true;
      item.isBuffering = false;
      wrapperEl.classList.remove('loading');

      if (dotsLayer) dotsLayer.appendChild(dot);
      if (!activePlayInstances.has(item.id)) {
        activePlayInstances.set(item.id, new Set());
      }
      activePlayInstances.get(item.id).add(instance);

      cardEl.classList.add('is-playing');

      audio.play().catch(() => {});
      startOrbitalLoop();
    };

    if (audio.readyState >= 3) {
      onPlayReady();
    } else {
      item.isBuffering = true;
      wrapperEl.classList.add('loading');
      audio.addEventListener('canplay', onPlayReady, { once: true });
      audio.addEventListener('playing', onPlayReady, { once: true });
      audio.addEventListener('error', () => {
        item.isBuffering = false;
        wrapperEl.classList.remove('loading');
        showToast('音效加载失败');
      }, { once: true });
      audio.load();
    }

    audio.onloadedmetadata = () => {
      instance.duration = audio.duration;
      item.duration = audio.duration;
      updateCardMetaDisplay(item);
    };
  }

  function updateCardMetaDisplay(item) {
    const card = document.getElementById(`card-${item.id}`);
    if (!card) return;
    const formatEl = card.querySelector('.format-tag');
    if (formatEl) formatEl.textContent = item.format;
    const statsEl = card.querySelector('.meta-stats');
    if (statsEl) {
      const durText = item.duration ? ` • ${formatSeconds(item.duration)}` : '';
      statsEl.textContent = `${formatBytes(item.size)}${durText}`;
    }
    const downloadEl = card.querySelector('.btn-download');
    if (downloadEl && item.audioUrl) {
      downloadEl.href = item.audioUrl;
      downloadEl.setAttribute('download', `${item.id}.${item.format.toLowerCase()}`);
    }
  }

  function applySortAndRender() {
    const query = searchQuery.trim().toLowerCase();
    let list = items.filter(it => {
      if (currentFormatFilter !== 'all') {
        if (it.format.toLowerCase() !== currentFormatFilter.toLowerCase()) {
          return false;
        }
      }
      if (!query) return true;
      const alias = (customNames[it.id] || '').toLowerCase();
      return it.id.includes(query) || alias.includes(query) || it.creationDateStr.includes(query) || it.updateDateTimeStr.includes(query);
    });

    list.sort((a, b) => {
      let diff = 0;
      if (currentSortKey === 'creationDate') {
        if (a.isLegacy && !b.isLegacy) diff = -1;
        else if (!a.isLegacy && b.isLegacy) diff = 1;
        else if (a.isLegacy && b.isLegacy) diff = Number(BigInt(a.id) - BigInt(b.id));
        else diff = a.creationTime - b.creationTime;
      } else if (currentSortKey === 'updateDate') {
        diff = a.updateTime - b.updateTime;
      } else if (currentSortKey === 'duration') {
        diff = a.duration - b.duration;
      } else if (currentSortKey === 'fileSize') {
        diff = a.size - b.size;
      }

      return isDescending ? -diff : diff;
    });

    renderGrid(list);
  }

  function renderGrid(list) {
    if (list.length === 0) {
      elGrid.innerHTML = `
        <div class="state-container">
          <span class="material-symbols-rounded empty-icon">search_off</span>
          <div class="state-title">${currentLang.noResults}</div>
          <div class="state-desc">${currentLang.noResultsDesc}</div>
        </div>
      `;
      return;
    }

    elGrid.innerHTML = list.map(item => {
      const customName = customNames[item.id] || '';
      return `
      <div class="sfx-card ${activePlayInstances.get(item.id)?.size ? 'is-playing' : ''}" id="card-${item.id}">
        <div class="card-left">
          <div class="id-header-line">
            <div class="id-title" title="${customName ? customName + ' (ID: ' + item.id + ')' : item.id}">
              ${customName ? `<span class="custom-name-text">${customName}</span>` : `<span class="id-prefix">ID:</span><span>${item.id}</span>`}
            </div>
            <span class="format-tag">${item.format}</span>
          </div>

          <div class="date-badge ${item.isLegacy ? 'legacy' : 'timestamp'}" data-badge-id="${item.id}">
            <span class="material-symbols-rounded" style="font-size:13px;">
              ${item.isLegacy ? 'history_edu' : 'calendar_today'}
            </span>
            <span>${item.creationDateStr}</span>

            <div class="badge-tooltip">
              <div class="tooltip-row">
                <span class="tooltip-label">ID:</span>
                <span class="tooltip-val">${item.id}</span>
              </div>
              <div class="tooltip-row">
                <span class="tooltip-label">${currentLang.creationDateLabel}</span>
                <span class="tooltip-val">${item.isLegacy ? currentLang.legacyTooltip : formatFullDateTime(item.creationTime)}</span>
              </div>
              <div class="tooltip-row">
                <span class="tooltip-label">${currentLang.updateDateLabel}</span>
                <span class="tooltip-val">${item.updateDateTimeStr}</span>
              </div>
            </div>
          </div>

          <div class="card-footer-line">
            <div class="meta-stats">
              ${formatBytes(item.size)}${item.duration ? ` • ${formatSeconds(item.duration)}` : ''}
            </div>
            <div class="action-buttons">
              <button class="icon-btn btn-rename" data-id="${item.id}" title="自定义名称">
                <span class="material-symbols-rounded">edit</span>
              </button>
              <button class="icon-btn btn-copy-url" data-id="${item.id}" title="复制直链">
                <span class="material-symbols-rounded">link</span>
              </button>
              <a class="icon-btn btn-download" href="${item.audioUrl || '#'}" download="${item.id}.${item.format.toLowerCase()}" target="_blank" title="下载音效">
                <span class="material-symbols-rounded">download</span>
              </a>
            </div>
          </div>
        </div>

        <div class="card-controls-right">
          <button class="btn-stop-sfx" data-id="${item.id}" title="${currentLang.stopSfx}">
            <span class="material-symbols-rounded">stop</span>
          </button>
          
          <div class="sfx-trigger-wrapper" id="wrapper-${item.id}">
            <svg class="orbital-svg" viewBox="0 0 50 50">
              <circle class="track-circle" cx="25" cy="25" r="20"></circle>
              <circle class="loading-spinner-circle" cx="25" cy="25" r="20"></circle>
              <g id="dots-${item.id}"></g>
            </svg>
            <button class="sfx-btn" data-id="${item.id}" title="${currentLang.playSfx}">
              <span class="material-symbols-rounded">play_arrow</span>
            </button>
          </div>
        </div>
      </div>
    `}).join('');

    list.forEach(item => {
      const cardEl = document.getElementById(`card-${item.id}`);
      const wrapperEl = document.getElementById(`wrapper-${item.id}`);
      const btnPlay = wrapperEl.querySelector('.sfx-btn');
      const btnStop = cardEl.querySelector('.btn-stop-sfx');
      const btnRename = cardEl.querySelector('.btn-rename');
      const dateBadge = cardEl.querySelector('.date-badge');

      btnPlay.addEventListener('click', () => {
        triggerSfx(item, wrapperEl, cardEl);
      });

      btnStop.addEventListener('click', (e) => {
        e.stopPropagation();
        stopAndClearSfx(item);
      });

      btnRename.addEventListener('click', (e) => {
        e.stopPropagation();
        activeRenameItemId = item.id;
        elRenameInput.value = customNames[item.id] || '';
        elRenameModal.classList.add('show');
        setTimeout(() => elRenameInput.focus(), 150);
      });

      const btnCopy = cardEl.querySelector('.btn-copy-url');
      btnCopy.addEventListener('click', async () => {
        if (!item.audioUrl) await ensureMetaLoaded(item);
        navigator.clipboard.writeText(item.audioUrl);
        showToast(currentLang.copied);
      });

      dateBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActive = dateBadge.classList.contains('tooltip-active');
        document.querySelectorAll('.date-badge.tooltip-active').forEach(b => b.classList.remove('tooltip-active'));
        if (!isActive) dateBadge.classList.add('tooltip-active');
      });
    });

    autoFitCardTitles();
  }

  elBtnRenameConfirm.addEventListener('click', async () => {
    if (!activeRenameItemId) return;
    const newName = elRenameInput.value.trim();
    const url = WORKER_API_BASE ? `${WORKER_API_BASE}/api/sfx-names` : '/api/sfx-names';

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeRenameItemId, name: newName })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      updateSingleCardTitle(activeRenameItemId, newName);

      showToast(currentLang.saveSuccess);
      elRenameModal.classList.remove('show');
    } catch (err) {
      showToast(currentLang.saveFail + err.message);
    }
  });

  elBtnRenameCancel.addEventListener('click', () => {
    elRenameModal.classList.remove('show');
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.date-badge.tooltip-active').forEach(b => b.classList.remove('tooltip-active'));
  });

  document.querySelectorAll('.m3-segmented-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetFormat = btn.getAttribute('data-format');
      if (currentFormatFilter === targetFormat) {
        currentFormatFilter = 'all';
        btn.classList.remove('active');
      } else {
        document.querySelectorAll('.m3-segmented-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFormatFilter = targetFormat;
      }
      applySortAndRender();
    });
  });

  elDropdownBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    elDropdownWrapper.classList.toggle('open');
  });

  document.addEventListener('click', () => {
    elDropdownWrapper.classList.remove('open');
  });

  document.querySelectorAll('.m3-dropdown-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const val = item.getAttribute('data-value');
      const text = item.querySelector('.item-label').textContent;

      if (val === 'duration') {
        elDropdownWrapper.classList.remove('open');
        elModal.classList.add('show');
        return;
      }

      setSortKey(val, text);
    });
  });

  function setSortKey(key, text) {
    currentSortKey = key;
    elCurrentSortText.textContent = text;
    document.querySelectorAll('.m3-dropdown-item').forEach(it => {
      const isMatch = it.getAttribute('data-value') === key;
      it.classList.toggle('active', isMatch);
    });
    elDropdownWrapper.classList.remove('open');
    applySortAndRender();
  }

  elBtnToggleOrder.addEventListener('click', () => {
    isDescending = !isDescending;
    elOrderIcon.textContent = isDescending ? 'arrow_downward' : 'arrow_upward';
    applySortAndRender();
  });

  elBtnModalCancel.addEventListener('click', () => {
    elModal.classList.remove('show');
  });

  elBtnModalConfirm.addEventListener('click', async () => {
    elModal.classList.remove('show');
    setSortKey('duration', currentLang.duration);

    showToast('正在并发加载音效流时长...');
    const concurrency = 8;
    let idx = 0;

    async function worker() {
      while (idx < items.length) {
        const it = items[idx++];
        await loadAudioDuration(it);
      }
    }
    await Promise.all(Array.from({ length: concurrency }, () => worker()));
    applySortAndRender();
  });

  elSearchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    if (searchQuery.length > 0) {
      elSearchClearBtn.classList.add('visible');
    } else {
      elSearchClearBtn.classList.remove('visible');
    }
    applySortAndRender();
  });

  elSearchClearBtn.addEventListener('click', () => {
    elSearchInput.value = '';
    searchQuery = '';
    elSearchClearBtn.classList.remove('visible');
    elSearchInput.focus();
    applySortAndRender();
  });

  let toastTimer = null;
  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => elToast.classList.remove('show'), 2200);
  }

  window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
