name: Clean old resource files from Git history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean_history_resources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo
        shell: bash
        run: |
          set -e

          python3 -m pip install -q git-filter-repo

          echo "git-filter-repo 版本:"
          git filter-repo --version

      - name: Scan historical resources
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "扫描 Git 历史中的旧资源文件"
          echo "========================================"

          echo "清理前提交数量: $(git rev-list --count HEAD)"

          git rev-list --objects --all > /tmp/all-history-objects.txt

          echo "记录当前 main 分支中的所有 Blob..."
          git ls-tree -r HEAD | awk '{print $3}' > /tmp/current-blobs.txt

          python3 <<'PY'
          import re

          audio_pattern = re.compile(
              r'\.(mp3|wav|ogg|opus|m4a|aac|flac|aiff|aif|wma|mid|midi)$',
              re.IGNORECASE
          )

          def is_target_file(path):
              path_lower = path.lower()

              # 删除所有历史中的 map.bin
              if path_lower == "map.bin" or path_lower.endswith("/map.bin"):
                  return True

              # 删除 augments_icon 目录中的 SVG 和 TXT
              if re.search(r'(^|/)augments_icon(/|$)', path_lower):
                  if path_lower.endswith(".svg") or path_lower.endswith(".txt"):
                      return True

              # 删除所有目录中的音频文件
              if audio_pattern.search(path_lower):
                  return True

              # 明确匹配 sounds 目录中的音频文件
              if re.search(r'(^|/)sounds(/|$)', path_lower):
                  if audio_pattern.search(path_lower):
                      return True

              return False

          # 读取当前 main 分支中的所有 Blob
          current_blobs = set()

          with open("/tmp/current-blobs.txt", encoding="utf-8") as f:
              for line in f:
                  value = line.strip()

                  if value:
                      current_blobs.add(bytes.fromhex(value))

          target_blobs = set()
          target_paths = {}

          # 扫描所有可访问的 Git 历史对象
          with open("/tmp/all-history-objects.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.rstrip("\n")

                  if " " not in line:
                      continue

                  sha, path = line.split(" ", 1)

                  if is_target_file(path):
                      blob_id = bytes.fromhex(sha)

                      target_blobs.add(blob_id)
                      target_paths.setdefault(sha, path)

          # 当前 main 使用的 Blob 全部保留
          remove_blobs = target_blobs - current_blobs

          with open(
              "/tmp/remove-resource-blobs.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for blob_id in sorted(remove_blobs):
                  f.write(blob_id.hex() + "\n")

          print("历史目标资源 Blob 数量:", len(target_blobs))
          print("当前 main Blob 数量:", len(current_blobs))
          print("准备删除的旧资源 Blob 数量:", len(remove_blobs))

          print()
          print("准备删除的旧资源示例:")

          shown = 0

          for sha, path in sorted(target_paths.items()):
              if bytes.fromhex(sha) in remove_blobs:
                  print(" -", path)
                  shown += 1

                  if shown >= 100:
                      break
          PY

          remove_count=$(grep -c . /tmp/remove-resource-blobs.txt || true)

          echo
          echo "最终准备删除的旧资源 Blob: ${remove_count} 个"

      - name: Remove old resource blobs
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "删除历史中的旧资源 Blob"
          echo "========================================"

          git filter-repo \
            --force \
            --quiet \
            --blob-callback '
          remove_ids = {
              bytes.fromhex(line.strip())
              for line in open("/tmp/remove-resource-blobs.txt")
              if line.strip()
          }

          if blob.original_id in remove_ids:
              blob.skip()
          '

          echo
          echo "历史清理完成"
          echo "清理后提交数量: $(git rev-list --count HEAD)"

      - name: Verify current resources
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "确认当前资源仍然存在"
          echo "========================================"

          audio_count=$(
            find . -type f \
              ! -path "./.git/*" \
              \( \
                -iname "*.mp3" \
                -o -iname "*.wav" \
                -o -iname "*.ogg" \
                -o -iname "*.opus" \
                -o -iname "*.m4a" \
                -o -iname "*.aac" \
                -o -iname "*.flac" \
                -o -iname "*.aiff" \
                -o -iname "*.aif" \
                -o -iname "*.wma" \
                -o -iname "*.mid" \
                -o -iname "*.midi" \
              \) \
              | wc -l
          )

          map_count=$(
            find . -type f \
              ! -path "./.git/*" \
              -iname "map.bin" \
              | wc -l
          )

          augments_svg_count=$(
            find . -type f \
              ! -path "./.git/*" \
              -path "*/augments_icon/*.svg" \
              | wc -l
          )

          augments_txt_count=$(
            find . -type f \
              ! -path "./.git/*" \
              -path "*/augments_icon/*.txt" \
              | wc -l
          )

          echo "当前音频文件数量: ${audio_count}"
          echo "当前 map.bin 数量: ${map_count}"
          echo "当前 augments_icon SVG 数量: ${augments_svg_count}"
          echo "当前 augments_icon TXT 数量: ${augments_txt_count}"

          echo
          echo "当前资源检查完成"

      - name: Force push rewritten history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          echo "========================================"
          echo "强制推送清理后的 Git 历史"
          echo "========================================"

          GIT_TERMINAL_PROMPT=0 git push \
            --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main \
            > /tmp/push.log 2>&1

          rc=$?

          echo "push 退出码: ${rc}"
          echo "push 输出:"
          tail -50 /tmp/push.log

          if [ "$rc" -ne 0 ]; then
            echo
            echo "强制推送失败，请检查 main 分支保护规则"
            exit "$rc"
          fi

          echo
          echo "========================================"
          echo "强制推送成功"
          echo "========================================"
          echo "当前提交数量: $(git rev-list --count HEAD)"
