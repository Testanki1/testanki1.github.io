name: 绝对 URL → 相对路径

# 干什么：
#   扫描仓库里所有 HTML，把 https://testanki1.github.io/xxx 改写成相对路径。
#   · 推送 HTML 到 main        -> 自动开一个 PR（不直接改 main）
#   · 手动 workflow_dispatch    -> 可选 开 PR / 直接提交到 main / 只检查不落地
#   · 任何 PR                  -> 只做检查，新增了绝对 URL 就让 CI 失败
#
# 幂等：没有绝对 URL 可改时不会产生任何提交，因此自动提交不会造成死循环。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 相对路径的形式
        type: choice
        options:
          - relative   # 文档相对路径，如 ../logos/steam.svg（换域名、放子目录都能用）
          - root       # 根相对路径，如 /logos/steam.svg
        default: relative
      apply:
        description: 如何落地改动
        type: choice
        options:
          - pull-request   # 开/更新一个 PR（推荐）
          - commit-main    # 直接提交回 main
          - dry-run        # 只检查，不改任何文件
        default: pull-request
  push:
    branches: [main]
    paths:
      - '**/*.html'
  pull_request:
    paths:
      - '**/*.html'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: relative-urls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 只检查
  check:
    name: 检查绝对 URL
    if: github.event_name == 'pull_request' || inputs.apply == 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查是否存在可相对化的绝对 URL
        run: python3 scripts/abs2rel.py --root . --mode "${{ inputs.mode || 'relative' }}" --check --summary-file "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- 改写并落地改动
  convert:
    name: 改写为相对路径
    if: github.event_name != 'pull_request' && inputs.apply != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行改写
        run: |
          python3 scripts/abs2rel.py \
            --root . \
            --mode "${{ inputs.mode || 'relative' }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: 统计改动
        id: diff
        run: |
          COUNT=$(git status --porcelain -- '*.html' '*.htm' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "改动文件数：$COUNT"

      - name: 直接提交回 main
        if: steps.diff.outputs.count != '0' && inputs.apply == 'commit-main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/stage-html.sh
          git commit -m "chore: 把 HTML 中的绝对路径改为相对路径"
          git push origin main

      - name: 开 / 更新 PR
        if: steps.diff.outputs.count != '0' && (inputs.apply == 'pull-request' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/relative-urls"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          bash .github/scripts/stage-html.sh
          git commit -m "chore: 把 HTML 中的绝对路径改为相对路径"
          git push --force origin "$BRANCH"

          cat > pr_body.md <<'EOF'
          由 `.github/workflows/relative-paths.yml` 自动生成。

          把 HTML 里指向 `testanki1.github.io` 的绝对 URL 改成相对路径，
          以便站点换域名 / 部署到子目录时链接依然可用。

          - 只改写属性值和 `<script>` / `<style>` 里的 URL
          - 页面上展示给用户看的网址文本（如 servers.html 的滚动字幕）保持原样
          - 其它域名（raw.githubusercontent.com 等）不受影响

          详细改动见本次运行的 workflow summary。
          EOF

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR 已存在，内容已更新"
            gh pr edit "$BRANCH" --body-file pr_body.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: HTML 绝对路径改为相对路径" \
              --body-file pr_body.md
          fi

      - name: 没有需要改动的 URL
        if: steps.diff.outputs.count == '0'
        run: echo "所有 HTML 已经是相对路径，无需改动。"
