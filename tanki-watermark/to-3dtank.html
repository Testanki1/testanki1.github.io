<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PATTERN VIEWER</title>
  
  <!-- 引入 Rubik、M PLUS 1p 字体 及 Material Symbols 图标 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --color-primary: #76FF33;
      --color-on-primary: #001926;
      --color-primary-glow: rgba(118, 255, 51, 0.32);
      
      --color-background: #001926;
      --color-surface: #032133;
      --color-surface-container: #062a40;
      --color-surface-container-high: #0c3650;
      
      --color-outline: rgba(191, 213, 255, 0.2);
      --color-outline-variant: rgba(191, 213, 255, 0.08);
      
      --color-text-main: #BFD5FF;
      --color-text-dim: rgba(191, 213, 255, 0.65);
      
      --font-family-main: 'Rubik', 'M PLUS 1p', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-m3-expressive: cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family-main);
      background-color: var(--color-background);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 响应式顶部应用栏：Flex 自适应布局防止移动端截断 */
    header {
      height: 64px;
      padding: 0 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: linear-gradient(180deg, var(--color-surface) 0%, rgba(0, 25, 38, 0.7) 100%);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--color-outline-variant);
      z-index: 20;
      width: 100%;
      max-width: 100vw;
    }

    /* 滑动分段选择器（手机端自适应弹性收缩） */
    .segmented-control {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 42px;
      background-color: var(--color-surface-container);
      border: 1px solid var(--color-outline);
      border-radius: 9999px;
      padding: 3px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
      flex: 1;
      max-width: 280px;
    }

    .segmented-indicator {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background-color: var(--color-primary);
      border-radius: 9999px;
      transition: transform 0.32s var(--ease-m3-expressive);
      box-shadow: 0 2px 12px var(--color-primary-glow);
      z-index: 1;
      pointer-events: none;
    }

    .segmented-control[data-active="orig"] .segmented-indicator {
      transform: translateX(100%);
    }

    .segmented-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 100%;
      min-width: 0; /* 允许在窄屏下平滑收缩，不撑破父级 */
      appearance: none;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-family-main);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--color-text-dim);
      padding: 0 0.5rem;
      white-space: nowrap;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s var(--ease-m3-expressive), transform 0.15s ease;
    }

    .segmented-btn:active {
      transform: scale(0.96);
    }

    .segmented-btn.active {
      color: var(--color-on-primary);
    }

    /* 右侧操作按钮组 (紧凑防挤压) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .action-btn {
      appearance: none;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background-color: var(--color-surface-container);
      border: 1px solid var(--color-outline);
      color: var(--color-text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-m3-expressive);
      outline: none;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background-color: var(--color-surface-container-high);
      border-color: var(--color-primary);
      color: var(--color-primary);
      box-shadow: 0 0 14px rgba(118, 255, 51, 0.2);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    .action-btn.copied {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
      box-shadow: 0 0 16px var(--color-primary-glow);
    }

    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 19px;
      line-height: 1;
    }

    /* 主画布视口 */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem;
      overflow: hidden;
    }

    .viewport-card {
      width: 100%;
      height: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-outline);
      border-radius: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0, 15, 25, 0.8);
    }

    .stage-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      z-index: 1;
      transition: opacity 0.25s var(--ease-m3-expressive), transform 0.25s var(--ease-m3-expressive);
    }

    .stage-container svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .stage-container.switching {
      opacity: 0;
      transform: scale(0.985);
    }

    /* 平板及桌面端增宽舒适度 */
    @media (min-width: 600px) {
      header {
        height: 72px;
        padding: 0 1.5rem;
      }
      .segmented-control {
        height: 46px;
        max-width: 320px;
      }
      .segmented-btn {
        font-size: 0.875rem;
      }
      .action-btn {
        width: 44px;
        height: 44px;
      }
      main {
        padding: 1.5rem;
      }
      .viewport-card {
        border-radius: 32px;
      }
    }
  </style>
</head>
<body>

  <header>
    <!-- 切换开关 -->
    <div class="segmented-control" id="toggle-group" data-active="new" role="tablist">
      <div class="segmented-indicator" aria-hidden="true"></div>
      <button class="segmented-btn active" id="btn-new" role="tab" aria-selected="true">3D坦克</button>
      <button class="segmented-btn" id="btn-orig" role="tab" aria-selected="false">TANKIONLINE</button>
    </div>

    <!-- 右侧操作按钮组 -->
    <div class="header-actions">
      <button class="action-btn" id="btn-copy" title="复制当前 SVG" aria-label="Copy SVG">
        <span class="material-symbols-rounded">content_copy</span>
      </button>
      <button class="action-btn" id="btn-download" title="下载当前 SVG" aria-label="Download SVG">
        <span class="material-symbols-rounded">download</span>
      </button>
    </div>
  </header>

  <main>
    <div class="viewport-card">
      <div class="stage-container" id="stage"></div>
    </div>
  </main>

    function parseSvgPath(d) {
      const commands = [];
      const regex = /([a-df-z])([^a-df-z]*)/gi;
      let match;
      let curX = 0, curY = 0, startX = 0, startY = 0;

      while ((match = regex.exec(d)) !== null) {
        const type = match[1];
        const isRelative = type === type.toLowerCase();
        const upperType = type.toUpperCase();
        const nums = match[2].trim().match(/-?[0-9]*\.?[0-9]+(?:e[-+]?[0-9]+)?/gi);
        const args = nums ? nums.map(Number) : [];
        let i = 0;

        switch (upperType) {
          case 'M':
            while (i < args.length) {
              const x = isRelative ? curX + args[i] : args[i];
              const y = isRelative ? curY + args[i + 1] : args[i + 1];
              if (i === 0) {
                commands.push({ type: 'M', x, y });
                startX = x; startY = y;
              } else {
                commands.push({ type: 'L', x, y });
              }
              curX = x; curY = y;
              i += 2;
            }
            break;
          case 'L':
            while (i < args.length) {
              const x = isRelative ? curX + args[i] : args[i];
              const y = isRelative ? curY + args[i + 1] : args[i + 1];
              commands.push({ type: 'L', x, y });
              curX = x; curY = y;
              i += 2;
            }
            break;
          case 'H':
            while (i < args.length) {
              const x = isRelative ? curX + args[i] : args[i];
              commands.push({ type: 'L', x, y: curY });
              curX = x; i += 1;
            }
            break;
          case 'V':
            while (i < args.length) {
              const y = isRelative ? curY + args[i] : args[i];
              commands.push({ type: 'L', x: curX, y });
              curY = y; i += 1;
            }
            break;
          case 'C':
            while (i < args.length) {
              const x1 = isRelative ? curX + args[i] : args[i];
              const y1 = isRelative ? curY + args[i + 1] : args[i + 1];
              const x2 = isRelative ? curX + args[i + 2] : args[i + 2];
              const y2 = isRelative ? curY + args[i + 3] : args[i + 3];
              const x = isRelative ? curX + args[i + 4] : args[i + 4];
              const y = isRelative ? curY + args[i + 5] : args[i + 5];
              commands.push({ type: 'C', x1, y1, x2, y2, x, y });
              curX = x; curY = y; i += 6;
            }
            break;
          case 'Z':
            commands.push({ type: 'Z' });
            curX = startX; curY = startY;
            break;
        }
      }
      return commands;

    const PARSED_GLYPHS = GLYPH_COMPONENTS.map(g => ({
      name: g.name,
      width: g.width,
      paths: g.paths.map(p => ({
        cmds: parseSvgPath(p.d),
        evenodd: p.evenodd

    function transformPath(parsedCmds, transformFn) {
      let d = '';
      for (const cmd of parsedCmds) {
        if (cmd.type === 'M') {
          const pt = transformFn(cmd.x, cmd.y);
          d += `M${Number(pt.x.toFixed(3))} ${Number(pt.y.toFixed(3))}`;
        } else if (cmd.type === 'L') {
          const pt = transformFn(cmd.x, cmd.y);
          d += `L${Number(pt.x.toFixed(3))} ${Number(pt.y.toFixed(3))}`;
        } else if (cmd.type === 'C') {
          const p1 = transformFn(cmd.x1, cmd.y1);
          const p2 = transformFn(cmd.x2, cmd.y2);
          const p = transformFn(cmd.x, cmd.y);
          d += `C${Number(p1.x.toFixed(3))} ${Number(p1.y.toFixed(3))} ${Number(p2.x.toFixed(3))} ${Number(p2.y.toFixed(3))} ${Number(p.x.toFixed(3))} ${Number(p.y.toFixed(3))}`;
        } else if (cmd.type === 'Z') {
          d += 'Z';
        }
      }
      return d;

    function transformSvgContent(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, 'image/svg+xml');
      const allPaths = Array.from(doc.querySelectorAll('svg > g path, svg > path')).filter(p => !p.closest('defs') && !p.closest('clipPath'));
      if (allPaths.length === 0) return svgText;

      for (let i = 0; i < allPaths.length; i += 11) {

      const wordCycle = singleWordWidth + charGap;

        let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;

          const d = p.getAttribute('d') || '';

              const v = (c.x + c.y) / Math.SQRT2;
              if (u < minU) minU = u;
              if (u > maxU) maxU = u;
              if (v < minV) minV = v;
              if (v > maxV) maxV = v;
            }

          chunk,
          firstPath: chunk[0],
          parentNode: chunk[0].parentNode,
          strokeWidth: chunk[0].getAttribute('stroke-width') || null,
          minU, maxU, minV, maxV,
          centerV: (minV + maxV) / 2
        });
      });

      const stripeMap = new Map();
      clusterItems.forEach(ci => {
        const vKey = Math.round(ci.centerV / 25) * 25;

        stripeMap.get(vKey).clusters.push(ci);
      });

        let stripeMinV = Infinity, stripeMaxV = -Infinity;
        st.clusters.forEach(c => {

          if (c.maxV > stripeMaxV) stripeMaxV = c.maxV;
        });

        const v0 = stripeMinV;

        const segments = [];
        let curSeg = null;
        st.clusters.forEach(c => {
          if (!curSeg) {
            curSeg = { minU: c.minU, maxU: c.maxU, clusters: [c] };
          } else {
            if (c.minU <= curSeg.maxU + 35 * scale) {
              curSeg.maxU = Math.max(curSeg.maxU, c.maxU);
              curSeg.clusters.push(c);
            } else {
              segments.push(curSeg);
              curSeg = { minU: c.minU, maxU: c.maxU, clusters: [c] };
            }
          }
        });
        if (curSeg) segments.push(curSeg);

        segments.forEach(seg => {
          const segUnits = (seg.maxU - seg.minU) / scale;
          const strokeWidth = seg.clusters[0].strokeWidth;
          const parentNode = seg.clusters[0].parentNode;
          const refNode = seg.clusters[0].firstPath;

          let N = Math.floor((segUnits + charGap) / wordCycle);
          if (N < 1) N = 1;

          const totalChainUnits = N * singleWordWidth + (N - 1) * charGap;
          const marginUnits = (segUnits - totalChainUnits) / 2;
          const startU = seg.minU + marginUnits * scale;

          const newElements = [];
          for (let w = 0; w < N; w++) {
            const curWordStart = startU + w * wordCycle * scale;
            glyphOffsets.forEach(({ glyph, startX }) => {
              const partStartU = curWordStart + startX * scale;
              const transformFn = (X, Y) => ({
                x: (v0 + Y * scale + partStartU + X * scale) / Math.SQRT2,
                y: (v0 + Y * scale - (partStartU + X * scale)) / Math.SQRT2
              });

              glyph.paths.forEach(pDef => {
                const np = doc.createElementNS("http://www.w3.org/2000/svg", "path");
                np.setAttribute('d', transformPath(pDef.cmds, transformFn));
                np.setAttribute('stroke', '#BFD5FF');
                if (strokeWidth) np.setAttribute('stroke-width', strokeWidth);
                if (pDef.evenodd) {
                  np.setAttribute('fill-rule', 'evenodd');
                  np.setAttribute('clip-rule', 'evenodd');
                }
                newElements.push(np);
              });
            });
          }
          newElements.forEach(np => parentNode.insertBefore(np, refNode));
        });

        st.clusters.forEach(c => {
          c.chunk.forEach(p => p.parentNode && p.parentNode.removeChild(p));
        });
      });

      return new XMLSerializer().serializeToString(doc);
    }

    let rawSvgData = '';
    let convertedSvgData = '';
    let currentMode = 'new';

    const stageEl = document.getElementById('stage');
    const toggleGroup = document.getElementById('toggle-group');
    const btnNew = document.getElementById('btn-new');
    const btnOrig = document.getElementById('btn-orig');
    const btnCopy = document.getElementById('btn-copy');
    const btnDownload = document.getElementById('btn-download');

    function getCurrentSvg() {
      return currentMode === 'new' ? convertedSvgData : rawSvgData;
    }

    function applyRender(mode) {
      currentMode = mode;
      toggleGroup.setAttribute('data-active', mode);

      btnNew.classList.toggle('active', mode === 'new');
      btnNew.setAttribute('aria-selected', mode === 'new');
      btnOrig.classList.toggle('active', mode === 'orig');
      btnOrig.setAttribute('aria-selected', mode === 'orig');

      stageEl.classList.add('switching');
      setTimeout(() => {
        stageEl.innerHTML = getCurrentSvg();
        stageEl.classList.remove('switching');
      }, 150);
    }

    function toggleView() {
      applyRender(currentMode === 'new' ? 'orig' : 'new');
    }

    btnNew.addEventListener('click', () => applyRender('new'));
    btnOrig.addEventListener('click', () => applyRender('orig'));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleView();
      }
    });

    btnCopy.addEventListener('click', async () => {
      const svg = getCurrentSvg();
      if (!svg) return;

      try {
        await navigator.clipboard.writeText(svg);
        const icon = btnCopy.querySelector('.material-symbols-rounded');
        const prevIcon = icon.textContent;
        
        icon.textContent = 'check';
        btnCopy.classList.add('copied');
        
        setTimeout(() => {
          icon.textContent = prevIcon;
          btnCopy.classList.remove('copied');
        }, 1600);
      } catch (err) {
        console.error('Copy failed', err);
      }
    });

    btnDownload.addEventListener('click', () => {
      const svg = getCurrentSvg();
      if (!svg) return;

      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = currentMode === 'new' ? '3d-tank-pattern.svg' : 'tankionline-pattern.svg';
      link.click();
      URL.revokeObjectURL(url);
    });

    async function initPattern() {
      try {
        const response = await fetch('./background-pattern.svg');
        if (!response.ok) throw new Error('Fetch failed');
        rawSvgData = await response.text();
      } catch (err) {
        rawSvgData = FALLBACK_SVG;
      }

      convertedSvgData = transformSvgContent(rawSvgData);
      applyRender('new');
    }

    initPattern();
  </script>
</body>
</html>
