<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANKIONLINE watermark</title>
<style>
  /* Base color */
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(268.24% 1017.34% at -4.57% 110.67%,#2e4a63 0,#001926 100%);
  }
  /* TANKIONLINE outline watermark */
  .background-pattern{
    position:fixed;top:0;left:0;
    width:100%;height:100dvh;
    object-fit:cover;
    
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
<img src="background-pattern.svg" alt="" class="background-pattern">
</body>
</html>
