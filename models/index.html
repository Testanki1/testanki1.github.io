    // ---- Paint Shader System (Scheme 2 - reference blending) - Fixed circular JSON ----
    const paintedMaterials = [];
    const paintOriginalMap = new WeakMap();
    // Every live paint material (any kind), so the pattern-scale slider can
    // retune the tiling uniform without rebuilding or recompiling anything.
    const allPaintMats = new Set();

    // ---- UV texel-density measurement -------------------------------------
    // Returns "how many world units one UV unit spans" for a mesh, i.e. the
    // physical size of one full texture repeat on that surface.
    //
    // NOTE ON METHOD: this samples |dP/du| and |dP/dv| PER TRIANGLE and takes the
    // median.  A global sqrt(sum(worldArea)/sum(uvArea)) looks equivalent but is
    // NOT: tank hulls mirror/overlap large parts of their unwrap (both track
    // sides share one patch of the atlas), so the summed uvArea double-counts and
    // the ratio collapses — on the stock hull it reports 215 instead of the true
    // 931, a 4.3x error, while agreeing to within 6% on the turret.  The median
    // of per-triangle derivatives is immune to overlap and to a few degenerate
    // seam triangles.
    const uvDensityCache = new WeakMap();
    function measureWorldUnitsPerUV(mesh){
        if(!mesh || !mesh.isMesh) return null;
        const g = mesh.geometry;
        const cached = uvDensityCache.get(g);
        if(cached !== undefined) return cached;
        const pos = g?.attributes?.position, uv = g?.attributes?.uv;
        if(!pos || !uv){ uvDensityCache.set(g, null); return null; }
        mesh.updateWorldMatrix(true, false);
        const sc = new THREE.Vector3();
        mesh.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), sc);
        const meshScale = (Math.abs(sc.x) + Math.abs(sc.y) + Math.abs(sc.z)) / 3 || 1;
        const idx = g.index ? g.index.array : null;
        const triCount = (idx ? idx.length : pos.count) / 3;
        const stride = Math.max(1, Math.floor(triCount / 2000));
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
        const dPdu = new THREE.Vector3(), dPdv = new THREE.Vector3();
        const samples = [];
        for(let t = 0; t < triCount; t += stride){
            const i = t * 3;
            const i0 = idx ? idx[i] : i, i1 = idx ? idx[i+1] : i+1, i2 = idx ? idx[i+2] : i+2;
            a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
            e1.subVectors(b, a); e2.subVectors(c, a);
            const du1 = uv.getX(i1) - uv.getX(i0), dv1 = uv.getY(i1) - uv.getY(i0);
            const du2 = uv.getX(i2) - uv.getX(i0), dv2 = uv.getY(i2) - uv.getY(i0);
            const det = du1 * dv2 - du2 * dv1;
            if(Math.abs(det) < 1e-12) continue;
            dPdu.copy(e1).multiplyScalar(dv2).addScaledVector(e2, -dv1).divideScalar(det);
            dPdv.copy(e1).multiplyScalar(-du2).addScaledVector(e2, du1).divideScalar(det);
            const su = dPdu.length(), sv = dPdv.length();
            if(!isFinite(su) || !isFinite(sv) || su <= 0 || sv <= 0) continue;
            samples.push(Math.sqrt(su * sv));   // isotropic scale of this triangle
        }
        let ratio = null;
        if(samples.length){
            samples.sort((x, y) => x - y);
            ratio = samples[samples.length >> 1] * meshScale;
        }
        uvDensityCache.set(g, ratio);
        return ratio;
    }

    // World units spanned by one camouflage repeat at the reference resolution.
    // 465 = the hull's historical tile size (it sits at ~930 world units per UV
    // unit and the legacy default density was 2), so the hull keeps the look it
    // always had and the turret/grenade are brought into line with it.
    const PAINT_BASE_TILE = 465.0;

    // ---- Mirrored-UV detection (fixes flipped camo on shared/mirrored parts) --
    // Many tank hulls reuse ("mirror") one UV island for both left/right sides
    // to save texture space: the base lightmap was authored knowing this, so it
    // still looks correct. But the camouflage pattern is sampled with the SAME
    // uv coordinates, so on the mirrored half an asymmetric pattern reads
    // backwards. We detect which triangles are mirrored by the *sign* of their
    // UV-space signed area (same determinant already computed for texel-density
    // measurement) and bake a per-vertex 0/1 flag. Only the camo sampling uses
    // this flag to flip U back — the original base texture (map/lightmap) is
    // left completely untouched, so nothing about the model's real texture
    // changes; only the procedurally-applied camo gets auto-corrected.
    function computeMirrorFlags(mesh){
        if(!mesh || !mesh.isMesh) return;
        const g = mesh.geometry;
        if(!g || g.attributes.mirrorFlag) return; // already computed
        const pos = g.attributes.position, uv = g.attributes.uv;
        const vertCount = pos ? pos.count : 0;
        if(!uv || !vertCount){
            if(pos) g.setAttribute('mirrorFlag', new THREE.BufferAttribute(new Float32Array(vertCount), 1));
            return;
        }
        const idx = g.index ? g.index.array : null;
        const triCount = (idx ? idx.length : pos.count) / 3;
        const votesPos = new Float32Array(vertCount);
        const votesNeg = new Float32Array(vertCount);
        let totalPos = 0, totalNeg = 0;
        for(let t = 0; t < triCount; t++){
            const i = t * 3;
            const i0 = idx ? idx[i] : i, i1 = idx ? idx[i+1] : i+1, i2 = idx ? idx[i+2] : i+2;
            const u0 = uv.getX(i0), v0 = uv.getY(i0);
            const u1 = uv.getX(i1), v1 = uv.getY(i1);
            const u2 = uv.getX(i2), v2 = uv.getY(i2);
            const det = (u1 - u0) * (v2 - v0) - (u2 - u0) * (v1 - v0);
            if(Math.abs(det) < 1e-12) continue;
            if(det < 0){ votesNeg[i0]++; votesNeg[i1]++; votesNeg[i2]++; totalNeg++; }
            else { votesPos[i0]++; votesPos[i1]++; votesPos[i2]++; totalPos++; }
        }
        const flags = new Float32Array(vertCount);
        // Whichever orientation is the majority across the whole mesh is treated
        // as "normal"; vertices whose triangles mostly voted the opposite way
        // are the mirrored island and get flagged.
        const majorityIsPos = totalPos >= totalNeg;
        for(let i = 0; i < vertCount; i++){
            const p = votesPos[i], n = votesNeg[i];
            if(p === 0 && n === 0) continue;
            flags[i] = (majorityIsPos ? (n > p) : (p > n)) ? 1 : 0;
        }
        g.setAttribute('mirrorFlag', new THREE.BufferAttribute(flags, 1));
    }

    function createPaintShaderMat(originalMat, paintEntry, worldUnitsPerUV){
        const newMat = originalMat.clone();
        const lightMapTex = originalMat.map;
        newMat.map = lightMapTex;
        // Option 3: Clear emissive self-glow channel on camouflage material
        if (newMat.emissive) newMat.emissive.setHex(0x000000);
        newMat.emissiveIntensity = 0.0;
        newMat.emissiveMap = null;
        newMat.needsUpdate = true;
        const isAnim = !!paintEntry.isAnimated && !!paintEntry.frame;
        const frame = paintEntry.frame;

        // ---- Tiling density -------------------------------------------------
        // Tile in UV space (no triplanar: that blends two projections together
        // in the ~45-degree band between axes, which smears the pattern and can
        // mirror asymmetric artwork).  To still get a consistent PHYSICAL size
        // across parts, the UV repeat count is derived from each mesh's own texel
        // density: repeats = (world units per UV unit) / (world units per tile).
        let texWidth = 150;
        // For animated camouflages, use single-frame width (frameWidth) instead of full sprite sheet image width
        if (frame && frame.frameWidth) {
            texWidth = frame.frameWidth;
        } else if (paintEntry.info && paintEntry.info.frame && paintEntry.info.frame.frameWidth) {
            texWidth = paintEntry.info.frame.frameWidth;
        } else if (paintEntry.texture && paintEntry.texture.image && paintEntry.texture.image.width) {
            texWidth = paintEntry.texture.image.width;
        }
        texWidth = Math.max(1, texWidth);
        // 废弃根据贴图分辨率强行缩放图案的错误逻辑，直接使用标准物理基准
    const tileWorld = PAINT_BASE_TILE; 

    let autoDensity;
    if (worldUnitsPerUV && isFinite(worldUnitsPerUV) && worldUnitsPerUV > 1e-6) {
        autoDensity = worldUnitsPerUV / tileWorld;
    } else {
        // 降级情况直接给默认平铺 2 次即可，不需要用像素反推
        autoDensity = 2.0; 
    }

    // ================== 新增：分别调整动静迷彩密度 ==================
    const isLocal = !!paintEntry.isLocal;
    if (isLocal) {
        // 本地图片/视频：用户自己的素材，不做任何“官方迷彩”式的密度补偿，
        // 直接按物理基准平铺一次，剩下的交给“图案缩放”滑块。
        autoDensity *= 1.0;
    } else if (isAnim) {
        // 动态迷彩太密集 -> 乘以小于 1 的数字，降低密度（图案放大）
        // 比如 0.5 表示密度减半（图案放大为原来的2倍）
        autoDensity *= 0.25;  
    } else {
        // 静态迷彩太稀疏 -> 乘以大于 1 的数字，提高密度（图案缩小并重复更多次）
        // 比如 2.0 表示密度翻倍（图案缩小为原来的二分之一）
        autoDensity *= 2.0;  
    }
    // ================================================================

    // Guard rails only — deliberately NOT quantised: snapping to 0.5 steps
    autoDensity = THREE.MathUtils.clamp(autoDensity, 0.02, 64.0);

        // Aspect correction: official camos are square sheets, but a local
        // photo can be any shape (e.g. 1920x1080). Tiling a 16:9 image with an
        // equal U/V repeat squashes it, so V gets scaled by width/height to
        // keep every pixel square on the hull.
        const paintAspect = (isLocal && paintEntry.aspect && isFinite(paintEntry.aspect) && paintEntry.aspect > 0)
            ? paintEntry.aspect : 1.0;
        // The slider divides the density (bigger scale = fewer, larger repeats).
        const userScale = THREE.MathUtils.clamp(
            (paintEntry.scale && isFinite(paintEntry.scale)) ? paintEntry.scale : 1.0,
            PAINT_SCALE_MIN, PAINT_SCALE_MAX);
        const finalDensity = THREE.MathUtils.clamp(autoDensity / userScale, 0.005, 256.0);

        // three.js caches compiled programs by this key and skips onBeforeCompile
        // on a hit, so the key has to cover everything baked into the shader.
        // NOTE: the density is a *uniform*, not baked into the source, so the
        // slider must NOT be part of the key (otherwise every drag recompiles).
        const cacheKey = 'paint_uv_' + (paintEntry.isAnimated ? 'anim' : 'static')
            + (isLocal ? '_local' : '');
        newMat.customProgramCacheKey = function(){ return cacheKey; };

        newMat.userData.paintEntry = paintEntry;
        newMat.userData.isPaintMat = true;
        newMat.userData.paintDensity = finalDensity;
        newMat.userData.paintBaseDensity = autoDensity;   // pre-slider value
        newMat.userData.paintAspect = paintAspect;
        newMat.userData.paintTileWorld = tileWorld;
        allPaintMats.add(newMat);
        newMat.onBeforeCompile = (shader)=>{
            shader.uniforms.paintMap = { value: paintEntry.texture };
            shader.uniforms.paintFrameOffset = { value: new THREE.Vector2(0, 0) };
            shader.uniforms.paintFrameScale = { value: new THREE.Vector2(1, 1) };
            shader.uniforms.paintUseFrameTransform = { value: isAnim ? 1.0 : 0.0 };
            shader.uniforms.paintTexelSize = { value: new THREE.Vector2(0.01, 0.01) };
            shader.uniforms.multihui = { value: new THREE.Vector2(1, 1) };
            shader.uniforms.uvTransform = { value: new THREE.Vector2(1, 1) };
            // x = U repeats, y = V repeats (aspect-corrected for local media)
            shader.uniforms.paintUvScale = { value: new THREE.Vector2(finalDensity, finalDensity * paintAspect) };
            // Pass the per-vertex mirror flag (computed in computeMirrorFlags)
            // through to the fragment shader so ONLY the camo sampling can flip
            // its U coordinate back on the mirrored UV island. Nothing else
            // about the mesh, its base map, or its real UVs is touched.
            shader.vertexShader = shader.vertexShader.replace(
                '#include <common>',
                `#include <common>
                attribute float mirrorFlag;
                varying float vPaintMirror;
                `
            );
            shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                vPaintMirror = mirrorFlag;
                `
            );
            if(isAnim && frame){
                shader.uniforms.paintFrameScale.value.set(frame.frameWidth / frame.imageWidth, frame.frameHeight / frame.imageHeight);
                shader.uniforms.paintFrameOffset.value.set(0, 1 - frame.frameHeight / frame.imageHeight);
                shader.uniforms.paintTexelSize.value.set(2.0 / frame.imageWidth, 2.0 / frame.imageHeight);
                shader.uniforms.paintUseFrameTransform.value = 1.0;
            } else {
                shader.uniforms.paintFrameScale.value.set(1,1);
                shader.uniforms.paintFrameOffset.value.set(0,0);
                shader.uniforms.paintTexelSize.value.set(0.5 / 256, 0.5 / 256);
                shader.uniforms.paintUseFrameTransform.value = 0.0;
            }
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <common>',
                `#include <common>
                uniform sampler2D paintMap;
                uniform vec2 paintFrameOffset;
                uniform vec2 paintFrameScale;
                uniform float paintUseFrameTransform;
                uniform vec2 paintTexelSize;
                uniform vec2 multihui;
                uniform vec2 uvTransform;
                uniform vec2 paintUvScale;
                varying float vPaintMirror;
                `
            );
            const customMapFragment = `
                #ifdef USE_MAP
                    vec4 lightTex = texture2D(map, vMapUv);
                    vec3 baseLightColor = lightTex.rgb;

                    // ==================== 1. 核心修复开始 ====================
                    // 在对 UV 进行任何镜像翻转 (vPaintMirror) 或取模 (fract/mix) 之前
                    // 基于原始连续的 vMapUv 计算平滑的像素级 UV 导数 dx, dy
                    vec2 dx = dFdx(vMapUv * paintUvScale);
                    vec2 dy = dFdy(vMapUv * paintUvScale);
                    // ========================================================

                    vec2 camoBaseUv = vMapUv;
                    if(vPaintMirror > 0.5) camoBaseUv.x = 1.0 - camoBaseUv.x;
                    vec2 tiledPaintUv = camoBaseUv * paintUvScale;
                    vec2 paintUv = tiledPaintUv;
                    if(paintUseFrameTransform > 0.5){
                        vec2 safeTiledUv = mix(paintTexelSize, vec2(1.0) - paintTexelSize, fract(tiledPaintUv / paintFrameScale));
                        paintUv = safeTiledUv * paintFrameScale + paintFrameOffset;
                    }

                    // ==================== 2. 核心采样替换 ====================
                    // 使用带有平滑导数的渐变采样，防止在接缝/翻转/帧边缘触发 Mipmap 异常
                    vec4 paintTex = texture2DGradEXT(paintMap, paintUv, dx, dy);
                    // ========================================================

                    vec3 paintColor = paintTex.rgb * 3.0;
                    float scuffingFactor = step(0.5, lightTex.r);
                    vec3 colorWithoutScuffing = 2.0 * paintColor * baseLightColor;
                    vec3 colorWithScuffing = 1.0 - 2.0 * (1.0 - baseLightColor) * (1.0 - paintColor);
                    vec3 blendedColor = mix(colorWithoutScuffing, colorWithScuffing, scuffingFactor);
                    float detailsAlpha = lightTex.a;
                    vec3 finalColor = mix(blendedColor, baseLightColor, detailsAlpha);
                    diffuseColor.rgb *= finalColor;
                #endif
            `;

            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <map_fragment>',
                customMapFragment
            );

            // GLSL Shader Mixer: Mix roughness and metalness per-pixel based on lightmap alpha (detailsAlpha)
            // Camouflage area (detailsAlpha = 0): Matte non-reflective (roughness=0.85, metalness=0.0)
            // Model detail area (detailsAlpha = 1, e.g. metal vents, glass, chrome): Preserves model's original metallic reflections!
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <roughnessmap_fragment>',
                `#include <roughnessmap_fragment>
                #ifdef USE_MAP
                    vec4 lightTexForRough = texture2D(map, vMapUv);
                    roughnessFactor = mix(0.85, roughnessFactor, lightTexForRough.a);
                #endif
                `
            );
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <metalnessmap_fragment>',
                `#include <metalnessmap_fragment>
                #ifdef USE_MAP
                    vec4 lightTexForMetal = texture2D(map, vMapUv);
                    metalnessFactor = mix(0.0, metalnessFactor, lightTexForMetal.a);
                #endif
                `
            );

            newMat.userData.shader = shader;
            if(isAnim){
                paintedMaterials.push({mat: newMat, shader, frame, paintEntry});
            }
        };
        return newMat;
    }
    function isPaintableMeshName(name){ return true; }
    function isPaintableMaterial(mat, hullNameUpper){ return true; }
    function isPaintableMesh(mesh){
        if(!mesh || !mesh.isMesh) return false;
        if(mesh.userData.isAttachmentMarker) return false;
        return true;
    }
    function getPaintFileName(info){
        if(info.isAnimated) return 'image.webp';
        return info.hasTexture ? 'texture.webp' : 'image.webp';
    }
    async function fetchPaintMeta(name){
        const info = PAINTS_CATALOG[name];
        if(!info) return null;
        if(info.isLocal) return info;   // user file: nothing to fetch
        try{
            const metaUrl = `${RES_BASE}/${info.path}/meta.info`;
            const res = await fetch(metaUrl);
            if(!res.ok) return info;
            const meta = await res.json();
            const files = meta.map(f=>f.name);
            const hasFrame = files.includes('frame.json');
            const hasTexture = files.includes('texture.webp');
            const hasFrameWebp = files.includes('frame.webp');
            info.hasTexture = hasTexture;
            info.hasFrameWebp = hasFrameWebp;
            if(hasFrame !== info.isAnimated){
                info.isAnimated = hasFrame;
            }
            if(hasFrame && !info.frame){
                try{
                    const frameRes = await fetch(`${RES_BASE}/${info.path}/frame.json`);
                    if(frameRes.ok) info.frame = await frameRes.json();
                }catch{}
            }
            return info;
        }catch(e){
            return info;
        }
    }
    async function loadPaintTexture(paintName){
        const info = PAINTS_CATALOG[paintName];
        if(!info) throw new Error('Paint not found: '+paintName);
        if(paintCache.has(paintName)) return paintCache.get(paintName);
        // Local paints are built at import time and pre-seeded into paintCache;
        // if we get here for one, its record was dropped — fail loudly instead
        // of trying to fetch a CDN path that does not exist.
        if(info.isLocal) throw new Error('Local paint unavailable: '+paintName);
        await fetchPaintMeta(paintName);
        const file = getPaintFileName(info);
        const url = `${RES_BASE}/${info.path}/${file}`;
        const tex = await new THREE.TextureLoader().loadAsync(url);
        setupTex(tex);
        tex.name = paintName;
        let frameData = null;
        if(info.isAnimated && info.frame){
            const f = info.frame;
            const cols = Math.max(1, Math.floor(f.imageWidth / f.frameWidth));
            const rows = Math.max(1, Math.floor(f.imageHeight / f.frameHeight));
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(f.frameWidth / f.imageWidth, f.frameHeight / f.imageHeight);
            tex.offset.set(0, 1 - f.frameHeight / f.imageHeight);
            frameData = {
                fps: f.fps,
                frameWidth: f.frameWidth,
                frameHeight: f.frameHeight,
                imageWidth: f.imageWidth,
                imageHeight: f.imageHeight,
                numFrames: f.numFrames || (cols * rows),
                cols, rows,
                currentFrame: 0,
                time: 0
            };
        } else {
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1,1);
        }
        const entry = { texture: tex, isAnimated: !!info.isAnimated, frame: frameData, info, name: paintName };
        paintCache.set(paintName, entry);
        return entry;
    }

    function applyPaintToGroup(grp, paintEntry){
        if(!grp || !paintEntry) return 0;
        let applied = 0;
        const hullNameUpper = (slots.hull?.group?.name || document.getElementById('sel-hull-name')?.value || '').toUpperCase();
        grp.traverse(o=>{
            if(!o.isMesh) return;
            if(o.userData.isAttachmentMarker) return;
            const fullName = ((o.userData.originalName||'') + ' ' + (o.name||'') + ' ' + (o.parent?.name||'') + ' ' + (o.parent?.parent?.name||''));
            if(!isPaintableMeshName(fullName)) return;
            const geom = o.geometry;
            if(geom && geom.attributes.uv && !geom.attributes.uv2){
                geom.setAttribute('uv2', geom.attributes.uv.clone());
            }
            // Physical-size matching: how much world surface one UV unit covers.
            const worldUnitsPerUV = measureWorldUnitsPerUV(o);
            // Bake the mirrored-UV-island flag once per geometry (cheap, cached
            // via the attribute itself) so the paint shader can flip the camo's
            // U coordinate back on parts that reuse a mirrored UV island.
            computeMirrorFlags(o);
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            const newMats = [];
            let changed = false;
            mats.forEach(mat=>{
                if(!mat) { newMats.push(mat); return; }
                if(!isPaintableMaterial(mat, hullNameUpper)) { newMats.push(mat); return; }
                let baseMat = mat;
                while (paintOriginalMap.has(baseMat)) {
                    baseMat = paintOriginalMap.get(baseMat);
                }
                // Switching paints replaces an existing painted material —
                // retire the old one so the scale slider and the animation
                // loop never iterate over orphaned (or disposed) materials.
                if(paintOriginalMap.has(mat)){
                    allPaintMats.delete(mat);
                    for(let i=paintedMaterials.length-1;i>=0;i--){
                        if(paintedMaterials[i].mat === mat) paintedMaterials.splice(i,1);
                    }
                    paintOriginalMap.delete(mat);
                    try{ mat.dispose(); }catch(e){}
                }
                const paintedMat = createPaintShaderMat(baseMat, paintEntry, worldUnitsPerUV);
                paintOriginalMap.set(paintedMat, baseMat);
                newMats.push(paintedMat);
                applied++;
                changed = true;
            });
            if(changed){
                o.material = Array.isArray(o.material) ? newMats : newMats[0];
            }
        });
        return applied;
    }

    function clearPaintFromGroup(grp){
        if(!grp) return;
        grp.traverse(o=>{
            if(!o.isMesh) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            const restored = [];
            let changed = false;
            mats.forEach(mat=>{
                if(paintOriginalMap.has(mat)){
                    let orig = mat;
                    while (paintOriginalMap.has(orig)) {
                        orig = paintOriginalMap.get(orig);
                    }
                    restored.push(orig);
                    changed = true;
                    for(let i=paintedMaterials.length-1;i>=0;i--){
                        if(paintedMaterials[i].mat === mat) paintedMaterials.splice(i,1);
                    }
                    allPaintMats.delete(mat);
                    paintOriginalMap.delete(mat);
                    try{ mat.dispose(); }catch(e){}
                } else {
                    restored.push(mat);
                }
            });
            if(changed){
                o.material = Array.isArray(o.material) ? restored : restored[0];
            }
        });
    }

    function tickGridAnim(dt){
        if(!document.getElementById('paint-picker')?.classList.contains('show')) return;
        if(!activeGridAnimItems.length) return;
        const now = performance.now();
        for(const item of activeGridAnimItems){
            const f = item.frame;
            if(!f) continue;
            const fps = f.fps || 15;
            const frameDur = 1000 / fps;
            const currentFrame = Math.floor(now / frameDur) % item.totalFrames;
            if(currentFrame !== item.lastFrame){
                item.lastFrame = currentFrame;
                const col = currentFrame % item.cols;
                const row = Math.floor(currentFrame / item.cols);
                const xPerc = item.cols > 1 ? (col / (item.cols - 1)) * 100 : 0;
                const yPerc = item.rows > 1 ? (row / (item.rows - 1)) * 100 : 0;
                item.el.style.backgroundPosition = `${xPerc.toFixed(2)}% ${yPerc.toFixed(2)}%`;
            }
        }
    }

    function updatePaintAnimation(dt){
        tickGridAnim(dt);
        // Local GIF / animated-WebP / APNG paints: blit the browser-driven
        // <img>'s current frame into its canvas texture. (Video paints use
        // THREE.VideoTexture, which refreshes itself during render.)
        tickLocalPaints();
        const pas = window.paintAnimState || paintAnimState;
        if(!pas || !pas.entry) return;
        const entry = pas.entry;
        if(!entry.isAnimated || !entry.frame) return;
        const f = entry.frame;
        const now = performance.now();
        const fps = f.fps || 15;
        const frameDur = 1000 / fps;
        const totalFrames = f.numFrames || (f.cols * f.rows);
        const currentFrame = Math.floor(now / frameDur) % totalFrames;

        const col = currentFrame % f.cols;
        const row = Math.floor(currentFrame / f.cols);
        const offsetX = col * f.frameWidth / f.imageWidth;
        const offsetY = 1 - (row + 1) * f.frameHeight / f.imageHeight;

        for(const pm of paintedMaterials){
            if(pm.shader && pm.shader.uniforms && pm.shader.uniforms.paintFrameOffset){
                pm.shader.uniforms.paintFrameOffset.value.set(offsetX, offsetY);
            }
        }
        if(entry.texture){
            entry.texture.offset.x = offsetX;
            entry.texture.offset.y = offsetY;
        }

        // Advance the card thumbnails (canvas blit — see renderPaintCurrentFrame)
        renderPaintCurrentFrame(false);
    }

    async function buildPaintsCatalogFromAssets(){
        let raw = assetsData?.paints;
        if(!raw) return;
        let dict = raw.paints || raw;
        if(typeof dict !== 'object') return;
        PAINTS_CATALOG = {}; window.PAINTS_CATALOG = PAINTS_CATALOG;
        for(const [name, leaf] of Object.entries(dict)){
            try{
                const p = toResourcePath(leaf);
                if(!p) continue;
                PAINTS_CATALOG[name] = { path: p, isAnimated: false, frame: null, hasTexture: false, hasFrameWebp: false, _leaf: leaf };
            }catch{}
        }
        // The catalog object is rebuilt from scratch here, so re-insert any
        // camouflages the user imported from disk (they have no CDN path and
        // would otherwise silently disappear from the picker).
        for(const [name, rec] of LOCAL_PAINTS){
            PAINTS_CATALOG[name] = {
                path: null, isLocal: true, localKind: rec.kind,
                isAnimated: false, frame: null,
                hasTexture: true, hasFrameWebp: false, _leaf: null
            };
            if(rec.entry) rec.entry.info = PAINTS_CATALOG[name];
        }
        renderPaintGrid(document.getElementById('paint-search')?.value || '', currentPaintFilter);
        // Local paints have no meta.info to probe — skip them entirely so the
        // worker never rewrites their badge/thumbnail.
        const names = Object.keys(PAINTS_CATALOG).filter(n => !PAINTS_CATALOG[n].isLocal);
        let idx=0;
        const concurrency=12;
        const now = performance.now();
        async function worker(){
            while(idx < names.length){
                const n = names[idx++];
                await fetchPaintMeta(n);
                const el = document.querySelector(`.paint-item[data-name="${CSS.escape(n)}"]`);
                if(el){
                    const info = PAINTS_CATALOG[n];
                    el.classList.toggle('animated', !!info.isAnimated);
                    el.classList.toggle('static', !info.isAnimated);
                    const badge = el.querySelector('.paint-badge');
                    if(badge) badge.innerText = info.isAnimated ? (userLang==='zh' ? '动画' : 'ANI') : (userLang==='zh' ? '静态' : 'STA');
                    
                    if (info.isAnimated && info.frame && !el.querySelector('.paint-thumb-anim')) {
                        const oldImg = el.querySelector('.paint-thumb');
                        if (oldImg) oldImg.remove();
                        const file = getPaintFileName(info);
                        const url = `${RES_BASE}/${info.path}/${file}`;
                        const f = info.frame;
                        const cols = Math.max(1, Math.floor(f.imageWidth / f.frameWidth));
                        const rows = Math.max(1, Math.floor(f.imageHeight / f.frameHeight));
                        const totalFrames = f.numFrames || (cols * rows);
                        const thumb = document.createElement('div');
                        thumb.className = 'paint-thumb-anim';
                        thumb.style.backgroundImage = `url('${url}')`;
                        thumb.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
                        thumb.style.backgroundPosition = `0% 0%`;
                        if (badge) el.insertBefore(thumb, badge);
                        else el.appendChild(thumb);
                        activeGridAnimItems.push({
                            el: thumb,
                            frame: f,
                            cols,
                            rows,
                            totalFrames,
                            startTime: now,
                            lastFrame: -1
                        });
                    }
                }
            }
        }
        const workers = Array.from({length: concurrency}, ()=>worker());
        await Promise.all(workers);
        renderPaintGrid(document.getElementById('paint-search')?.value || '', currentPaintFilter);
        renderPaintCurrent();
    }

    function selectPaint(name){
        if(!name || !PAINTS_CATALOG[name]){
            clearCurrentPaint();
            return;
        }
        const info = PAINTS_CATALOG[name];
        currentPaintName = name;
        visState.paint = true;
        setPaintSwitches(true);
        // Each paint remembers its own scale; local media starts a bit larger
        // because photos/videos carry much more detail than a tiling camo.
        const rememberedScale = paintCache.get(name)?.scale;
        paintScaleMul = (typeof rememberedScale === 'number' && isFinite(rememberedScale))
            ? rememberedScale
            : (info.isLocal ? LOCAL_PAINT_DEFAULT_SCALE : 1);
        window.paintScaleMul = paintScaleMul;
        renderPaintCurrent();
        loadPaintTexture(name).then(entry=>{
            entry.scale = paintScaleMul;
            currentPaintEntry = entry;
            if(entry.isAnimated){
                paintAnimState = { entry, time: 0 };
                if(entry.frame){
                    entry.frame.currentFrame = 0;
                    entry.frame.time = 0;
                }
            } else {
                paintAnimState = null;
            }
            renderPaintCurrent();
            if(slots.hull?.group) applyPaintToGroup(slots.hull.group, entry);
            if(slots.turret?.group) applyPaintToGroup(slots.turret.group, entry);
            if(slots.more?.group) applyPaintToGroup(slots.more.group, entry);
            msg(`${T.paintApplied}: ${name}`);
            document.querySelectorAll('.paint-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.name === name);
            });
        }).catch(e=>{
            console.error(e);
            msg(String(e.message||e));
        });
    }

    function clearCurrentPaint(){
        currentPaintName = null;
        currentPaintEntry = null;
        paintAnimState = null;
        if(slots.hull?.group) clearPaintFromGroup(slots.hull.group);
        if(slots.turret?.group) clearPaintFromGroup(slots.turret.group);
        if(slots.more?.group) clearPaintFromGroup(slots.more.group);
        visState.paint = false;
        setPaintSwitches(false);
        renderPaintCurrent();
        document.querySelectorAll('.paint-item').forEach(el => {
            el.classList.remove('selected');
        });
        msg(T.paintCleared);
    }

    /* ==================================================================== *
     *  LOCAL CAMOUFLAGES — pick an image/video from disk, or drop one on
     *  the model.  A local paint is registered as an ordinary catalog entry
     *  (`PAINTS_CATALOG[name] = { isLocal:true, ... }`) plus a record in
     *  LOCAL_PAINTS that owns the GPU texture and any live media element,
     *  so every existing code path — picker grid, card thumbnail, shader
     *  material, model reload re-apply — keeps working untouched.
     *
     *  Three kinds of source are supported:
     *    static   any still raster/vector the browser can decode
     *             (png jpg jpeg webp bmp avif svg ico tiff heic …)
     *    animated GIF / animated WebP / APNG — the browser animates a live
     *             <img>, we blit its current frame into a canvas each tick,
     *             so *any* animated format the browser knows just works.
     *    video    mp4 / webm / mov / mkv … driven by THREE.VideoTexture.
     * ==================================================================== */

    // Off-screen (but still *rendered*, otherwise browsers pause animation)
    // host for the live <img>/<video> elements that drive animated paints.
    let localMediaHost = null;
    function getLocalMediaHost(){
        if(localMediaHost && localMediaHost.isConnected) return localMediaHost;
        localMediaHost = document.createElement('div');
        localMediaHost.id = 'local-paint-media-host';
        localMediaHost.setAttribute('aria-hidden', 'true');
        localMediaHost.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;'
            + 'overflow:hidden;opacity:0.01;pointer-events:none;z-index:0;';
        document.body.appendChild(localMediaHost);
        return localMediaHost;
    }

    function isImageFile(f){ return (f.type && f.type.startsWith('image/')) || IMAGE_EXT_RE.test(f.name || ''); }
    function isVideoFile(f){ return (f.type && f.type.startsWith('video/')) || VIDEO_EXT_RE.test(f.name || ''); }
    function isMediaFile(f){ return isImageFile(f) || isVideoFile(f); }

    // "MyPattern.final.PNG" -> "MyPattern.final"   (name = filename sans extension)
    function fileStemAsPaintName(fileName){
        const base = String(fileName || '').replace(/^.*[\\/]/, '');
        const stem = base.replace(/\.[^.\s]+$/, '').trim();
        return stem || base || 'Local paint';
    }
    function uniquePaintName(base){
        if(!PAINTS_CATALOG[base]) return base;
        let i = 2;
        while(PAINTS_CATALOG[`${base} (${i})`]) i++;
        return `${base} (${i})`;
    }

    // ---- Animation sniffing ------------------------------------------------
    // Decide whether a still-image file actually contains multiple frames, so
    // static photos take the cheap path and animations take the live path.
    function asciiAt(b, off, len){
        let s = '';
        for(let i = 0; i < len; i++) s += String.fromCharCode(b[off + i] || 0);
        return s;
    }
    function findAscii(b, needle, from, to){
        const n = needle.length, end = Math.min(to, b.length) - n;
        for(let i = from; i <= end; i++){
            let ok = true;
            for(let j = 0; j < n; j++){ if(b[i + j] !== needle.charCodeAt(j)){ ok = false; break; } }
            if(ok) return i;
        }
        return -1;
    }
    // Walk GIF blocks and stop as soon as a 2nd image descriptor shows up.
    function gifIsAnimated(b){
        let p = 13;
        const flags = b[10];
        if(flags & 0x80) p += 3 * (1 << ((flags & 7) + 1));   // global colour table
        let frames = 0;
        const skipSubBlocks = () => { while(p < b.length){ const n = b[p++]; if(!n) break; p += n; } };
        while(p < b.length){
            const block = b[p++];
            if(block === 0x3B) break;                          // trailer
            if(block === 0x21){ p++; skipSubBlocks(); continue; } // extension
            if(block === 0x2C){                                 // image descriptor
                if(++frames > 1) return true;
                p += 8;
                const lf = b[p++];
                if(lf & 0x80) p += 3 * (1 << ((lf & 7) + 1));   // local colour table
                p++;                                            // LZW min code size
                skipSubBlocks();
                continue;
            }
            break;                                              // unknown -> bail out
        }
        return false;
    }
    async function sniffAnimatedImage(file){
        try{
            const cap = Math.min(file.size, 8 * 1024 * 1024);
            const b = new Uint8Array(await file.slice(0, cap).arrayBuffer());
            if(b.length < 16) return false;
            // PNG signature -> APNG if an acTL chunk precedes the image data
            if(b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47){
                const idat = findAscii(b, 'IDAT', 8, b.length);
                return findAscii(b, 'acTL', 8, idat > 0 ? idat : Math.min(b.length, 65536)) >= 0;
            }
            if(asciiAt(b, 0, 3) === 'GIF') return gifIsAnimated(b);
            if(asciiAt(b, 0, 4) === 'RIFF' && asciiAt(b, 8, 4) === 'WEBP'){
                // VP8X extended header carries an ANIMATION flag (bit 1)
                if(asciiAt(b, 12, 4) === 'VP8X' && (b[20] & 0x02)) return true;
                return findAscii(b, 'ANIM', 12, 512) >= 0;
            }
        }catch(e){ /* unreadable header -> treat as a still */ }
        return false;
    }

    // ---- Texture sizing ----------------------------------------------------
    // Accept literally any resolution: clamp to the GPU limit and, on the
    // (rare) WebGL1 fallback, snap to power-of-two so REPEAT tiling is legal.
    function nearestPOT(v){ return Math.max(1, Math.pow(2, Math.round(Math.log2(Math.max(1, v))))); }
    function fitTextureSize(w, h){
        const caps = renderer.capabilities;
        const isGL2 = caps.isWebGL2 !== false;
        const maxS = caps.maxTextureSize || 4096;
        let tw = Math.max(1, Math.round(w) || 1), th = Math.max(1, Math.round(h) || 1);
        if(!isGL2){ tw = nearestPOT(tw); th = nearestPOT(th); }
        const big = Math.max(tw, th);
        if(big > maxS){
            const k = maxS / big;
            tw = Math.max(1, Math.floor(tw * k));
            th = Math.max(1, Math.floor(th * k));
            if(!isGL2){ tw = nearestPOT(tw); th = nearestPOT(th); }
        }
        return { tw, th };
    }

    function decodeImageElement(url){
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.decoding = 'async';
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('decode failed'));
            img.src = url;
        });
    }

    // ---- Builders for the three kinds -------------------------------------
    // Decode a still image to a canvas-backed source.
    //
    // IMPORTANT — why everything is funnelled through a <canvas>:
    // WebGL's UNPACK_FLIP_Y_WEBGL (which is how three.js implements
    // `texture.flipY = true`) is specified to have NO EFFECT on an ImageBitmap
    // source. So handing three.js a raw ImageBitmap yields a texture that is
    // upside-down relative to every other source type — the camo appears
    // flipped, and on mirrored UV islands that reads as a mirrored pattern.
    // Painting the bitmap into a 2D canvas first gives a source that honours
    // flipY normally, so local images line up with the official camouflages.
    async function buildStaticLocalTexture(file, url){
        let source = null, sw = 0, sh = 0, closeAfter = null;
        // createImageBitmap covers the widest format range and honours EXIF.
        if(typeof createImageBitmap === 'function'){
            try{
                source = await createImageBitmap(file, { imageOrientation: 'from-image', premultiplyAlpha: 'none' });
                sw = source.width; sh = source.height;
                closeAfter = source;
            }catch(e){ source = null; }
        }
        if(!source){    // SVG and other exotics decode fine through <img>
            const img = await decodeImageElement(url);
            source = img;
            sw = img.naturalWidth || img.width || 1;
            sh = img.naturalHeight || img.height || 1;
        }
        const { tw, th } = fitTextureSize(sw, sh);
        const cv = document.createElement('canvas');
        cv.width = tw; cv.height = th;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(source, 0, 0, tw, th);
        if(closeAfter && closeAfter.close) closeAfter.close();
        const tex = new THREE.CanvasTexture(cv);
        setupTex(tex);
        return { texture: tex, width: sw, height: sh, tick: null, media: null };
    }

    // Decode every frame up-front with WebCodecs. This is the reliable path:
    // an <img> parked off-screen is frequently throttled or frozen outright by
    // the browser (it only animates images it considers visible), and it gives
    // no control over timing. ImageDecoder hands us exact frames + per-frame
    // durations for GIF, animated WebP and APNG alike.
    async function decodeAnimationFrames(file){
        if(typeof ImageDecoder === 'undefined') return null;
        const type = file.type || guessMimeFromName(file.name);
        try{
            if(ImageDecoder.isTypeSupported && !(await ImageDecoder.isTypeSupported(type))) return null;
            const dec = new ImageDecoder({
                data: await file.arrayBuffer(), type, preferAnimation: true
            });
            await dec.tracks.ready;
            const track = dec.tracks.selectedTrack;
            if(!track || !track.animated || track.frameCount < 2){ dec.close(); return null; }
            // frameCount is only final once the whole stream is parsed.
            try{ await dec.completed; }catch(e){}
            const total = Math.min(dec.tracks.selectedTrack.frameCount || track.frameCount, 600);
            const frames = [];
            for(let i = 0; i < total; i++){
                let res;
                try{ res = await dec.decode({ frameIndex: i }); }
                catch(e){ break; }
                const img = res.image;
                // duration is in microseconds; clamp out 0/absurd values.
                let ms = (img.duration || 0) / 1000;
                if(!isFinite(ms) || ms <= 0) ms = 100;
                frames.push({ bitmap: img, duration: THREE.MathUtils.clamp(ms, 20, 10000) });
            }
            dec.close();
            if(frames.length < 2){ frames.forEach(f => f.bitmap.close()); return null; }
            return frames;
        }catch(e){
            return null;
        }
    }
    function guessMimeFromName(n){
        const e = String(n||'').toLowerCase().split('.').pop();
        return ({ gif:'image/gif', webp:'image/webp', png:'image/png', apng:'image/png',
                  avif:'image/avif', jpg:'image/jpeg', jpeg:'image/jpeg' })[e] || 'image/png';
    }

    async function buildAnimatedLocalTexture(file, url){
        const frames = await decodeAnimationFrames(file);

        // ---- Preferred path: real decoded frames, driven by our own clock ---
        if(frames && frames.length > 1){
            const first = frames[0].bitmap;
            const sw = first.displayWidth || first.codedWidth || 1;
            const sh = first.displayHeight || first.codedHeight || 1;
            const { tw, th } = fitTextureSize(sw, sh);

            const cv = document.createElement('canvas');
            cv.width = tw; cv.height = th;
            const ctx = cv.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(first, 0, 0, tw, th);

            const tex = new THREE.CanvasTexture(cv);
            setupTex(tex);
            tex.generateMipmaps = false;            // too costly per frame
            tex.minFilter = THREE.LinearFilter;

            let idx = 0, acc = 0, prev = performance.now();
            const tick = (now) => {
                const dt = now - prev; prev = now;
                // A backgrounded tab can hand us a huge delta; don't spin.
                acc += Math.min(dt, 250);
                let guard = 0;
                while(acc >= frames[idx].duration && guard++ < frames.length){
                    acc -= frames[idx].duration;
                    idx = (idx + 1) % frames.length;
                    ctx.clearRect(0, 0, tw, th);
                    ctx.drawImage(frames[idx].bitmap, 0, 0, tw, th);
                    tex.needsUpdate = true;
                }
            };
            return {
                texture: tex, width: sw, height: sh, tick, media: null,
                frames, frameCount: frames.length,
                dispose(){ frames.forEach(f => { try{ f.bitmap.close(); }catch(e){} }); }
            };
        }

        // ---- Fallback: let the browser animate a live <img> -----------------
        // Kept for engines without WebCodecs. The element must be on-screen-ish
        // (1px, nearly transparent) or the animation may never start.
        const img = await decodeImageElement(url);
        const sw = img.naturalWidth || img.width || 1;
        const sh = img.naturalHeight || img.height || 1;
        const { tw, th } = fitTextureSize(sw, sh);
        img.style.cssText = `position:absolute;left:0;top:0;width:${tw}px;height:${th}px;`;
        getLocalMediaHost().appendChild(img);

        const cv = document.createElement('canvas');
        cv.width = tw; cv.height = th;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, tw, th);

        const tex = new THREE.CanvasTexture(cv);
        setupTex(tex);
        tex.generateMipmaps = false;
        tex.minFilter = THREE.LinearFilter;

        let last = 0;
        const tick = (now) => {                    // ~30 fps is plenty
            if(now - last < 33) return;
            last = now;
            try{ ctx.clearRect(0, 0, tw, th); ctx.drawImage(img, 0, 0, tw, th); tex.needsUpdate = true; }catch(e){}
        };
        return { texture: tex, width: sw, height: sh, tick, media: img };
    }

    function buildVideoLocalTexture(url){
        return new Promise((resolve, reject) => {
            const v = document.createElement('video');
            v.src = url;
            v.loop = true;
            v.muted = true;                 // muted is what makes autoplay legal
            v.defaultMuted = true;
            v.autoplay = true;
            v.playsInline = true;
            v.crossOrigin = 'anonymous';
            v.preload = 'auto';
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.style.cssText = 'position:absolute;left:0;top:0;width:1px;height:1px;';
            getLocalMediaHost().appendChild(v);

            let settled = false;
            const fail = () => { if(settled) return; settled = true; try{ v.remove(); }catch(e){} reject(new Error('video decode failed')); };
            v.onerror = fail;
            setTimeout(() => { if(!settled && !v.videoWidth) fail(); }, 20000);

            v.onloadeddata = () => {
                if(settled) return;
                settled = true;
                const sw = v.videoWidth || 1, sh = v.videoHeight || 1;
                const tex = new THREE.VideoTexture(v);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = false;
                try{ tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); }catch(e){}
                const p = v.play();
                if(p && p.catch) p.catch(() => { pendingVideoResume.add(v); msg(T.dropVideoBlocked); });
                resolve({ texture: tex, width: sw, height: sh, tick: null, media: v });
            };
            v.load();
        });
    }

    // Browsers may still refuse muted autoplay; resume on the first gesture.
    const pendingVideoResume = new Set();
    function resumeBlockedVideos(){
        if(!pendingVideoResume.size) return;
        pendingVideoResume.forEach(v => { const p = v.play(); if(p && p.catch) p.catch(()=>{}); });
        pendingVideoResume.clear();
    }
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
        window.addEventListener(ev, resumeBlockedVideos, { passive: true }));

    // ---- Registration ------------------------------------------------------
    async function createLocalPaint(file){
        const url = URL.createObjectURL(file);
        let built, kind;
        try{
            if(isVideoFile(file)){
                kind = 'video';
                built = await buildVideoLocalTexture(url);
            } else {
                kind = (await sniffAnimatedImage(file)) ? 'animated' : 'static';
                built = kind === 'animated'
                    ? await buildAnimatedLocalTexture(file, url)
                    : await buildStaticLocalTexture(file, url);
            }
        }catch(err){
            URL.revokeObjectURL(url);
            throw err;
        }

        const name = uniquePaintName(fileStemAsPaintName(file.name));
        const tex = built.texture;
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 1);
        tex.offset.set(0, 0);
        tex.name = name;

        const rec = {
            name, kind, url, file,
            texture: tex,
            width: built.width, height: built.height,
            aspect: (built.width && built.height) ? (built.width / built.height) : 1,
            tick: built.tick,
            media: built.media,
            frameCount: built.frameCount || 0,
            dispose: built.dispose || null,
            id: ++localPaintSeq
        };
        LOCAL_PAINTS.set(name, rec);

        // A local paint masquerades as a normal catalog entry. isAnimated stays
        // false on purpose: local animations update the texture *in place*
        // instead of walking a sprite sheet, so the shader treats them as
        // ordinary single-frame maps and no frame transform is needed.
        PAINTS_CATALOG[name] = {
            path: null, isLocal: true, localKind: kind,
            isAnimated: false, frame: null,
            hasTexture: true, hasFrameWebp: false, _leaf: null
        };

        // Ready-to-use paint entry, pre-seeded into the shared cache.
        const entry = {
            texture: tex, isAnimated: false, frame: null,
            info: PAINTS_CATALOG[name], name,
            isLocal: true, localKind: kind, aspect: rec.aspect,
            scale: LOCAL_PAINT_DEFAULT_SCALE
        };
        paintCache.set(name, entry);
        rec.entry = entry;
        return rec;
    }

    // Entry point shared by the file button and the drag & drop overlay.
    async function importLocalPaintFiles(fileList, autoSelect){
        const files = Array.from(fileList || []).filter(isMediaFile);
        if(!files.length){ msg(T.paintUnsupported); return []; }
        const added = [];
        for(const f of files){
            try{
                msg(`${T.paintLoading}: ${f.name}`);
                const rec = await createLocalPaint(f);
                added.push(rec.name);
            }catch(err){
                console.error('[local paint]', f.name, err);
                msg(`${T.paintLoadFail}: ${f.name}`);
            }
        }
        if(added.length){
            refreshPaintGridIfOpen();
            if(autoSelect !== false) selectPaint(added[added.length - 1]);
            else renderPaintCurrent();
        }
        return added;
    }
    window.importLocalPaintFiles = importLocalPaintFiles;
    // Read-only introspection helper (handy from the devtools console):
    // what is applied right now, and where did it come from?
    window.getCurrentPaint = () => ({
        name: currentPaintName,
        entry: currentPaintEntry,
        scale: paintScaleMul,
        enabled: !!visState.paint,
        local: currentPaintName ? (LOCAL_PAINTS.get(currentPaintName) || null) : null
    });

    function removeLocalPaint(name){
        const rec = LOCAL_PAINTS.get(name);
        if(!rec) return;
        if(currentPaintName === name) clearCurrentPaint();
        LOCAL_PAINTS.delete(name);
        delete PAINTS_CATALOG[name];
        paintCache.delete(name);
        try{ if(rec.texture) rec.texture.dispose(); }catch(e){}
        try{ if(rec.dispose) rec.dispose(); }catch(e){}   // close decoded frames
        if(rec.media){
            pendingVideoResume.delete(rec.media);
            try{ if(rec.media.pause) rec.media.pause(); }catch(e){}
            try{ rec.media.removeAttribute('src'); if(rec.media.load) rec.media.load(); }catch(e){}
            try{ rec.media.remove(); }catch(e){}
        }
        try{ URL.revokeObjectURL(rec.url); }catch(e){}
        refreshPaintGridIfOpen();
        renderPaintCurrent();
        msg(T.paintRemoved);
    }
    window.removeLocalPaint = removeLocalPaint;

    // Keep the live <img>/<video>-backed textures flowing (called from the
    // main render loop through updatePaintAnimation).
    function tickLocalPaints(){
        if(!LOCAL_PAINTS.size) return;
        const now = performance.now();
        const activeName = currentPaintName;
        for(const [name, rec] of LOCAL_PAINTS){
            if(!rec.tick) continue;                       // video self-updates
            // Only the applied paint has to reach the GPU every frame; the rest
            // are just <img> thumbnails the browser animates for free.
            if(name !== activeName || !visState.paint) continue;
            rec.tick(now);
        }
    }

    // Drop a live <img>/<video> preview into a thumbnail container.
    function fillLocalThumb(container, rec, cls){
        container.innerHTML = '';
        container.style.backgroundImage = '';
        let el;
        if(rec.kind === 'video'){
            el = document.createElement('video');
            el.src = rec.url;
            el.loop = true; el.muted = true; el.defaultMuted = true;
            el.autoplay = true; el.playsInline = true; el.preload = 'auto';
            el.setAttribute('muted', ''); el.setAttribute('playsinline', '');
            const p = el.play(); if(p && p.catch) p.catch(() => pendingVideoResume.add(el));
        } else {
            el = document.createElement('img');
            el.src = rec.url;
            el.alt = rec.name;
            el.decoding = 'async';
        }
        if(cls) el.className = cls;
        container.appendChild(el);
        return el;
    }

    function localTypeLabel(kind){
        if(kind === 'video') return T.paintTypeLocalVideo;
        if(kind === 'animated') return T.paintTypeLocalAnim;
        return T.paintTypeLocalStatic;
    }

    function refreshPaintGridIfOpen(){
        if(document.getElementById('paint-picker')?.classList.contains('show')){
            renderPaintGrid(document.getElementById('paint-search')?.value || '', currentPaintFilter);
        }
    }

    // ---- Pattern scale -----------------------------------------------------
    // Purely a uniform tweak: no shader recompile, no material rebuild.
    function setPaintScale(v){
        if(!isFinite(v)) v = 1;
        paintScaleMul = THREE.MathUtils.clamp(v, PAINT_SCALE_MIN, PAINT_SCALE_MAX);
        window.paintScaleMul = paintScaleMul;
        if(currentPaintEntry) currentPaintEntry.scale = paintScaleMul;
        for(const mat of allPaintMats){
            const base = mat.userData.paintBaseDensity;
            if(!base) continue;
            const d = THREE.MathUtils.clamp(base / paintScaleMul, 0.005, 256.0);
            const asp = mat.userData.paintAspect || 1;
            mat.userData.paintDensity = d;
            const sh = mat.userData.shader;
            if(sh && sh.uniforms && sh.uniforms.paintUvScale) sh.uniforms.paintUvScale.value.set(d, d * asp);
        }
        document.querySelectorAll('.paint-scale-row').forEach(r => {
            const inp = r.querySelector('.paint-scale-input');
            const val = r.querySelector('.paint-scale-val');
            if(inp && document.activeElement !== inp) inp.value = String(paintScaleMul);
            if(val) val.innerHTML = paintScaleMul.toFixed(2) + '&times;';
        });
    }
    window.setPaintScale = setPaintScale;

    /* ---- Drag & drop: anywhere on the page, including onto the model ---- */
    (function setupPaintDragAndDrop(){
        const overlay = document.getElementById('paint-drop-overlay');
        if(!overlay) return;
        const hintEl = document.getElementById('t-drop-hint');
        let depth = 0, lastProbe = 0, overModel = false;

        const hasFiles = (e) => {
            const dt = e.dataTransfer;
            if(!dt) return false;
            if(dt.types && Array.from(dt.types).includes('Files')) return true;
            return !!(dt.items && dt.items.length);
        };
        // Is the cursor over an actual tank part? Purely cosmetic - it only
        // swaps the overlay's sub-title, the drop applies either way.
        const probeModel = (e) => {
            const now = performance.now();
            if(now - lastProbe < 90) return;
            lastProbe = now;
            const x = (e.clientX / innerWidth) * 2 - 1;
            const y = -(e.clientY / innerHeight) * 2 + 1;
            partRaycaster.setFromCamera(new THREE.Vector2(x, y), camera);
            const groups = [slots.hull?.group, slots.turret?.group, slots.more?.group].filter(Boolean);
            const hit = groups.length ? partRaycaster.intersectObjects(groups, true).some(h => h.object?.isMesh) : false;
            if(hit !== overModel){
                overModel = hit;
                if(hintEl) hintEl.innerText = hit ? T.dropOnModel : T.dropTitle;
                overlay.classList.toggle('over-model', hit);
            }
        };
        const show = () => { overlay.classList.add('show'); };
        const hide = () => { depth = 0; overlay.classList.remove('show'); };

        window.addEventListener('dragenter', (e) => {
            if(!hasFiles(e)) return;
            e.preventDefault();
            depth++;
            show();
        });
        window.addEventListener('dragover', (e) => {
            if(!hasFiles(e)) return;
            e.preventDefault();
            try{ e.dataTransfer.dropEffect = 'copy'; }catch(err){}
            if(!overlay.classList.contains('show')) { depth = Math.max(depth, 1); show(); }
            probeModel(e);
        });
        window.addEventListener('dragleave', (e) => {
            if(!overlay.classList.contains('show')) return;
            depth--;

                || e.clientX >= innerWidth || e.clientY >= innerHeight))) hide();
        });
        window.addEventListener('drop', async (e) => {
            if(!hasFiles(e)) return;
            e.preventDefault();
            hide();
            const dt = e.dataTransfer;
            let files = Array.from(dt.files || []);

                    .filter(i => i.kind === 'file')

    })();

    function texStem(s) {
        if (!s) return '';
        return String(s).toLowerCase()
            .replace(/^.*[\\/]/, '')          // strip path
            .replace(/\.[a-z0-9]+$/i, '')     // strip extension
            .replace(/[\s_\-]+/g, '');        // collapse separators (bg1 1024 == bg11024)
    }

    // Parse a 3DS ArrayBuffer for material→texture and mesh→material maps.
    // Needed because most garage .3ds files name materials "Material #NNNN"
    // while the actual link to "BL.PNG"/"GAR1.PNG" lives only in the texture-map chunk.
    // Birthday 16 is the exception where material names already equal texture stems.
    function parse3dsTextureBindings(buf) {
        const data = new Uint8Array(buf);
        const view = new DataView(buf);
        const matTex = Object.create(null);   // materialName -> textureBasename
        const meshMats = Object.create(null); // meshName -> [materialName]

        const readCString = (off, end) => {
            let i = off;
            while (i < end && data[i] !== 0) i++;
            return { str: new TextDecoder('latin1').decode(data.subarray(off, i)), next: i + 1 };
        };

        const walk = (offset, end) => {
            while (offset + 6 <= end) {
                const cid = view.getUint16(offset, true);
                const size = view.getUint32(offset + 2, true);
                if (size < 6 || offset + size > end) break;
                const chunkEnd = offset + size;
                const ds = offset + 6;

                if (cid === 0x4D4D || cid === 0x3D3D) {
                    walk(ds, chunkEnd);
                } else if (cid === 0xAFFF) { // material entry
                    let matName = null, texName = null;
                    let pos = ds;
                    while (pos + 6 <= chunkEnd) {
                        const scid = view.getUint16(pos, true);
                        const ssize = view.getUint32(pos + 2, true);
                        if (ssize < 6 || pos + ssize > chunkEnd) break;
                        if (scid === 0xA000) { // material name
                            matName = readCString(pos + 6, pos + ssize).str;
                        } else if (scid === 0xA200 || scid === 0xA210 || scid === 0xA230 || scid === 0xA204) {
                            // diffuse / opacity / bump / specular map — dig for filename (0xA300)
                            let tpos = pos + 6;
                            const tend = pos + ssize;
                            while (tpos + 6 <= tend) {
                                const tcid = view.getUint16(tpos, true);
                                const tsize = view.getUint32(tpos + 2, true);
                                if (tsize < 6 || tpos + tsize > tend) break;
                                if (tcid === 0xA300) {
                                    const tn = readCString(tpos + 6, tpos + tsize).str;
                                    if (tn) texName = tn;
                                }
                                tpos += tsize;
                            }
                        }
                        pos += ssize;
                    }
                    if (matName && texName) matTex[matName] = texName;
                } else if (cid === 0x4000) { // named object
                    const { str: objName, next } = readCString(ds, chunkEnd);
                    const matsUsed = [];
                    const findMats = (o, e) => {
                        while (o + 6 <= e) {
                            const c = view.getUint16(o, true);
                            const s = view.getUint32(o + 2, true);
                            if (s < 6 || o + s > e) break;
                            if (c === 0x4100) {
                                findMats(o + 6, o + s);
                            } else if (c === 0x4120) {
                                const nfaces = view.getUint16(o + 6, true);
                                findMats(o + 6 + 2 + nfaces * 8, o + s);
                            } else if (c === 0x4130) {
                                matsUsed.push(readCString(o + 6, o + s).str);
                            }
                            o += s;
                        }
                    };
                    findMats(next, chunkEnd);
                    if (objName) meshMats[objName] = matsUsed;
                }
                offset = chunkEnd;
            }
        };
        walk(0, data.byteLength);
        return { matTex, meshMats };
    }

    async function loadRemoteScene(path, variant) {
        if(slots.scene) { disposeMixer(slots.scene); groupAssembly.remove(slots.scene); dispose(slots.scene); slots.scene=null; }
        sceneLib.meshes =[]; sceneLib.tex.clear();
        try {
            const meta = await fetchMeta(path);
            const models = meta.filter(f => f.name.match(/\.(a3d|3ds)$/i));
            // Only browser-decodable images (skip GPU-compressed .ktx)
            const images = meta.filter(f => f.name.match(/\.(webp|png|jpg|jpeg)$/i) && !/\.ktx$/i.test(f.name));
            // Encode path segments so names with spaces (e.g. "bg1 1024.webp") resolve
            const texUrlOf = (name) => `${RES_BASE}/${path}/${String(name).split('/').map(encodeURIComponent).join('/')}`;
            const texProm = images.map(async f => {
                const tex = await new THREE.TextureLoader().loadAsync(texUrlOf(f.name));
                tex.name = f.name; setupTex(tex); return { n: f.name, t: tex };
            });
            const loadedTex = await Promise.all(texProm); loadedTex.forEach(o => sceneLib.tex.set(o.n, o.t));

            const combinedGroup = new THREE.Group();
            for(let f of models) {
                const mUrl = `${RES_BASE}/${path}/${encodeURIComponent(f.name)}`;
                const resp = await fetch(mUrl); if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const buf = await resp.arrayBuffer();
                let grp;
                let bindings = null;

                if(f.name.toLowerCase().endsWith('.a3d')) {
                    grp = parseA3D(buf, f.name);
                } else {
                    // Parse texture bindings from the raw 3DS BEFORE TDSLoader runs.
                    bindings = parse3dsTextureBindings(buf);
                    // 3DS files reference missing .PNG names on CDN (.webp only).
                    // Stub those requests with a 1x1 pixel so the console stays clean;
                    // real textures are applied later by runSceneInjector.
                    const stubMgr = new THREE.LoadingManager();
                    const PIXEL = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
                    stubMgr.setURLModifier((url) => {
                        // Only rewrite texture-like relative paths; leave the .3ds itself alone
                        if (/\.(png|jpg|jpeg|bmp|tga|gif|webp)(\?|$)/i.test(url) || !/^https?:|^data:|^blob:/i.test(url)) {
                            return PIXEL;
                        }
                        return url;
                    });
                    const loader = new TDSLoader(stubMgr);
                    loader.setResourcePath('');
                    grp = loader.parse(buf, '');
                }

                grp.traverse(o => {
                    if (!o.isMesh) return;
                    if (o.parent) o.userData.parentName = o.parent.name;

                    const refs = [];
                    const texRefs = [];
                    const pushRef = (v) => { if (v) refs.push(String(v)); };
                    const pushTex = (v) => { if (v) texRefs.push(String(v)); };

                    // Candidate refs for texture matching (mesh/material/parent names)
                    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
                    for (const mat of mats) {
                        pushRef(mat && mat.name);
                        // A3D materials also carry the original texture filename in userData
                        if (mat && mat.userData && mat.userData.texName) {
                            pushRef(mat.userData.texName);
                            pushTex(mat.userData.texName);
                        }
                    }
                    pushRef(o.name);
                    pushRef(o.userData.parentName);

                    // From 3DS binary: map mesh → materials → texture filenames
                    if (bindings) {
                        const mlist = bindings.meshMats[o.name] || [];
                        for (const mn of mlist) {
                            pushRef(mn);
                            if (bindings.matTex[mn]) {
                                pushRef(bindings.matTex[mn]);
                                pushTex(bindings.matTex[mn]);
                            }
                        }
                        // Also accept any material currently on the mesh via matTex lookup
                        for (const mat of mats) {
                            if (mat && mat.name && bindings.matTex[mat.name]) {
                                pushRef(bindings.matTex[mat.name]);
                                pushTex(bindings.matTex[mat.name]);
                            }
                        }
                    }

                    o.userData.texRefs = Array.from(new Set(refs.filter(Boolean)));
                    o.userData.textureNames = Array.from(new Set(texRefs.filter(Boolean)));
                    sceneLib.meshes.push(o);
                });
                combinedGroup.add(grp);
            }
            slots.scene = combinedGroup; groupAssembly.add(combinedGroup); runSceneInjector(); renderSceneTextureNames();
            setCameraMode('fly');
            placeEnvCamera(combinedGroup);
        } catch(e) { console.error(e); msg(String(e.message || e)); }
    }

    // Hide garage camera helper meshes and put the free-look camera on cam0,
    // aiming at the tank (hull/turret), not the whole garage bounds.
    function isCamMarkerName(n) {
        n = (n || '').toLowerCase();
        return n === 'cam0' || n === 'cam' || n === 'cam_t0' || n === 'cam_t' || n === 'camt0' || n.startsWith('cam');
    }
    function placeEnvCamera(envGroup) {
        if (!envGroup) return;
        envGroup.updateMatrixWorld(true);
        if (slots.hull?.group) slots.hull.group.updateMatrixWorld(true);
        if (slots.turret?.group) slots.turret.group.updateMatrixWorld(true);

        let camNode = null;
        envGroup.traverse(o => {
            const n = (o.name || '').toLowerCase();
            // Camera markers in garage assets: cam0 (eye) / cam_t0 (look-at helper)
            if (n === 'cam0' || n === 'cam') camNode = o;
            // Hide the helper geometry itself (mesh may be named differently under A3D parent)
            if (o.isMesh && (isCamMarkerName(o.name) || isCamMarkerName(o.parent && o.parent.name) || isCamMarkerName(o.userData.originalName))) {
                o.visible = false;
            }
        });

        // Look-at: prefer assembled tank; fall back to garage tank platform markers
        const look = new THREE.Vector3();
        let hasLook = false;
        const tankBox = new THREE.Box3();
        let hasTankBox = false;
        const expandTank = (grp) => {
            if (!grp) return;
            const b = new THREE.Box3().setFromObject(grp);
            if (b.isEmpty()) return;
            if (!hasTankBox) { tankBox.copy(b); hasTankBox = true; }
            else tankBox.union(b);
        };
        expandTank(slots.hull?.group);
        expandTank(slots.turret?.group);
        if (hasTankBox) {
            tankBox.getCenter(look);
            hasLook = true;
        } else {
            // No tank loaded yet — aim at garage tnk_plat / tnk_base / cam_t0
            const platBox = new THREE.Box3();
            let hasPlat = false;
            envGroup.traverse(o => {
                if (!o.isMesh || !o.visible) return;
                const n = ((o.name || '') + ' ' + (o.userData.originalName || '') + ' ' + (o.parent?.name || '')).toLowerCase();
                if (!(n.includes('tnk_plat') || n.includes('tnk_base') || n.includes('tank'))) return;
                const geo = o.geometry;
                if (!geo) return;
                if (!geo.boundingBox) geo.computeBoundingBox();
                if (!geo.boundingBox) return;
                const wb = geo.boundingBox.clone().applyMatrix4(o.matrixWorld);
                if (!hasPlat) { platBox.copy(wb); hasPlat = true; }
                else platBox.union(wb);
            });
            if (hasPlat) {
                platBox.getCenter(look);
                hasLook = true;
            } else {
                // Last resort: cam_t0 world position or origin
                let camT = null;
                envGroup.traverse(o => {
                    const n = (o.name || '').toLowerCase();
                    if (n === 'cam_t0' || n === 'cam_t' || n === 'camt0') camT = o;
                });
                if (camT) { camT.getWorldPosition(look); hasLook = true; }
                else look.set(0, 0, 0);
            }
        }

        const pos = new THREE.Vector3();
        if (camNode) {
            camNode.getWorldPosition(pos);
        } else {
            // Fallback elevated view toward the tank
            const dist = hasTankBox ? Math.max(tankBox.getSize(new THREE.Vector3()).length() * 1.5, 120) : 400;
            pos.set(look.x + dist * 0.7, look.y + dist * 0.45, look.z + dist * 0.7);
        }

        camera.position.copy(pos);
        camera.lookAt(look);
        cameraTarget.position.copy(camera.position);
        cameraTarget.quaternion.copy(camera.quaternion);
    }

    async function loadSupplyAsset(name, skin) {
        const entry = assetsData.supplies && assetsData.supplies[name];
        if (!entry) return;
        const skinsMap = entrySkinsMap(entry);
        const pathStr = toResourcePath(skinsMap[skin] || skinsMap.default || Object.values(skinsMap)[0]);
        if (!pathStr) return;
        const meta = await fetchMeta(pathStr);
        const modelEntry = meta.find(f => f.name.toLowerCase().endsWith('.a3d')) || meta.find(f => f.name.toLowerCase().endsWith('.3ds'));
        if (!modelEntry) throw new Error("A3D/3DS model file not found");
        const modelUrl = `${RES_BASE}/${pathStr}/${modelEntry.name}`;

            // Same as drones: supply .3ds may reference author-side source
            // textures that don't exist on the CDN — stub them to 1x1 pixels,
            // extract the refs for the card's texture-name chips.
            const bindings = parse3dsTextureBindings(buf);
            const stubMgr = new THREE.LoadingManager();
            const PIXEL = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
            stubMgr.setURLModifier((url) => {
                if (/\.(png|jpg|jpeg|bmp|tga|gif|webp|psd|tif|tiff|dds)(\?|$)/i.test(url) || !/^https?:|^data:|^blob:/i.test(url)) {

            Object.values(bindings.matTex).forEach(t => { if (t) supplyTexRefs.add(t); });

    }
