<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanki Model Showcase</title>
    
    <!-- Import official Material Symbols icon library and fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    
    <style>
        /* Prevent FOUT */
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap');
        body.fouc-loading { opacity: 0; pointer-events: none; }
        body { transition: opacity 0.3s ease-in; opacity: 1; }
        * { -webkit-tap-highlight-color: transparent; }
        
        /* Design Tokens - Official Brand Theme */
        :root {
            --tanki-green: #76FF33;
            --tanki-cyan: #00D4FF;
            --tanki-light-blue: #BFD5FF;
            --tanki-yellow: #FFCC00;
            --tanki-bright-yellow: #FFEE00;
            --tanki-dark: #001926;
            --tanki-purple: #D580FF;
            --tanki-salmon: #FF6666;
            --tanki-red: #FF3333;
            --tanki-orange: #FF8000;

            --md-sys-color-background: var(--tanki-dark);
            --md-sys-color-surface: var(--tanki-dark);
            --md-sys-color-surface-container-low: #002233;
            --md-sys-color-surface-container: #002b40;
            --md-sys-color-surface-container-high: #003650;
            --md-sys-color-surface-container-highest: #004466;
            
            --md-sys-color-primary: var(--tanki-green);
            --md-sys-color-on-primary: var(--tanki-dark);
            --md-sys-color-primary-container: rgba(118, 255, 51, 0.15);
            --md-sys-color-on-primary-container: var(--tanki-green);
            
            --md-sys-color-outline: var(--tanki-light-blue);
            --md-sys-color-outline-variant: #004466;
            
            --md-sys-color-on-surface: #ffffff;
            --md-sys-color-on-surface-variant: var(--tanki-light-blue);

            --md-state-hover: rgba(191, 213, 255, 0.1);
            --md-state-focus: rgba(191, 213, 255, 0.15);
            --md-state-primary-hover: rgba(118, 255, 51, 0.1);
            
            --shape-l: 24px;
            --shape-m: 16px;
            --shape-s: 16px; 
            
            --hull: var(--tanki-green); 
            --turret: var(--tanki-green); 
            --scene: var(--tanki-orange);
            --grenade: var(--tanki-purple);
            --drone: var(--tanki-cyan); 
            --supply: #BFD5FF;
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded', sans-serif;
            font-size: 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Hard locked DOM root - fixes viewport bugs */
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden; 
        }

        body { 
            font-family: 'Rubik', 'M PLUS 1p'; 
            background: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); 
            touch-action: none; 
            position: relative;
        }
        
        h3 { letter-spacing: 0; line-height: 24px; }
        p, span, div { letter-spacing: 0.25px; }
        
        #top-bar { 
            position: absolute; top: 0; left: 0; right: 0; padding: 16px 24px; 
            background: linear-gradient(to bottom, rgba(0,25,38,0.9), transparent); 
            z-index: 10; display:flex; justify-content: space-between; align-items: center; 
            pointer-events: none;
        }
        .app-title { font-weight: 500; font-size: 20px; color: var(--md-sys-color-on-surface); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .top-bar-actions { display: flex; gap: 12px; pointer-events: auto; }
        .action-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline-variant); box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: color-mix(in srgb, var(--md-sys-color-surface-container-high), white 10%); transform: scale(1.05); color: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary);}
        .action-btn .material-symbols-rounded { font-size: 22px; }

        #toast { 
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); 
            background: #2b3135; color: #f1f0f4; padding: 14px 24px; border-radius: 100px; opacity: 0; transition: 0.4s cubic-bezier(0.2,0,0,1); 
            pointer-events: none; z-index: 300; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-size: 14px; 
            display:flex; align-items:center; gap:8px; 
            max-width: 90vw; width: max-content; box-sizing: border-box; text-align: center; word-break: break-word; line-height: 1.4;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #part-tooltip { 
            position: fixed; top: 0; left: 0; z-index: 250; 
            background: rgba(0, 25, 38, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            color: var(--md-sys-color-on-surface); 
            border: 1px solid rgba(191, 213, 255, 0.15); 
            border-radius: 8px; padding: 10px 12px; 
            font-size: 13px; font-weight: 500; 
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
            opacity: 0; pointer-events: none; 
            transform: translate(-50%, -100%) translateY(-10px); 
            transition: opacity 0.2s cubic-bezier(0.2,0,0,1), transform 0.2s cubic-bezier(0.2,0,0,1); 
            max-width: min(320px, 85vw); 
            text-transform: none;
        }
        #part-tooltip.show { opacity: 1; transform: translate(-50%, -100%) translateY(0); pointer-events: auto; }
        .part-tooltip-header { display: flex; align-items: center; gap: 6px; width: 100%; white-space: nowrap; overflow: hidden; }
        .part-tooltip-header .material-symbols-rounded { font-size: 16px; color: var(--md-sys-color-primary); flex-shrink: 0; }
        #part-tooltip-text { overflow: hidden; text-overflow: ellipsis; }
        #part-tooltip-anims { display: flex; flex-wrap: wrap; gap: 6px; }
        #part-tooltip-anims:empty { display: none; }
        @media (max-width: 768px) {
            #part-tooltip { font-size: 12px; padding: 8px 10px; border-radius: 6px; }
        }

        #attach-hull .anim-chip.active,
        #attach-turret .anim-chip.active {
            background: rgba(118, 255, 51, 0.18);
            color: #76FF33;
            border-color: #76FF33;
        }
        #attach-hull .anim-chip.active .chip-dot,
        #attach-turret .anim-chip.active .chip-dot {
            opacity: 1;
            background: #76FF33;
        }

        #drawer { 
            position: absolute; top: 0; right: 0; bottom: 0; width: 360px; max-width: 95vw; 
            background: var(--md-sys-color-surface-container-low); 
            border-top-left-radius: var(--shape-l); border-bottom-left-radius: var(--shape-l);
            display: flex; z-index: 90; 
            flex-direction: column; box-shadow: -4px 0 12px rgba(0,0,0,0.3);
            border-left: 1px solid rgba(191, 213, 255, 0.05);
            transform: translateX(100%); opacity: 0; visibility: hidden;
            transition: transform 0.3s cubic-bezier(0.2,0,0,1), opacity 0.3s, visibility 0.3s;
        }
        #drawer.open { transform: translateX(0); opacity: 1; visibility: visible; }

        #drawer-handle { display: none; }

        @media (max-width: 768px) {
            #top-bar { padding: 12px 16px; }
            #btn-menu { display: none; } 

            #drawer-handle {
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                height: 48px; flex-shrink: 0; cursor: grab;
                background: var(--md-sys-color-surface-container-low);
                border-bottom: 1px solid rgba(255,255,255,0.05);
                border-top-left-radius: var(--shape-l);
                border-top-right-radius: var(--shape-l);
            }
            #drawer-handle:active { cursor: grabbing; }
            .handle-pill { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); margin-bottom: 6px; }
            .handle-lbl { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.8); letter-spacing: 0.5px; text-transform: uppercase;}
            
            #drawer {
                top: auto; bottom: 0; left: 0; right: 0;
                width: 100%; max-width: none; height: 65vh;
                border-radius: var(--shape-l) var(--shape-l) 0 0;
                border-left: none; border-top: 1px solid rgba(191, 213, 255, 0.05);
                box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
                transform: translateY(calc(100% - 48px)); 
                opacity: 1; visibility: visible; 
            }
            #drawer.open { transform: translateY(0); }
        }
        
        .unified-toolbar { 
            display: flex; align-items: center; padding: 12px 16px; gap: 8px; 
            background: var(--md-sys-color-surface-container); 
            border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
        }
        .toolbar-btn {
            flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: var(--shape-s); border: 1px solid var(--md-sys-color-outline-variant); 
            background: transparent; color: var(--md-sys-color-on-surface-variant); 
            cursor: pointer; transition: 0.2s; box-sizing: border-box; position: relative;
        }
        .toolbar-btn .material-symbols-rounded { font-size: 22px; }
        .toolbar-btn:hover { background: var(--md-state-hover); color: var(--md-sys-color-on-surface); }
        .toolbar-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-color: var(--md-sys-color-primary); }
        
        .toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 4px; }
        
        .toolbar-btn.action-btn.export { color: var(--md-sys-color-primary); }
        .toolbar-btn.action-btn.export:hover { background: rgba(118,255,51,0.08); }
        .toolbar-btn.action-btn.clear { color: var(--tanki-salmon); }
        .toolbar-btn.action-btn.clear:hover { background: rgba(255,102,102,0.08); }

        .drawer-content { flex: 1; overflow-y: auto; padding: 16px 16px 20px; display: none; }
        .drawer-content.active { display: block; }

        .m3-card { 
            background: transparent; border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--shape-m); padding: 16px; margin-bottom: 16px; transition: 0.2s;
        }
        .m3-card:hover { border-color: var(--md-sys-color-outline); }

        .card-title { font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 12px; display:flex; align-items:center; gap:8px; opacity: 0.9;}

        .control-col { display: flex; flex-direction: column; gap: 8px; }
        .icon-grid-wrapper { display: flex; flex-direction: column; gap: 6px; position: relative; margin-bottom: 8px; }
        .icon-grid-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
        .icon-grid-label { font-size: 11px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); letter-spacing: 0.5px; text-transform: uppercase; }
        .selection-text { font-size: 13px; font-weight: 600; text-transform: capitalize; }
        .icon-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .icon-grid-btn {
            width: 48px; height: 48px; background: var(--md-sys-color-surface-container-highest);
            border: 2px solid transparent; border-radius: var(--shape-s);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s cubic-bezier(0.2,0,0,1); color: var(--md-sys-color-on-surface-variant); 
            padding: 8px; box-sizing: border-box; user-select: none;
        }
        .icon-grid-btn:hover { background: var(--md-state-hover); transform: translateY(-2px); }
        .icon-grid-btn.selected { border-color: var(--md-sys-color-primary); background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
        .icon-grid-btn svg, .icon-grid-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .icon-grid-btn svg { fill: currentColor; }
        .icon-grid-btn.text-btn { width: auto; min-width: 48px; padding: 0 16px; font-size: 13px; font-weight: 500; }

        #box-hull .icon-grid-label, #box-hull-skin .icon-grid-label, #box-hull .selection-text, #box-hull-skin .selection-text { color: var(--hull); }
        #box-hull .icon-grid-btn.selected, #box-hull-skin .icon-grid-btn.selected { border-color: var(--hull); background: rgba(118, 255, 51, 0.15); color: var(--hull); }
        #box-turret .icon-grid-label, #box-turret-skin .icon-grid-label, #box-turret .selection-text, #box-turret-skin .selection-text { color: var(--turret); }
        #box-turret .icon-grid-btn.selected, #box-turret-skin .icon-grid-btn.selected { border-color: var(--turret); background: rgba(118, 255, 51, 0.15); color: var(--turret); }
        #box-scene .icon-grid-label, #box-scene .selection-text { color: var(--scene); }
        #box-scene .icon-grid-btn.selected { border-color: var(--scene); background: rgba(255, 128, 0, 0.15); color: var(--scene); }
        #box-grenade .icon-grid-label, #box-grenade .selection-text { color: var(--grenade); }
        #box-grenade .icon-grid-btn.selected { border-color: var(--grenade); background: rgba(213, 128, 255, 0.15); color: var(--grenade); }
        #box-drone .icon-grid-label, #box-drone .selection-text, #box-drone-skin .icon-grid-label, #box-drone-skin .selection-text { color: var(--drone); }
        #box-drone .icon-grid-btn.selected, #box-drone-skin .icon-grid-btn.selected { border-color: var(--drone); background: rgba(0, 212, 255, 0.15); color: var(--drone); }
        #box-supply .icon-grid-label, #box-supply .selection-text, #box-supply-skin .icon-grid-label, #box-supply-skin .selection-text { color: var(--supply); }
        #box-supply .icon-grid-btn.selected, #box-supply-skin .icon-grid-btn.selected { border-color: var(--supply); background: rgba(191, 213, 255, 0.15); color: var(--supply); }

.icon-grid-wrapper.loading::after { 
    content: ''; 
    position: absolute; 
    inset: -4px; 
    background: rgba(0, 25, 38, 0.75); 
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: var(--shape-s); 
    z-index: 10; 
}

.icon-grid-wrapper.loading::before { 
    content: ''; 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    width: 28px; 
    height: 28px; 
    margin-top: -14px;
    margin-left: -14px;
    border-radius: 50%; 
    background: conic-gradient(from 0deg, transparent 30%, var(--md-sys-color-primary));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), red calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), red calc(100% - 3px));
    animation: spin 0.8s linear infinite; 
    z-index: 11; 
}

@keyframes spin { 
    to { transform: rotate(360deg); } 
}
        .native-select-hidden { display: none; }

        .anim-chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
        .tex-chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
        .tex-chip { font-family: inherit; font-size: 12px; font-weight:500; letter-spacing:0.2px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline-variant); background: transparent; color: var(--md-sys-color-on-surface-variant); display:inline-flex; align-items:center; gap:6px; text-transform: none; max-width: 100%; }
        .tex-chip .chip-dot { width:6px; height:6px; border-radius:50%; background: currentColor; opacity:0.6; flex-shrink: 0; }
        .tex-chip .chip-text, .anim-chip .chip-text { text-transform: none; }
        .tex-chip .chip-text { overflow-wrap: anywhere; line-height: 1.35; }
        .anim-chip { position: relative; font-family: inherit; font-size: 12px; font-weight:500; letter-spacing:0.2px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline-variant); background: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer; transition: 0.15s; display:inline-flex; align-items:center; gap:6px; user-select: none; touch-action: manipulation; text-transform: none; }
        .anim-chip .chip-bar { position: absolute; inset: -3px; border-radius: 11px; padding: 3px; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0; z-index: 2; }
        .anim-chip.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-color: var(--md-sys-color-primary-container); }
        .anim-chip.active .chip-bar { opacity: 1; background: conic-gradient(var(--md-sys-color-primary) var(--p, 0%), transparent 0); }
        .anim-chip.looping .chip-bar { background: conic-gradient(from var(--ang, 0deg), transparent 0deg, var(--md-sys-color-primary) 45deg, transparent 55deg); }
        .anim-chip.looping::after { content: "∞"; position: absolute; top:2px; right:6px; font-size: 9px; opacity: 0.7; z-index: 1; }
        .anim-chip .chip-dot { width:6px; height:6px; border-radius:50%; background: currentColor; opacity:0.6; position: relative; z-index:1; }
        .anim-chip .chip-text { position: relative; z-index:1; }
        .anim-chip .info-btn { 
    position: relative; z-index: 3; font-family: 'Material Symbols Rounded', sans-serif;
    font-size: 16px; margin-left: 4px; opacity: 0.6; transition: 0.2s; 
    display: flex; align-items: center; justify-content: center;
}
.anim-chip .info-btn:hover { opacity: 1; color: var(--md-sys-color-primary); transform: scale(1.2); }

        .env-toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; user-select: none; margin-bottom:8px; }
.env-label { font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-surface); }
.env-switch { width: 52px; height: 32px; background: var(--md-sys-color-surface-container-highest); border: 2px solid var(--md-sys-color-outline-variant); border-radius: 100px; position: relative; transition: 0.2s; box-sizing: border-box; }
.env-switch::after { content: ''; position: absolute; top: 50%; left: 6px; transform: translateY(-50%); width: 16px; height: 16px; background: var(--md-sys-color-outline); border-radius: 50%; transition: 0.2s cubic-bezier(0.2, 0, 0, 1.3); }
/* All four category switches share the same brand green */
.env-toggle.active .env-switch { background: #76FF33; border-color: #76FF33; }
.env-toggle.active .env-switch::after { background: var(--md-sys-color-on-primary); width: 24px; height: 24px; left: calc(100% - 28px); }
.env-switch.active { background: #76FF33; border-color: #76FF33; }
.env-switch.active::after { background: var(--md-sys-color-on-primary); width: 24px; height: 24px; left: calc(100% - 28px); }
.card-switch { margin-left: auto; cursor: pointer; flex-shrink: 0; }
        
        #group-scene { display: none; margin-top: 10px; border-style:dashed; }
        #group-scene.visible { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

        .btn-text { background: transparent; border: none; height: 36px; padding: 0 16px; border-radius: 18px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .btn-text.error { color: var(--tanki-salmon); margin-top: 4px; width: 100%; border: 1px solid var(--md-sys-color-outline-variant); }
        .btn-text.error:hover { background: rgba(255, 102, 102, 0.08); border-color: var(--tanki-salmon); }

        .file-list { border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--shape-s); overflow: hidden; margin-top:10px; }
        .file-item { padding: 12px; border-bottom: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface-container); font-size: 13px; display:flex; gap:12px; align-items:center; }
        .file-item .material-symbols-rounded { font-size: 20px; color: var(--md-sys-color-outline-variant); }
        
        .btn-add-file { position: relative; width: 100%; padding: 12px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--shape-s); color: var(--md-sys-color-outline); text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; transition: 0.2s; box-sizing: border-box; }
        .btn-add-file:hover { background: var(--md-state-hover); border-color: var(--md-sys-color-on-surface); color: var(--md-sys-color-on-surface); }
        .btn-add-file .material-symbols-rounded { margin-right: 8px; font-size: 20px; }
        .btn-add-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-surface-container-highest); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline-variant); }

        #dialog-scrim {
            position: fixed; inset: 0; background: rgba(0, 25, 38, 0.8);
            opacity: 0; pointer-events: none; z-index: 400; transition: 0.3s ease;
        }
        #dialog-scrim.show { opacity: 1; pointer-events: auto; }
        
        .m3-dialog {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
            width: 320px; max-width: 90vw; background: var(--md-sys-color-surface-container-highest);
            border-radius: var(--shape-l); padding: 24px; z-index: 410;
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.2,0,0,1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;
        }
        .m3-dialog.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

const partTooltipEl = document.getElementById('part-tooltip');

const partRaycaster = new THREE.Raycaster();

function cleanPartName(name) {
    if (!name) return '';
    const parts = name.split('_').filter(Boolean);
    const deduped = [];
    for (const part of parts) {
        if (part !== deduped[deduped.length - 1]) deduped.push(part);
    }
    return deduped.join('_') || name;
}

function getPartName(object) {
    let cur = object;
    while (cur) {
        let raw;
        if (cur.isMesh && cur.userData?.originalName) {
            // A3D meshes store "geoName_nodeName" in originalName.
            // The semantic part name is the node/bone name (parent), not the geometry name.
            raw = cur.parent?.name || cur.userData.originalName;
        } else {
            raw = cur.name;
        }
        const name = cleanPartName(raw);
        if (name) return name;
        cur = cur.parent;
    }
    return null;
}

function pickPart(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((clientY - rect.top) / rect.height) * 2 + 1;
    partRaycaster.setFromCamera(new THREE.Vector2(x, y), camera);
    const intersects = partRaycaster.intersectObjects(scene.children, true);
    for (const hit of intersects) {
        const obj = hit.object;
        if (!isEffectivelyVisible(obj)) continue; // skip meshes inside hidden groups too
        const name = getPartName(obj);
        if (!name) continue;
        if (obj.isSkinnedMesh) {
            const boneName = pickBoneByInfluence(obj, hit);
            if (boneName) return { name: boneName, point: hit.point, object: obj, clientX, clientY };
        }
        return { name, point: hit.point, object: obj, clientX, clientY };
    }
    return null;
}

// Pick the bone that most influences the hit triangle's vertices.
// This gives the actual skinned "part" under the cursor rather than the nearest bone position.
function pickBoneByInfluence(skinnedMesh, hit) {
    if (!skinnedMesh.isSkinnedMesh || !skinnedMesh.skeleton || !hit.face) return null;
    const idxAttr = skinnedMesh.geometry.attributes.skinIndex;
    const wAttr = skinnedMesh.geometry.attributes.skinWeight;
    if (!idxAttr || !wAttr) return null;
    const idxArr = idxAttr.array;
    const wArr = wAttr.array;
    const verts = [hit.face.a, hit.face.b, hit.face.c];
    const scores = new Map();
    for (const vi of verts) {
        for (let j = 0; j < 4; j++) {
            const bi = idxArr[vi * 4 + j];
            const w = wArr[vi * 4 + j];
            scores.set(bi, (scores.get(bi) || 0) + w);
        }
    }
    let bestBi = -1, bestW = -1;
    for (const [bi, w] of scores) {
        if (w > bestW) { bestW = w; bestBi = bi; }
    }
    const bone = skinnedMesh.skeleton.bones[bestBi];
    return bone && bone.name ? cleanPartName(bone.name) : null;
}

function collectTextureNames(grp) {
    const names = new Set();
    function addName(raw) {
        if (!raw) return;
        // Strip extension only; keep original casing from the model file
        // (grenade mats may carry the artist's Windows source path — shown as-is).
        const base = String(raw).replace(/\.[^.]+$/, '');
        if (base) names.add(base);
    }
    // Only model-authored refs — never CDN / loaded file names (map.name, sceneLib.tex).
    // A3D: group.userData.textureNames + mat.userData.texName
    // 3DS garage: mesh.userData.textureNames from parse3dsTextureBindings (mat → map filename)
    if (grp?.userData?.textureNames) grp.userData.textureNames.forEach(addName);
    // Grenade clones are parented into the turret subtree (fmnt) — their
    // materials belong to the grenade card, not the turret's chip list.
    grp?.traverse(o => {
        if (isUnderGrenade(o)) return;
        if (Array.isArray(o.userData?.textureNames)) o.userData.textureNames.forEach(addName);
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
            if (m?.userData?.texName) addName(m.userData.texName);
        });
    });
    return Array.from(names);
}

function renderTextureNames() {

function toggleAttachmentMarker(type, info) {
    if (!slots[type]) return;
    const grp = slots[type].group;
    if (!grp.userData.attachmentMarkers) grp.userData.attachmentMarkers = new Map();
    const markers = grp.userData.attachmentMarkers;
    if (markers.has(info.name)) {
        const m = markers.get(info.name);
        unregisterAttachmentMarker(m);
        m.parent.remove(m);
        if (m.geometry) m.geometry.dispose();
        if (m.material) {
            if (Array.isArray(m.material)) m.material.forEach(mat => mat.dispose());
            else m.material.dispose();
        }
        m.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
                if (Array.isArray(child.material)) child.material.forEach(mat => mat.dispose());
                else child.material.dispose();
            }
        });
        markers.delete(info.name);
        if (info.btn) info.btn.classList.remove('active');
        return;
    }
    const worldPos = new THREE.Vector3();
    info.node.getWorldPosition(worldPos);
    const localPos = grp.worldToLocal(worldPos.clone());

    // 3D marker: fixed world size beyond threshold, shrinks when camera gets closer than threshold
    if (!grp.userData.attachmentThreshold) {
        const box = new THREE.Box3().setFromObject(grp);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 1);
        grp.userData.attachmentBaseRadius = Math.max(1.5, maxDim * 0.018);
        grp.userData.attachmentThreshold = maxDim * 0.5;
    }
    const radius = grp.userData.attachmentBaseRadius;
    const marker = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 24, 24),
        new THREE.MeshStandardMaterial({
            color: 0x76FF33,
            emissive: 0x76FF33,
            emissiveIntensity: 0.6,
            transparent: true,
            opacity: 0.8,
            roughness: 0.2,
            metalness: 0.1,
            side: THREE.DoubleSide
        })
    );
    marker.name = info.name;
    marker.userData.isAttachmentMarker = true;
    marker.userData.markerName = info.name;
    marker.position.copy(localPos);

    grp.add(marker);
    markers.set(info.name, marker);
    registerAttachmentMarker(marker);
    // Respect an active turret-off switch for markers created while hidden
    // (grenade clones are exempt in applyTypeVisibility; markers are not).
    if (type === 'turret' && visState.turret === false) { marker.userData.origVisible = true; marker.visible = false; }
    if (info.btn) info.btn.classList.add('active');
    projectNodeTooltip(info.node, info.name);
}

function renderAttachmentPoints() {
    ensureAttachUI();
    for (const type of ['hull', 'turret']) {
        const wrap = document.getElementById(`attach-${type}`);
        if (!wrap) continue;
        const row = wrap.querySelector('.anim-chip-row');
        row.innerHTML = '';
        const slot = slots[type];
        const empties = slot?.group?.userData?.emptyNodes || [];
        if (empties.length === 0) { wrap.style.display = 'none'; continue; }
        for (const info of empties) {
            const btn = document.createElement('button');
            btn.className = 'anim-chip';
            btn.type = 'button';
            btn.innerHTML = `<span class="chip-dot"></span><span class="chip-text">${info.name}</span>`;
            info.btn = btn;
            const active = slot?.group?.userData?.attachmentMarkers?.has(info.name);
            if (active) btn.classList.add('active');

            // Add consistent pressing effects
            btn.addEventListener('pointerdown', () => btn.classList.add('pressing'));
            btn.addEventListener('pointerup', () => btn.classList.remove('pressing'));
            btn.addEventListener('pointerleave', () => btn.classList.remove('pressing'));
            btn.addEventListener('pointercancel', () => btn.classList.remove('pressing'));

            btn.onclick = () => toggleAttachmentMarker(type, info);

// Unified pointer handling for tooltip
function isOnCanvas(e) { return e.target === canvasEl; }

canvasEl.addEventListener('pointerdown', (e) => {
    if (!isOnCanvas(e)) return;
    // Track quick taps for attachment markers
    tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
    tapDidMove = false;
    suppressNextClick = false;

    const markerHit = pickAttachmentMarker(e.clientX, e.clientY);
    tapHit = markerHit || pickPart(e.clientX, e.clientY);

    if (e.pointerType === 'mouse') {
        if (e.button !== 2) { hidePartTooltip(); return; }
        tooltipStartPos = { x: e.clientX, y: e.clientY };
        tooltipHit = pickPart(e.clientX, e.clientY);
    } else if (e.pointerType === 'touch') {
        lpStart = { x: e.clientX, y: e.clientY };
        if (lpTimer) clearTimeout(lpTimer);
        lpTimer = setTimeout(() => {
            const hit = pickPart(lpStart.x, lpStart.y);
            if (hit) {
                showPartTooltip(hit.name, lpStart.x, lpStart.y, hit.object);
            }
            lpTimer = null;
        }, TT_LONG_PRESS_MS);
    }
});

canvasEl.addEventListener('pointermove', (e) => {
    if (!isOnCanvas(e)) return;
    if (tapStart && !tapDidMove) {
        const dx = e.clientX - tapStart.x, dy = e.clientY - tapStart.y;
        if (Math.hypot(dx, dy) > TAP_MAX_DIST) tapDidMove = true;
    }
    if (tooltipStartPos) {
        const dx = e.clientX - tooltipStartPos.x, dy = e.clientY - tooltipStartPos.y;
        if (Math.hypot(dx, dy) > TT_MOVE_THRESHOLD) { tooltipStartPos = null; tooltipHit = null; }
    }
    if (lpStart && lpTimer) {
        const dx = e.clientX - lpStart.x, dy = e.clientY - lpStart.y;
        if (Math.hypot(dx, dy) > TT_MOVE_THRESHOLD) {
            clearTimeout(lpTimer); lpTimer = null; lpStart = null;
        }
    }
});

canvasEl.addEventListener('pointerup', (e) => {
    if (!isOnCanvas(e)) return;
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    lpStart = null;
    suppressNextContextMenu = false;

    if (tapStart) {
        const dt = performance.now() - tapStart.t;
        const markerHit = pickAttachmentMarker(e.clientX, e.clientY);
        if (dt < TAP_MAX_MS && markerHit) {
            suppressNextContextMenu = true;
            suppressNextClick = true;
            showPartTooltip(markerHit.name, e.clientX, e.clientY, markerHit.object);
        }
    }
    tapStart = null; tapHit = null; tapDidMove = false;
});

canvasEl.addEventListener('pointercancel', () => {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    lpStart = null;
    tapStart = null; tapHit = null; tapDidMove = false;
});

canvasEl.addEventListener('click', (e) => {
    if (!isOnCanvas(e)) return;
    if (suppressNextClick) {
        suppressNextClick = false;
        e.stopPropagation();
    }
});

canvasEl.addEventListener('contextmenu', (e) => {
    if (!isOnCanvas(e)) return;
    e.preventDefault();
    if (suppressNextContextMenu) {
        suppressNextContextMenu = false;
        return;
    }
    if (tooltipHit) {
        showPartTooltip(tooltipHit.name, tooltipStartPos.x, tooltipStartPos.y, tooltipHit.object);
        tooltipHit = null; tooltipStartPos = null;
    }
});

function isAttachmentMarker(object) {

    return false;

            }

        });

        let longPressTimer = null; let longPressed = false;

    let globalPointerDownX = 0;

    });

    document.addEventListener('click', (e) => {
        if (drawerOpen) {
            const dx = e.clientX - globalPointerDownX;
            const dy = e.clientY - globalPointerDownY;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                return;
            }

            if (!e.target.closest('#drawer') && 
                !e.target.closest('#top-bar') && 
                !e.target.closest('#dialog-scrim') &&

        swipeStartY = e.touches[0].clientY;

        if (!swipeStartY || window.innerWidth > 768) return;

        if (drawerOpen && dy > 0) {

            drawerEl.style.transform = `translateY(calc(100% - 48px + ${dy}px))`;

    // Off-DOM image cache for the card thumbnails, so switching frames never

        if (rec) return rec;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        rec = { img, ready: false };
        img.onload = () => { rec.ready = true; renderPaintCurrentFrame(true); };

    // sliver changes every frame the border appears to shimmer/jitter.
    function renderPaintCurrent() {
        const info = currentPaintName ? PAINTS_CATALOG[currentPaintName] : null;

    // Blit the current sprite-sheet cell of the active animated paint into each
    // card canvas. `force` redraws even if the frame index has not advanced.
    let lastThumbFrame = -1;
    function renderPaintCurrentFrame(force){
        const info = currentPaintName ? PAINTS_CATALOG[currentPaintName] : null;
        if (!info || !info.isAnimated || !info.frame) return;
        const f = info.frame;
        const cols = Math.max(1, Math.floor(f.imageWidth / f.frameWidth));
        const rows = Math.max(1, Math.floor(f.imageHeight / f.frameHeight));
        const totalFrames = f.numFrames || (cols * rows);
        const fps = f.fps || 15;
        const frameIdx = Math.floor(performance.now() / (1000 / fps)) % totalFrames;
        if (!force && frameIdx === lastThumbFrame) return;
        lastThumbFrame = frameIdx;
        const rec = getPaintThumbImage(`${RES_BASE}/${info.path}/${getPaintFileName(info)}`);
        if (!rec.ready) return;
        const sx = (frameIdx % cols) * f.frameWidth;
        const sy = Math.floor(frameIdx / cols) * f.frameHeight;
        document.querySelectorAll('.paint-current:not(.empty) .paint-preview-thumb canvas').forEach(cv => {
            const ctx = cv.getContext('2d');
            if (!ctx) return;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.clearRect(0, 0, cv.width, cv.height);
            // Draw exactly one cell — no neighbouring pixels can bleed in.
            ctx.drawImage(rec.img, sx, sy, f.frameWidth, f.frameHeight, 0, 0, cv.width, cv.height);
        });
    }

    // ---- Per-category visibility switches (hull / turret / grenade) ----
    // Same style as the environment toggle, but hiding only affects the model —
    // the picker options always stay visible, and the switch state survives
    // model/skin reloads.  Grenades mount *inside* the turret's node tree, and
    // three.js inherits `visible` from ancestors — so the turret switch hides
    // turret meshes one by one (preserving authored hidden collision boxes via
    // origVisible) and never touches grenade clones, which obey their own
    // switch independently of whether the turret is shown.
    function isEffectivelyVisible(o) {
        let p = o;
        while (p) { if (p.visible === false) return false; p = p.parent; }
        return true;
    }
    function isUnderGrenade(o) {
        let p = o;
        while (p) { if (p.userData && p.userData.isGrenadeClone) return true; p = p.parent; }
        return false;
    }
    function applyTypeVisibility(type) {
        if (type === 'grenade') {

            slots.turret.group.traverse(o => { if (o.userData && o.userData.isGrenadeClone) o.visible = visState.grenade; });
            return;
        }
        const slot = slots[type];
        if (!slot || !slot.group) return;
        if (type === 'turret') {
            slot.group.traverse(o => {
                if (isUnderGrenade(o) || !o.isMesh) return;
                if (o.userData.origVisible === undefined) o.userData.origVisible = o.visible;
                o.visible = visState.turret ? o.userData.origVisible : false;

            return;

    // ---- ResourceURL path generator (ID + Version -> 5-level octal path) ----
    // assets.json no longer stores raw path strings; each leaf is now
    // { id, version, [file] }. The actual CDN path is derived on demand
    // using the same bit-splitting scheme as the ID/Path Toolkit
    // (resource-path-generator.html), so IDs/versions stay authoritative
    // and paths are just a computed encoding of them.
    function getHighInt32(longValBigInt) { return Number(longValBigInt >> 32n); }
    function getLowInt32(longValBigInt) { return Number(longValBigInt & 0xFFFFFFFFn); }

    function toResourcePath(entry) {
        if (!entry) return null;
        // Backward-compat: tolerate a raw path string if it ever appears.
        if (typeof entry === 'string') return entry;
        const idBigInt = BigInt(entry.id);
        const versionBigInt = BigInt(entry.version);
        const highId = getHighInt32(idBigInt);
        const lowId = getLowInt32(idBigInt);
        const base = [
            highId.toString(8),
            ((lowId >>> 16) & 0xFFFF).toString(8),
            ((lowId >>> 8) & 0xFF).toString(8),
            (lowId & 0xFF).toString(8),
            versionBigInt.toString(8)
        ].join("/");
        return entry.file ? `${base}/${entry.file}` : base;
    }

    // A leaf asset entry now looks like { id, version, [file] }.
    function isLeafEntry(entry) {

    }
