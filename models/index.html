    /* ====================================================================== *
     *  PAINT BAKING FOR EXPORT
     *
     *  The camouflage only exists inside an onBeforeCompile patch: the colour
     *  you see is computed live from (lightmap x paint) with per-mesh UV
     *  tiling and mirrored-island correction. GLTFExporter writes standard
     *  glTF materials, so all of that would be silently dropped and the GLB
     *  would come out plain.
     *
     *  So before exporting we re-run the exact same blend off-screen, once
     *  per painted mesh, rasterised in UV space: render a full-screen quad
     *  whose vertex positions ARE the mesh's UVs, sample the lightmap and the
     *  paint with the mesh's own density/mirror flags, and read the result
     *  back into a plain texture. That texture replaces `map` on a clean
     *  MeshStandardMaterial, so any 3D app shows what the browser showed.
     *
     *  Animated paints (GIF / APNG / video) bake whichever frame is on screen
     *  at the moment you hit export — glTF has no animated-texture concept.
     * ====================================================================== */

    // Rasterise UV space: gl_Position comes straight from the uv attribute,
    // so every texel of the output IS that mesh's texture space.
    const BAKE_VS = `
        attribute vec2 uv;
        attribute vec3 position;
        attribute float mirrorFlag;
        varying vec2 vUv;
        varying float vMirror;
        void main(){
            vUv = uv;
            vMirror = mirrorFlag;
            // uv (0..1) -> clip space (-1..1)
            gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
        }`;

    // Same maths as the live shader's customMapFragment, minus the lighting
    // (the exported material keeps its own roughness/metalness response).
    const BAKE_FS = `
        precision highp float;
        uniform sampler2D map;
        uniform sampler2D paintMap;
        uniform vec2 paintUvScale;
        uniform vec2 paintFrameOffset;
        uniform vec2 paintFrameScale;
        uniform float paintUseFrameTransform;
        uniform vec2 paintTexelSize;
        uniform float hasMap;
        varying vec2 vUv;
        varying float vMirror;
        void main(){
            vec4 lightTex = hasMap > 0.5 ? texture2D(map, vUv) : vec4(1.0);
            vec3 baseLightColor = lightTex.rgb;

            vec2 camoBaseUv = vUv;
            if(vMirror > 0.5) camoBaseUv.x = 1.0 - camoBaseUv.x;
            vec2 tiledPaintUv = camoBaseUv * paintUvScale;
            vec2 paintUv = tiledPaintUv;
            if(paintUseFrameTransform > 0.5){
                vec2 safeTiledUv = mix(paintTexelSize, vec2(1.0) - paintTexelSize, fract(tiledPaintUv / paintFrameScale));
                paintUv = safeTiledUv * paintFrameScale + paintFrameOffset;
            } else {
                paintUv = fract(tiledPaintUv);
            }

            vec4 paintTex = texture2D(paintMap, paintUv);
            vec3 paintColor = paintTex.rgb * 3.0;
            float scuffingFactor = step(0.5, lightTex.r);
            vec3 colorWithoutScuffing = 2.0 * paintColor * baseLightColor;
            vec3 colorWithScuffing = 1.0 - 2.0 * (1.0 - baseLightColor) * (1.0 - paintColor);
            vec3 blendedColor = mix(colorWithoutScuffing, colorWithScuffing, scuffingFactor);
            float detailsAlpha = lightTex.a;
            vec3 finalColor = mix(blendedColor, baseLightColor, detailsAlpha);
            gl_FragColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);
        }`;

    // Pick a bake resolution that respects the source lightmap: no point
    // baking a 256px part at 2K, and no point clipping a 2K part to 512.
    function chooseBakeSize(mat){
        const img = mat.map && mat.map.image;
        let s = 1024;
        if(img && img.width) s = Math.max(img.width, img.height);
        s = Math.pow(2, Math.round(Math.log2(THREE.MathUtils.clamp(s, 256, 2048))));
        const maxS = renderer.capabilities.maxTextureSize || 2048;
        return Math.min(s, maxS);
    }

    // Bake one painted material into a flat colour texture.
    function bakePaintedMaterial(mesh, mat, bakeScene, bakeCam){
        const pe = mat.userData.paintEntry;
        if(!pe || !pe.texture) return null;
        const size = chooseBakeSize(mat);

        const target = new THREE.WebGLRenderTarget(size, size, {
            minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
            colorSpace: THREE.SRGBColorSpace, depthBuffer: false, stencilBuffer: false
        });

        const density = mat.userData.paintDensity || 1;
        const aspect  = mat.userData.paintAspect  || 1;
        const frame   = pe.frame;
        const isAnim  = !!pe.isAnimated && !!frame;

        // Reuse the *live* uniforms for animated sheets so the exported frame
        // is exactly the one currently on screen.
        const liveShader = mat.userData.shader;
        const offset = (isAnim && liveShader?.uniforms?.paintFrameOffset)
            ? liveShader.uniforms.paintFrameOffset.value.clone()
            : new THREE.Vector2(0, 0);

        const geom = new THREE.BufferGeometry();
        const g = mesh.geometry;
        geom.setAttribute('position', g.attributes.position);
        geom.setAttribute('uv', g.attributes.uv);
        geom.setAttribute('mirrorFlag', g.attributes.mirrorFlag
            || new THREE.BufferAttribute(new Float32Array(g.attributes.position.count), 1));
        if(g.index) geom.setIndex(g.index);

        const bakeMat = new THREE.RawShaderMaterial({
            vertexShader: BAKE_VS,
            fragmentShader: BAKE_FS,
            uniforms: {
                map: { value: mat.map || null },
                hasMap: { value: mat.map ? 1.0 : 0.0 },
                paintMap: { value: pe.texture },
                paintUvScale: { value: new THREE.Vector2(density, density * aspect) },
                paintFrameOffset: { value: offset },
                paintFrameScale: { value: isAnim
                    ? new THREE.Vector2(frame.frameWidth / frame.imageWidth, frame.frameHeight / frame.imageHeight)
                    : new THREE.Vector2(1, 1) },
                paintUseFrameTransform: { value: isAnim ? 1.0 : 0.0 },
                paintTexelSize: { value: isAnim
                    ? new THREE.Vector2(2.0 / frame.imageWidth, 2.0 / frame.imageHeight)
                    : new THREE.Vector2(0.5 / 256, 0.5 / 256) }
            },
            side: THREE.DoubleSide, depthTest: false, depthWrite: false
        });

        const quad = new THREE.Mesh(geom, bakeMat);
        quad.frustumCulled = false;
        bakeScene.add(quad);

        const prevTarget = renderer.getRenderTarget();
        renderer.setRenderTarget(target);
        renderer.setClearColor(0x000000, 0);
        renderer.clear(true, false, false);
        renderer.render(bakeScene, bakeCam);
        renderer.setRenderTarget(prevTarget);

        bakeScene.remove(quad);
        bakeMat.dispose();
        geom.dispose();

        // Pull the pixels back so the result is a normal image the exporter
        // can embed (a render target alone would not be serialised).
        const buf = new Uint8Array(size * size * 4);
        renderer.readRenderTargetPixels(target, 0, 0, size, size, buf);
        target.dispose();

        const cv = document.createElement('canvas');
        cv.width = size; cv.height = size;
        const ctx = cv.getContext('2d');
        const imgData = ctx.createImageData(size, size);
        // WebGL returns bottom-up rows; flip so the canvas reads top-down.
        const rowBytes = size * 4;
        for(let y = 0; y < size; y++){
            const src = (size - 1 - y) * rowBytes;
            imgData.data.set(buf.subarray(src, src + rowBytes), y * rowBytes);
        }
        ctx.putImageData(imgData, 0, 0);

        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.flipY = true;
        tex.name = (mat.name || mesh.name || 'part') + '_paint_baked';
        tex.needsUpdate = true;
        return tex;
    }

    // Swap every painted material for a plain one carrying the baked texture,
    // returning an undo list so the live scene is restored afterwards.
    function bakePaintForExport(root){
        const restore = [];
        if(!visState.paint || !currentPaintEntry) return restore;

        const bakeScene = new THREE.Scene();
        const bakeCam = new THREE.Camera();   // positions are already clip-space
        let baked = 0, failed = 0;

        root.traverse(o => {
            if(!o.isMesh || !o.geometry) return;
            if(!o.geometry.attributes.uv) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            if(!mats.some(m => m && m.userData && m.userData.isPaintMat)) return;

            const newMats = mats.map(m => {
                if(!m || !m.userData || !m.userData.isPaintMat) return m;
                let tex = null;
                try{ tex = bakePaintedMaterial(o, m, bakeScene, bakeCam); }
                catch(e){ console.error('[bake]', e); }
                if(!tex){ failed++; return m; }
                baked++;
                // A clean standard material: no custom shader, no emissive
                // double-up — just the baked colour plus the original surface
                // response so it reads correctly in Blender / viewers.
                const out = new THREE.MeshStandardMaterial({
                    map: tex,
                    color: 0xffffff,
                    roughness: (m.roughness !== undefined ? m.roughness : 0.85),
                    metalness: (m.metalness !== undefined ? m.metalness : 0.0),
                    side: m.side,
                    transparent: m.transparent,
                    alphaTest: m.alphaTest,
                    name: (m.name || 'paint') + '_baked'
                });
                out.userData.bakedTexture = tex;
                return out;
            });

            restore.push({ mesh: o, material: o.material });
            o.material = Array.isArray(o.material) ? newMats : newMats[0];
        });

        if(baked) console.log(`[export] baked ${baked} painted material(s)${failed ? `, ${failed} failed` : ''}`);
        restore._baked = baked;
        return restore;
    }

    function restoreAfterBake(restore){
        for(const r of restore){
            const cur = Array.isArray(r.mesh.material) ? r.mesh.material : [r.mesh.material];
            cur.forEach(m => {
                if(m && m.userData && m.userData.bakedTexture){
                    try{ m.userData.bakedTexture.dispose(); }catch(e){}
                    try{ m.dispose(); }catch(e){}
                }
            });
            r.mesh.material = r.material;
        }
    }
    window.bakePaintForExport = bakePaintForExport;
    window.restoreAfterBake = restoreAfterBake;

    document.getElementById('btn-export').onclick = () => {

        showDialog(T.exportTitle, willBake ? T.exportDescPaint : T.exportDesc, false, T.btnConfirm, () => {
            // 1. Before export: traverse and temporarily hide all attachment markers
            const markers = [];
            root.traverse(o => {

                    markers.push(o);

            });

            // 1b. Bake the live camouflage into ordinary textures, otherwise
            // the custom paint shader is lost and the GLB exports unpainted.
            // Deferred one frame so the toast can actually paint first.
            if (willBake) msg(T.exportBaking);
            const runExport = () => {

                }

                    markers.forEach(m => m.visible = true);

                const exporter = new GLTFExporter();
                exporter.parse(root, (result) => {
                    // 2. On success: restore the live scene
                    cleanup();

                    console.error(err);

    function runSceneInjector() {
        let count = 0;

        // Pre-index textures by normalized stem for O(1)-ish lookup
        // e.g. "bg1 1024.webp" → stem "bg11024"
        const texByStem = new Map();
        for (const [texName, texObj] of sceneLib.tex) {
            const stem = texStem(texName);
            if (stem) texByStem.set(stem, texObj);
        }

        const scoreMatch = (candRaw, texName) => {
            const c = texStem(candRaw);
            const t = texStem(texName);
            if (!c || !t) return 0;
            if (c === t) return 100;                         // exact stem match (best)
            if (c.includes(t) && t.length >= 2) return 50 + t.length;
            if (t.includes(c) && c.length > 3) return 40 + c.length;
            return 0;
        };

        sceneLib.meshes.forEach(mesh => {
            // Prefer explicit texRefs harvested at load time (includes 3DS map filenames)
            const candidates = [];
            if (Array.isArray(mesh.userData.texRefs)) candidates.push(...mesh.userData.texRefs);
            if (mesh.material) {
                if (Array.isArray(mesh.material)) mesh.material.forEach(m => { if (m && m.name) candidates.push(m.name); });
                else if (mesh.material.name) candidates.push(mesh.material.name);
            }
            if (mesh.name) candidates.push(mesh.name);
            if (mesh.userData.parentName) candidates.push(mesh.userData.parentName);

            let bestTex = null;
            let bestScore = 0;

            // 1) exact stem hit via index
            for (const cand of candidates) {
                const stem = texStem(cand);
                if (stem && texByStem.has(stem)) {
                    bestTex = texByStem.get(stem);
                    bestScore = 100;
                    break;
                }
            }

            // 2) fuzzy contains either way, pick highest score
            if (!bestTex) {
                for (const [texName, texObj] of sceneLib.tex) {
                    for (const cand of candidates) {
                        const s = scoreMatch(cand, texName);
                        if (s > bestScore) {
                            bestScore = s;
                            bestTex = texObj;
                        }
                    }
                }
            }

            if (bestTex) {
                const prevName = (Array.isArray(mesh.material) ? mesh.material[0] : mesh.material)?.name || '';
                mesh.material = new THREE.MeshStandardMaterial({
                    map: bestTex,
                    emissiveMap: bestTex,
                    emissive: new THREE.Color(0x888888),
                    color: 0xffffff,
                    transparent: true,

    async function loadModelFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        let grp;
        if (ext === 'a3d') { grp = parseA3D(await file.arrayBuffer(), file.name); }
        else if (ext === '3ds') { const loader = new TDSLoader(); loader.setResourcePath(''); grp = await loader.loadAsync(URL.createObjectURL(file)); grp.traverse(o => { if(o.isMesh) { o.material=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4,side:0}); o.userData.originalName=o.name; }}); }

        // Best-effort recenter for user-imported legacy files too.
        recenterModelAtPivot(grp, ['hull','Hull','turret','Turret','body']);
        return grp;
    }

    // ---- Legacy-model pivot correction ----
    // Old skins (XT / DC / PR / UT / LC, plus SP-style "multi-root" rigs) were
    // authored either with the root pivot sitting at arbitrary scene coordinates
    // (e.g. "turret" at (1634,-2511,0) or "hull" at (1124,610,-41)) OR with the
    // body mesh offset from a separate "root" helper that owns the mount point
    // (e.g. hornet SP).  Either problem makes the turret appear thousands of
    // units away from / inside the hull once mount-point snapping runs.
    //
    // Strategy: pick ONE pivot node per model and shift all root children so
    // that pivot lands at local (0,0,0).  Pivot priority (hulls):
    //   1) A node explicitly named "root"/"pivot" (SP-style rigs).
    //   2) The top-most root-level ancestor of any node whose name contains
    //      "mount" (this guarantees the mount stays at its authored offset
    //      from the pivot — the critical invariant for snapTurret).
    //   3) A node named exactly "hull" / "Hull" / "turret" / "Turret".
    //   4) A node whose name contains "hull" / "turret" / "body".
    // If nothing matches we leave the model untouched.
    function recenterModelAtPivot(grp, pivotNames) {
        if (!grp) return null;
        grp.updateMatrixWorld(true);

        // Build parent map for traversal
        const parent = new Map();
        grp.traverse(o => { o.children.forEach(c => parent.set(c, o)); });
        const isRootChild = o => o.parent === grp;
        const rootAncestor = o => {
            let cur = o;
            while (cur && cur.parent && cur.parent !== grp) cur = parent.get(cur);
            return cur && cur.parent === grp ? cur : null;
        };

        let pivot = null;
        const wanted = (pivotNames || []).map(s => s.toLowerCase());

        // 1) "root" / "pivot" node (SP rig convention)
        if (!pivot) {
            grp.traverse(o => {
                if (pivot || !o.name) return;
                const ln = o.name.toLowerCase();
                if (ln === 'root' || ln === 'pivot') pivot = o;
            });
        }

        // 2) top-most root ancestor of any "mount*" node (for hulls).  This is
        //    the most reliable signal because the mount point MUST be in the
        //    right place relative to the pivot for snapTurret to work.
        if (!pivot) {
            let mountNode = null;
            grp.traverse(o => {
                if (mountNode || !o.name) return;
                const ln = o.name.toLowerCase();
                // Only treat it as a mount helper if the name starts with
                // "mount" — not "sur_mount" or similar; but "mount03" etc. ok.
                if (ln === 'mount' || /^mount[\w\d]*$/.test(ln)) mountNode = o;
            });
            if (mountNode) pivot = rootAncestor(mountNode);
        }

        // 3) Exact name match from caller (hull/Hull/turret/Turret/body)
        if (!pivot) {
            grp.traverse(o => {
                if (pivot || !o.name) return;
                const ln = o.name.toLowerCase();
                if (wanted.some(w => ln === w)) pivot = o;
            });
        }

        // 4) Contains-name match
        if (!pivot) {
            grp.traverse(o => {
                if (pivot || !o.name) return;
                const ln = o.name.toLowerCase();
                if (wanted.some(w => ln.includes(w))) pivot = o;
            });
        }

        // 5) If there is exactly one root-level Object3D (non-Mesh) child,
        //    treat it as the pivot.  Handles unexpected rigs gracefully.
        if (!pivot) {
            const roots = grp.children.filter(c => c.isObject3D && !c.isMesh && !c.isLight && !c.isCamera);
            if (roots.length === 1) pivot = roots[0];
        }

        if (!pivot) return null;

        const pivotLocal = new THREE.Vector3();
        pivot.getWorldPosition(pivotLocal);
        pivotLocal.applyMatrix4(grp.matrixWorld.clone().invert());

        const len = pivotLocal.length();
        if (len < 0.5) return pivot;

        const shift = pivotLocal.clone().negate();
        grp.children.forEach(child => { child.position.add(shift); });
        grp.userData.recenterShift = shift.clone();
        grp.userData.pivotNodeName = pivot.name || null;

        // After shifting, skeletons may still hold stale boneInverses that
        // were computed from pre-shift world matrices (boneInverses are
        // calculated in build() BEFORE recenter runs).  Rebuild them so skinned
        // meshes don't jump to the pre-shift bind pose when animation starts.
        grp.updateMatrixWorld(true);
        grp.traverse(o => {
            if (o.isSkinnedMesh && o.skeleton) {
                o.skeleton.calculateInverses();
            }
        });

        return pivot;
    }

    // Estimate a reasonable turret mount point on a hull that has no explicit
    // "mount" helper: project to the top center of the hull's visible bounding
    // box (ignoring invisible collision Box* / bound* helpers).
    function estimateMountPoint(grp) {
        const box = new THREE.Box3();
        let hasAny = false;
        grp.traverse(o => {
            if (!o.isMesh || o.visible === false) return;
            const n = (o.name || '').toLowerCase();
            if (n.match(/box\d*|bound|col|shape/) && !n.includes('mount')) return; // skip collision helpers
            const geo = o.geometry;
            if (!geo) return;
            if (!geo.boundingBox) geo.computeBoundingBox();
            if (!geo.boundingBox) return;
            const wb = geo.boundingBox.clone().applyMatrix4(o.matrixWorld);
            if (!hasAny) { box.copy(wb); hasAny = true; } else box.union(wb);
        });
        if (!hasAny) return null;
        // In Tanki's A3D coordinate convention (after root rotation) Y is up and
        // Z is forward; the turret sits on the top (+Z here before root rotation)
        // near the middle of the hull.  Use the max-Z, X-center, Y-center point.
        const pt = new THREE.Vector3((box.min.x + box.max.x) * 0.5,
                                     (box.min.y + box.max.y) * 0.5,
                                     box.max.z * 0.7 + box.min.z * 0.3);
        return pt;
    }

    function equipAssembly(grp, fname, type) {
        if(slots[type]) { const old = slots[type].group; disposeMixer(old); groupAssembly.remove(old); dispose(old); }
        slots[type] = { group: grp, name: fname }; groupAssembly.add(grp);
        if(type==='hull') { scanMount(grp); snapTurret(); } else { snapTurret(); }
        applyTypeVisibility(type); // keep the card switch state across reloads
        fitCamera(); registerAnim(grp); activeClips[type].clear(); renderAnimChips(type); renderAttachmentPoints(); renderTextureNames();
        
        // Auto-reapply active camouflage when equipping a new skin or model
        if (visState.paint && currentPaintEntry) {
            applyPaintToGroup(grp, currentPaintEntry);
        }

        // Grenades ride the turret — re-mount them on the replacement model's fmnt
        if(type==='turret') attachGrenadesToTurret();
    }

    function scanMount(grp) {
        mountPos = null;
        grp.updateMatrixWorld(true);
        // Primary: look for a node explicitly named "mount" (case-insensitive).
        const worldPos = new THREE.Vector3();
        let found = false;
        grp.traverse(o => {
            if (found || !o.name) return;
            if (o.name.toLowerCase().includes("mount")) {
                o.getWorldPosition(worldPos);
                found = true;
            }
        });
        if (found) {
            mountPos = root.worldToLocal(worldPos.clone());
            return;
        }
        // Fallback: estimate from the visible bounding box of the hull so turrets
        // still sit in a sensible place on skins that lack a mount helper.
        const est = estimateMountPoint(grp);
        if (est) {
            // est is in grp-local world space (post-recenter); convert to root-local
            mountPos = root.worldToLocal(grp.localToWorld(est.clone()));
        }
    }

    function snapTurret() {
        if(!slots.turret) return;
        if(slots.hull && mountPos) {
            slots.turret.group.position.copy(mountPos);
            // Reset rotation so the turret aligns with the hull forward direction.
            slots.turret.group.quaternion.identity();
        } else {
            slots.turret.group.position.set(0,0,0);
        }
    }

    // ---- Grenade mounting (assets.json "grenades" -> turret "fmnt") ----
    // Tanki turret A3D files ship exactly one empty node named "fmnt" (verified
    // on all 19 turrets): a point on the rear-top of the turret body where
    // grenade gear is strapped.  Grenades are mounted as children of that node
    // with an identity local transform — fmnt's rotation and scale are identity
    // on every turret rig, and parenting below the node keeps the grenade glued
    // through turret animations and hull-mount snapping.
    function findFmntNodes(grp) {
        if (!grp) return [];
        // Prefer the collected empty-node list; fall back to a name scan so
        // TDS-loaded (.3ds) turrets without userData.emptyNodes still work.
        const fromEmpties = (grp.userData.emptyNodes || [])
            .filter(e => e.name && e.name.toLowerCase() === 'fmnt')
            .map(e => e.node);
        if (fromEmpties.length) return fromEmpties;
        const out = [];
        grp.traverse(o => { if (!o.isMesh && o.name && o.name.toLowerCase() === 'fmnt') out.push(o); });
        return out;
    }

    function unloadGrenadeClones() {
        if (!slots.turret || !slots.turret.group) return;
        const stale = [];
        slots.turret.group.traverse(o => { if (o.userData && o.userData.isGrenadeClone) stale.push(o); });
        stale.forEach(c => { c.parent.remove(c); });
    }

    function attachGrenadesToTurret() {
        unloadGrenadeClones();
        if (!slots.grenade || !slots.grenade.template) return;
        if (!slots.turret || !slots.turret.group) return;
        const fmnts = findFmntNodes(slots.turret.group);
        if (fmnts.length === 0) {
            // Warn once per turret model so skin switching does not spam toasts
            if (attachGrenadesToTurret._warned !== slots.turret.group) {
                attachGrenadesToTurret._warned = slots.turret.group;
                msg(T.noFmnt);
            }
            return;
        }
        attachGrenadesToTurret._warned = null;
        for (const f of fmnts) {
            const clone = slots.grenade.template.clone(true);
            clone.userData.isGrenadeClone = true;
            clone.position.set(0, 0, 0);
            clone.quaternion.identity();
            clone.scale.set(1, 1, 1);
            if (visState.paint && currentPaintEntry) {
                applyPaintToGroup(clone, currentPaintEntry);
            }
            f.add(clone);
        }
        applyTypeVisibility('grenade'); // respect the grenade switch on (re)mount
    }

    function clearGrenadeTemplate() {
        unloadGrenadeClones();
        if (slots.grenade) {
            dispose(slots.grenade.template);
            pools.grenade.forEach(p => p.tex.dispose());
            slots.grenade = null;
        }
        pools.grenade = [];
        renderTextureNames(); // drop the grenade texture chips
    }

    function revertGrenadePick() {
        // There is no "None" entry — a failed load folds into the card
        // switch instead: turn the grenade switch OFF and keep the picker as-is
        // (clicking any entry retries the load and flips it back ON on success).
        visState.grenade = false;
        const sw = document.getElementById('sw-grenade');
        if (sw) sw.classList.remove('active');
        applyTypeVisibility('grenade');
    }

    async function triggerGrenadeLoad() {
        if (loadingState.grenade) return;
        const name = document.getElementById('sel-grenade-name').value;
        if (name === undefined || name === null || name === 'Loading...') return;
        const wrapper = document.getElementById('box-grenade').querySelector('.icon-grid-wrapper');
        if (wrapper) wrapper.classList.add('loading');
        loadingState.grenade = true;
        await loadGrenadeAsset(name);
        if (wrapper) wrapper.classList.remove('loading');
        loadingState.grenade = false;
    }

    async function loadGrenadeAsset(name) {
        clearGrenadeTemplate();
        if (!name) return;
        const entry = assetsData.grenades && assetsData.grenades[name];
        if (!entry) return;
        const skinsMap = entrySkinsMap(entry);
        const skin = skinsMap.default ? 'default' : Object.keys(skinsMap)[0];
        const pathStr = toResourcePath(skinsMap[skin]); if (!pathStr) return;
        try {
            const meta = await fetchMeta(pathStr);
            const modelEntry = meta.find(f => f.name.toLowerCase().endsWith('.a3d')) || meta.find(f => f.name.toLowerCase().endsWith('.3ds'));
            if (!modelEntry) throw new Error("A3D/3DS model file not found");
            const modelUrl = `${RES_BASE}/${pathStr}/${modelEntry.name}`;
            let group;
            if (modelEntry.name.toLowerCase().endsWith('.a3d')) {
                const resp = await fetch(modelUrl); if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                group = parseA3D(await resp.arrayBuffer(), modelEntry.name);
            } else {
                const loader = new TDSLoader(); loader.setResourcePath(`${RES_BASE}/${pathStr}/`);
                group = await loader.loadAsync(modelUrl);
                group.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4, side:0}); o.userData.originalName = o.name; } });
            }
            const imgEntries = meta.filter(f => f.name.match(/\.(webp|png|jpg|jpeg)$/i) && !f.name.endsWith('.ktx'));
            if (imgEntries.length > 0) {
                pools.grenade = await Promise.all(imgEntries.map(async imgEntry => {
                    const tex = await new THREE.TextureLoader().loadAsync(`${RES_BASE}/${pathStr}/${imgEntry.name}`);
                    setupTex(tex); tex.name = imgEntry.name; return { name: imgEntry.name, tex: tex };
                }));
                applyTexturesFromPool(group, pools.grenade);
            }
            slots.grenade = { template: group, name: modelEntry.name };
            // A successful pick implies the grenade switch should be ON
            visState.grenade = true;
            const sw = document.getElementById('sw-grenade');
            if (sw) sw.classList.add('active');
            attachGrenadesToTurret();
            renderTextureNames(); // show grenade texture chips alongside hull/turret
        } catch(e) {
            console.error(e);
            msg(`${T.grenadeFail}: ${e.message || e}`);
            revertGrenadePick();
        }
    }

    function applyNormalTexture(tex) {
        const base = tex.name.toLowerCase().split('.')[0];
        normalMeshes.forEach(m => {
            const part = (m.userData.originalName||m.name).toLowerCase(); let match = false;
            if(part.includes(base)) match=true;
            else if(base.includes('track') && (part.includes('track')||part.includes('chain'))) match=true;
            else if(base.includes('wheel') && part.includes('wheel')) match=true;
            else if((base.includes('lightmap')||base.includes('map')) && !part.includes('track') && !part.includes('wheel')) match=true;
            if(match) setMat(m, tex);
        });
    }

    function addUI(id, text) { const div = document.createElement('div'); div.className = 'file-item'; div.innerHTML = `<span class="material-symbols-rounded">insert_drive_file</span><span>${text}</span>`; document.getElementById(id).appendChild(div); }

    // switches, skips grenade clones when hidden, ignores attachment markers).
    function computeVisibleBBox(grp) {
        const box = new THREE.Box3();
        grp.updateMatrixWorld(true);
        grp.traverse(o => {
            if (!o.isMesh || o.userData.isAttachmentMarker) return;
            if (!isEffectivelyVisible(o)) return;
            const g = o.geometry; if (!g) return;
            if (!g.boundingBox) g.computeBoundingBox();
            if (!g.boundingBox) return;
            box.union(g.boundingBox.clone().applyMatrix4(o.matrixWorld));

    function fitCamera(){
        // Prefer garage cam marker while environment is active in free-look mode
        if (cameraMode === 'fly' && slots.scene) {
            placeEnvCamera(slots.scene);
            return;
        }
        const b = computeVisibleBBox(root);
        if (b.isEmpty()) return;
        const c = b.getCenter(new THREE.Vector3());
        const size = b.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 1);
        const dist = Math.max(maxDim * 1.2, 80);
        camera.position.set(c.x + dist, c.y + dist * 0.55, c.z + dist);
        camera.lookAt(c);
        if (cameraMode === 'fly') {
            cameraTarget.position.copy(camera.position);
            cameraTarget.quaternion.copy(camera.quaternion);
        } else {
            orbitControls.target.copy(c);
            orbitControls.update();
        }
    }

    function parseAnimChunk(r, count, nxt){ const tracks=[]; for(let i=0;i<count;i++){ const nk=r.u32(); const keys=[]; for(let k=0;k<nk;k++){ const t=r.f32(), v=r.f32(); keys.push([t,v]); } tracks.push(keys); } const clips=[]; let maxTime=0; try { const numClips = r.u32(); for(let ci=0; ci<numClips; ci++){ const clipName = r.str(); const numGroups = r.u32(); const groups = []; for(let gi=0; gi<numGroups; gi++){ const bname = r.str(); const N = r.u32(); const three = r.u32(); const c1=r.u32(), t0=r.u32(), c2=r.u32(), t1=r.u32(), c3=r.u32(), t2=r.u32(); groups.push({name:bname, N, t0, t1, t2}); } clips.push({name:clipName, groups}); } } catch(e) { const groups=[]; let p=r.o; while(p < nxt-4){ const len=r.v.getUint32(p,1); if(len>=1 && len<=32 && p+4+len<=nxt){ let ok=true; for(let i=0;i<len;i++){const c=r.v.getUint8(p+4+i); if(c<32||c>=127){ok=false;break;}} if(ok){ const name = r.d.decode(new Uint8Array(r.v.buffer, r.v.byteOffset+p+4, len)); const pad=((len+3)>>2)*4-len; const after=p+4+len+pad; if(after+32<=nxt){ const N=r.v.getUint32(after,1), m3=r.v.getUint32(after+4,1); const c1=r.v.getUint32(after+8,1), t0=r.v.getUint32(after+12,1); const c2=r.v.getUint32(after+16,1), t1=r.v.getUint32(after+20,1); const c3=r.v.getUint32(after+24,1), t2=r.v.getUint32(after+28,1); if(m3===3 && c1===1 && c2===2 && c3===3 && t0<count && t1===t0+1 && t2===t0+2){ groups.push({name, N, t0, t1, t2}); p=after+32; continue; } } } } p++; } clips.push({name:'A3D_Anim', groups}); } for(const tr of tracks) if(tr.length) maxTime=Math.max(maxTime, tr[tr.length-1][0]); return {tracks, clips, duration:maxTime}; }
    function parseSkinChunk(r, count) { const skins = {}; for (let i = 0; i < count; i++) { const geoIdx = r.u16(); const numBones = r.u16(); const boneIds = []; for (let j = 0; j < numBones; j++) boneIds.push(r.u16()); if (numBones % 2 === 1) r.sk(2); const inf = r.u32(); const numVerts = r.u32(); const countElements = inf * numVerts; const boneIndices = new Int16Array(countElements); for (let j = 0; j < countElements; j++) boneIndices[j] = r.u16(); if (countElements % 2 === 1) r.sk(2); const boneWeights = new Uint16Array(countElements); for (let j = 0; j < countElements; j++) boneWeights[j] = r.u16(); if (countElements % 2 === 1) r.sk(2); skins[geoIdx] = { numBones, boneIds, inf, numVerts, boneIndices, boneWeights }; } return skins; }
    function decodeFloat16(binary) { const sign = (binary & 0x8000) ? -1 : 1; const exp = (binary >> 10) & 0x1F; const frac = binary & 0x3FF; if (exp === 0) return sign * Math.pow(2, -14) * (frac / 1024); if (exp === 0x1F) return frac ? NaN : sign * Infinity; return sign * Math.pow(2, exp - 15) * (1 + frac / 1024); }
    function applySkin(geo, skin) { const numVerts = geo.attributes.position.count; if (numVerts !== skin.numVerts) return; const si = new Uint16Array(numVerts * 4); const sw = new Float32Array(numVerts * 4); const influences = Math.min(4, skin.inf); for (let i = 0; i < numVerts; i++) { let wSum = 0; for (let j = 0; j < influences; j++) { const idx = i * skin.inf + j; const internalBone = skin.boneIndices[idx]; const weight = decodeFloat16(skin.boneWeights[idx]); const outIdx = i * 4 + j; si[outIdx] = internalBone; sw[outIdx] = (Number.isFinite(weight) && weight > 0) ? weight : 0; wSum += sw[outIdx]; } if (wSum > 0) { for (let j = 0; j < influences; j++) sw[i * 4 + j] /= wSum; } else { sw[i * 4] = 1; } } geo.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4)); geo.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4)); }
    function parseBindChunk(r){ const numRec=r.u32(); const mats={}; for(let i=0;i<numRec;i++){ const nodeId=r.u32(); const f=[]; for(let j=0;j<12;j++) f.push(r.f32()); const M=new THREE.Matrix4(); M.set(f[0],f[3],f[6],f[9], f[1],f[4],f[7],f[10], f[2],f[5],f[8],f[11], 0,0,0,1); mats[nodeId]=M; } return mats; }
    function build(gd, td, od, fname, mats, anim, skin, bindMats){
        const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,metalness:0.2,side:0});
        const geos=gd.map((d, i)=>{ const g=new THREE.BufferGeometry(); g.userData={n:d.n}; d.vb.forEach(v=>{ if(v.t===1) g.setAttribute('position', new THREE.BufferAttribute(v.d,3)); if(v.t===3) g.setAttribute('normal', new THREE.BufferAttribute(v.d,3)); if(v.t===2){ for(let k=1;k<v.d.length;k+=2) v.d[k]=1.0-v.d[k]; g.setAttribute('uv', new THREE.BufferAttribute(v.d,2)); } }); let idxs=[], o=0; d.sm.forEach((s,subIdx)=>{ for(let k=0;k<s.x.length;k++) idxs.push(s.x[k]); g.addGroup(o,s.x.length,subIdx); o+=s.x.length; }); g.setIndex(idxs); if (skin && skin[i]) { applySkin(g, skin[i]); g.userData.skinData = skin[i]; } return g; });

        if(anim){ const nameToNode={}; nds.forEach(nn=>{ if(nn&&nn.name) nameToNode[nn.name]=nn; }); grp.userData.anim={ tracks: anim.tracks, clips: anim.clips, groups: (anim.clips && anim.clips.length) ? anim.clips[0].groups : (anim.groups||[]), duration: anim.duration, nameToNode }; }
        // Collect empty nodes (attachment points / bones with no geometry assigned)
        if (td.t && td.t.length > 0) {

            if (od.length > 0) od.forEach(o => { if (o.ti >= 0) usedNodes.add(o.ti); });
            grp.userData.emptyNodes = [];
            grp.userData.boneNodes = [];
            nds.forEach((node, idx) => {

                if (node.isBone) {

    }
