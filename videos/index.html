    .shell{width:min(1080px,100%);margin:auto;padding:0 32px 80px}.intro{padding:52px 0 28px}.eyebrow{display:flex;gap:10px;align-items:center;color:var(--green);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}.eyebrow:before{content:'';width:25px;height:2px;background:var(--green)}h1{margin:14px 0 12px;font-weight:700;font-size:clamp(34px,5vw,58px);letter-spacing:-.04em;line-height:1.1}h1 span{color:var(--green)}.intro p{color:var(--muted);font-size:14px;line-height:1.8;margin:0}.toolbar{display:flex;flex-direction:column;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--outline)}

    .searchbox{height:50px;border:1px solid var(--outline);background:rgba(191,213,255,.06);border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--blue);max-width:440px;width:100%}.searchbox:focus-within{outline:3px solid var(--blue);outline-offset:3px}.searchbox span{font-size:21px}.searchbox input{border:0;outline:0!important;min-width:0;width:100%;color:#fff;background:transparent;font-size:14px}.searchbox input::placeholder{color:rgba(191,213,255,.6)}
    .list-head{color:var(--muted);font-size:12px;min-height:18px;margin:22px 2px 13px}.list{display:flex;flex-direction:column;gap:10px}.video-row{background:rgba(191,213,255,.055);border:1px solid rgba(191,213,255,.15);border-radius:23px;overflow:visible;transition:border-color .2s,background .2s}.video-row:has(.row-button[aria-expanded=true]){background:rgba(191,213,255,.08);border-color:rgba(118,255,51,.65)}

    .inline-player:fullscreen{width:100%;height:100%;background:var(--base);padding:12px;display:flex;flex-direction:column}.inline-player:fullscreen .player-frame{flex:1;min-height:0;aspect-ratio:auto}.inline-player:fullscreen .controls{flex:none}
    @media(max-width:600px){.shell{padding:0 16px 60px}.intro{padding:38px 0 24px}.filter{width:44px;height:44px}.row-button{padding:12px;gap:9px}.row-title{font-size:14px}.badge{width:28px;height:28px}.badge img{width:21px;height:21px}.inline-player{padding:0 9px 12px}.control{width:38px;height:38px;border-radius:14px}.control.main{width:44px;height:44px;border-radius:16px}.volume{display:none}.time{min-width:33px;font-size:11px}}

    .controls-row{justify-content:center;flex-wrap:wrap;gap:8px}

    .speed-menu[hidden]{display:none}
    .speed-menu button{display:block;width:100%;height:36px;padding:0 12px;border:0;border-radius:12px;color:var(--blue);background:transparent;text-align:left;font-size:13px}
    .speed-menu button:hover,.speed-menu button:focus-visible{background:rgba(191,213,255,.14)}
    .speed-menu button[aria-checked=true]{background:var(--green);color:#001926;font-weight:700}
    .transfer-status{min-height:16px;margin:0;text-align:center;color:var(--blue);font-size:12px;font-variant-numeric:tabular-nums}
    .transfer-status:empty{display:none}
    @media(max-width:600px){.controls-row{gap:6px}.speed-button{height:38px;padding:0 7px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="intro">
    <div class="eyebrow" data-i18n="archive">3D坦克 · 玩家收集</div>
    <h1><span data-i18n="title" style="color:inherit">电影级宣传片合集</span><span>.</span></h1>
    <p data-i18n="description">玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。</p>
  </header>
  <section class="toolbar" data-i18n-aria="filters" aria-label="系列筛选">
    <div class="filter-bar" id="filters" role="group" data-i18n-aria="filters" aria-label="系列筛选"></div>
    <label class="searchbox"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索宣传片名称" aria-label="搜索宣传片名称"></label>
  </section>
  <p class="list-head" id="status" role="status" aria-live="polite">正在读取宣传片…</p>
  <section class="list" id="list" data-i18n-aria="list" aria-label="宣传片列表"></section>
</main>
<script>
const SKIN_SERIES = [
  {key:'HD',icon:'standard.svg'},
  {key:'XT',icon:'XT.svg'},
  {key:'XT_HD',icon:'XT_HD.svg'},
  {key:'LC',icon:'LC.svg'},
  {key:'DC',icon:'DC.svg'},
  {key:'PR',icon:'PR.svg'},
  {key:'UT',icon:'UT.svg'},
  {key:'SP',icon:'SP.svg'},
  {key:'SE',icon:'SE.svg'},
  {key:'RF',icon:'RF.svg'},
  {key:'GT',icon:'GT.svg'},
  {key:'ICE',icon:'ICE.svg'},
  {key:'DK',icon:'DK.svg'},
  {key:'VT',icon:'VT.svg'},
  {key:'standard',icon:'standard.svg'},
];
// 这些名称和 SVG 来自仓库的 equipment_icons；非装备宣传不靠猜测归类。
const EQUIPMENT = [
  {key:'firebird',icon:'firebird.svg'},
  {key:'freeze',icon:'freeze.svg'},
  {key:'isida',icon:'isida.svg'},
  {key:'hammer',icon:'hammer.svg'},
  {key:'twins',icon:'twins.svg'},
  {key:'ricochet',icon:'ricochet.svg'},
  {key:'smoky',icon:'smoky.svg'},
  {key:'striker',icon:'striker.svg'},
  {key:'vulcan',icon:'vulcan.svg'},
  {key:'thunder',icon:'thunder.svg'},
  {key:'railgun',icon:'railgun.svg'},
  {key:'shaft',icon:'shaft.svg'},
  {key:'magnum',icon:'magnum.svg'},
  {key:'gauss',icon:'gauss.svg'},
  {key:'tesla',icon:'tesla.svg'},
  {key:'scorpion',icon:'scorpion.svg'},
  {key:'tsunami',icon:'tsunami.svg'},
  {key:'wasp',icon:'wasp.svg'},
  {key:'hornet',icon:'hornet.svg'},
  {key:'hunter',icon:'hunter.svg'},
  {key:'viking',icon:'viking.svg'},
  {key:'dictator',icon:'dictator.svg'},
  {key:'titan',icon:'titan.svg'},
  {key:'mammoth',icon:'mammoth.svg'},
  {key:'ares',icon:'ares.svg'},
  {key:'crusader',icon:'crusader.svg'},
  {key:'paladin',icon:'paladin.svg'},
  {key:'hopper',icon:'hopper.svg'},
  {key:'bonk',icon:'bonk.svg'},
  {key:'juggernaut',icon:'juggernaut.svg'},
  {key:'terminator',icon:'terminator.svg'},
  {key:'tomato_gun',icon:null},
];

// 宣传片资料从 /videos/catalog.json 读取；数组自身的顺序就是显示顺序。
const catalogByName = new Map();
// 浏览器语言为中文时显示字典中的中文标题，其他语言显示 Drive 原名。
const isChinese = /^zh(?:-|$)/i.test(navigator.language || '');
const t = isChinese ? {
  archive:'3D坦克 · 玩家收集', title:'电影级宣传片合集',
  description:'玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。本合集并非官方发布。',
  filters:'系列筛选', list:'宣传片列表', search:'搜索宣传片名称', all:'全部宣传片', other:'地图、活动与其他',
  series:(name) => `${name} 系列`, playName:(name) => `播放 ${name}`, closeName:(name) => `收起 ${name}`,
  unclassified:'未分类', loading:'正在读取宣传片…', loadError:'加载失败',
  loadFailure:'无法读取宣传片列表。请检查 Cloudflare 和 Google Drive 配置。',
  badList:'宣传片列表格式不正确。', catalogFailure:'无法读取宣传片配置文件。', badCatalog:'宣传片配置文件格式不正确。', noResults:'没有找到符合条件的宣传片。',
  count:(shown,total) => `显示 ${shown} 个 · 共 ${total} 个`,
  play:'播放', pause:'暂停', back:'后退 10 秒', forward:'前进 10 秒', seek:'播放进度',
  mute:'静音', unmute:'取消静音', volume:'音量', speed:'播放速度', fullscreen:'全屏', exitFullscreen:'退出全屏', close:'关闭播放器',
  playbackError:'播放失败：请检查视频格式、Google Drive 权限或流量限制。', buffering:'缓冲中…', speedUnavailable:'缓冲中 · 无法测量加载速度', transfer:(value) => `加载速度 ${value}`,
} : {
  archive:'Tanki Online · Fan collection', title:'Cinematic promo collection',
  description:'Official promos covering skins, equipment, maps, and events, collected by a fan. This is not an official release.',
  filters:'Series filters', list:'Promo list', search:'Search promo titles', all:'All promos', other:'Maps, events & more',
  series:(name) => `${name} series`, playName:(name) => `Play ${name}`, closeName:(name) => `Collapse ${name}`,
  unclassified:'Unclassified', loading:'Loading promos…', loadError:'Loading failed',
  loadFailure:'Could not load the promo list. Check the Cloudflare and Google Drive configuration.',
  badList:'The promo list has an invalid format.', catalogFailure:'Could not load the promo catalog file.', badCatalog:'The promo catalog file has an invalid format.', noResults:'No promos match your selection.',
  count:(shown,total) => `Showing ${shown} of ${total}`,
  play:'Play', pause:'Pause', back:'Rewind 10 seconds', forward:'Forward 10 seconds', seek:'Playback position',
  mute:'Mute', unmute:'Unmute', volume:'Volume', speed:'Playback speed', fullscreen:'Fullscreen', exitFullscreen:'Exit fullscreen', close:'Close player',
  playbackError:'Playback failed. Check the video format, Google Drive permissions, or usage limits.', buffering:'Buffering…', speedUnavailable:'Buffering · Speed unavailable', transfer:(value) => `Loading ${value}`,
};
document.documentElement.lang = isChinese ? 'zh-CN' : 'en';
document.title = isChinese ? '电影级宣传片合集 · Testanki' : 'Cinematic promo collection · Testanki';
function localize(root) {
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  root.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t[el.dataset.i18nPlaceholder]; });
}
localize(document);
function classify(name) {
  const entry = catalogByName.get(name);
  if (!entry) return { skins: [], equipment: [], displayName: name, zhName: '', known: false };
  const series = entry.series ? SKIN_SERIES.find(item => item.key === entry.series) : null;
  const equipment = entry.equipment.map(key => EQUIPMENT.find(item => item.key === key)).filter(Boolean);
  return { skins: series ? [series] : [], equipment, displayName: isChinese ? entry.zh : name, zhName: entry.zh, known: true };
}
function image(kind, item) {
  const img = document.createElement('img');
  img.src = `/${kind === 'skin' ? 'skin_icons' : 'equipment_icons'}/${item.icon}`;
  img.alt = ''; img.loading = 'lazy';
  img.addEventListener('error', () => { img.hidden = true; });
  return img;
}
function icon(name) {
  const el = document.createElement('span'); el.className = 'material-symbols-rounded';
  el.textContent = name; el.setAttribute('aria-hidden','true'); return el;
}
const filters = document.getElementById('filters'), list = document.getElementById('list');
const search = document.getElementById('search'), status = document.getElementById('status');
let videos = [], activeFilter = 'HD', activePlayer = null;
// SKIN_SERIES 数组按 Wiki 顺序排列；HD 是默认外观，放在最前。
status.textContent = t.loading;
// Service Worker 只转发视频字节并统计速率；不可用时仍直接播放，不伪造速度。
const meterReady = (async () => {
  if (!('serviceWorker' in navigator) || typeof ReadableStream === 'undefined') return false;
  try {
    const registration = await navigator.serviceWorker.register('/videos/stream-sw.js', {scope:'/videos/'});
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller?.scriptURL.includes('/videos/stream-sw.js')) return true;
    return await new Promise(resolve => {
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(timer); navigator.serviceWorker.removeEventListener('controllerchange', check); resolve(!!navigator.serviceWorker.controller?.scriptURL.includes('/videos/stream-sw.js')); };
      const check = () => { if (navigator.serviceWorker.controller?.scriptURL.includes('/videos/stream-sw.js')) finish(); };
      const timer = setTimeout(finish, 3500);
      navigator.serviceWorker.addEventListener('controllerchange', check);
      check();
    });
  } catch { return false; }
})();
function formatRate(bytesPerSecond) {
  if (!Number.isFinite(bytesPerSecond) || bytesPerSecond < 0) return '';
  return bytesPerSecond >= 1024 * 1024 ? `${(bytesPerSecond / 1024 / 1024).toFixed(2)} MB/s` : `${(bytesPerSecond / 1024).toFixed(0)} KB/s`;
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', event => {
  const data = event.data;
  if (data?.type === 'promo-transfer' && activePlayer?.session === data.session) activePlayer.transfer(data);
});
function closePlayer(restoreFocus = false) {
  if (!activePlayer) return;
  const { video, panel, trigger, fullHandler, cleanup } = activePlayer;
  activePlayer = null;
  cleanup();
  if (document.fullscreenElement === panel && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  document.removeEventListener('fullscreenchange', fullHandler);
  video.pause(); video.removeAttribute('src'); video.load(); panel.remove();
  trigger.setAttribute('aria-expanded','false');
  if (restoreFocus) trigger.focus();
}
function makeFilter(key, label, node) {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'filter';
  button.setAttribute('aria-label', label); button.setAttribute('aria-pressed', String(activeFilter === key));
  button.title = label; button.append(node);
  button.addEventListener('click', () => { activeFilter = key; renderFilters(); renderList(); });
  filters.append(button);
}
function renderFilters() {
  filters.replaceChildren();
  const available = SKIN_SERIES.filter(series => series.icon && videos.some(v => v.skins.some(x => x.key === series.key)));
  const hasOther = videos.some(v => !v.skins.length && !v.equipment.length);
  if (!available.some(series => series.key === activeFilter) && !(activeFilter === 'other' && hasOther)) activeFilter = available[0]?.key || (hasOther ? 'other' : '');
  for (const series of available) makeFilter(series.key, t.series(series.key.replace(/_/g,' ')), image('skin',series));
  if (hasOther) makeFilter('other', t.other, icon('category'));
}
function filteredVideos() {
  const word = search.value.trim().toLocaleLowerCase();
  return videos.filter(v => {
    const matchesFilter = activeFilter === 'other' ? (!v.skins.length && !v.equipment.length) : v.skins.some(s => s.key === activeFilter);
    const zhName = v.zhName;
    return matchesFilter && (!word || v.name.toLocaleLowerCase().includes(word) || zhName.toLocaleLowerCase().includes(word));
  });
}
function renderList() {
  closePlayer(); list.replaceChildren();
  const shown = filteredVideos(); status.textContent = t.count(shown.length, videos.length);
  if (!shown.length) { const message = document.createElement('div'); message.className = 'message'; message.textContent = t.noResults; list.append(message); return; }
  for (const item of shown) {
    const row = document.createElement('article'); row.className = 'video-row';
    const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'row-button';
    trigger.setAttribute('aria-expanded','false'); trigger.setAttribute('aria-label',t.playName(item.displayName));
    const title = document.createElement('span'); title.className = 'row-title'; title.textContent = item.displayName;
    const badges = document.createElement('span'); badges.className = 'row-icons';
    for (const [kind, obj] of [...item.skins.map(x => ['skin',x]),...item.equipment.map(x => ['equipment',x])]) {
      if (!obj.icon) continue;
      const badge = document.createElement('span'); badge.className = 'badge'; badge.append(image(kind,obj)); badges.append(badge);
    }
    if (!item.known) { const tag = document.createElement('span'); tag.className = 'unknown'; tag.textContent = t.unclassified; badges.append(tag); }
    trigger.append(title,badges); row.append(trigger);
    trigger.addEventListener('click', () => {
      if (activePlayer?.trigger === trigger) { closePlayer(true); return; }
      closePlayer(); openPlayer(item,row,trigger);
    });
    list.append(row);
  }
}
function formatTime(value) {
  if (!Number.isFinite(value) || value < 0) return '0:00';
  const sec = Math.floor(value), h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function openPlayer(item,row,trigger) {
  const panel = document.createElement('div'); panel.className = 'inline-player';
  // Markup is constant; video titles are always inserted with textContent elsewhere.
  panel.innerHTML = `
    <div class="player-frame"><video playsinline preload="metadata" tabindex="0"></video></div>
    <div class="controls">
      <div class="seek-row"><span class="time current">0:00</span><input class="range seek" type="range" min="0" max="0" step="0.1" value="0" disabled data-i18n-aria="seek"><span class="time duration">0:00</span></div>
      <p class="transfer-status" aria-live="off"></p>
      <div class="controls-row">
        <button class="control mute" type="button" data-i18n-aria="mute"><span class="material-symbols-rounded" aria-hidden="true">volume_up</span></button>
