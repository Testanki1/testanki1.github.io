ius:9px;background:rgba(191,213,255,.12);display:grid;place-items:center}.icon-box img{width:22px;height:22px;object-fit:contain}.category-label{font-size:10px;letter-spacing:.11em;font-weight:700;color:rgba(191,213,255,.70)}.play-bubble{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#BFD5FF;color:#001926}.play-bubble .material-symbols-rounded{font-size:22px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}.card-name{font-weight:600;font-size:16px;line-height:1.35;overflow-wrap:anywhere}.card-sub{font-size:11px;margin-top:7px;color:rgba(191,213,255,.70);line-height:1.5}.message{grid-column:1/-1;padding:38px;border:1px dashed rgba(191,213,255,.30);border-radius:24px;color:rgba(191,213,255,.75);line-height:1.7}

<body>
  <div class="shell">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div><div class="eyebrow" data-i18n="archive">3D坦克 · 玩家收集</div><h1 id="page-title"><span data-i18n="title">电影级宣传片合集</span><span style="color:var(--green)">.</span></h1><p><span data-i18n="heroLine1">玩家收集的官方宣传片，涵盖皮肤、装备、地图和活动。</span><br><span data-i18n="heroLine2">本合集由玩家整理，并非官方发布。</span></p></div>
        <div class="hero-tag"><span data-i18n="collection">视频精选</span> &nbsp; <span class="material-symbols-rounded" aria-hidden="true" style="font-size:16px;vertical-align:middle">arrow_outward</span></div>
      </section>
      <section class="layout" data-i18n-aria="videoPlayer" aria-label="视频播放器">
        <div class="player-panel">
          <div class="player-top"><span class="label"><span class="live-dot"></span><span data-i18n="nowPlaying">正在播放</span></span><span class="counter" data-i18n="videoCollection">视频合集</span></div>
          <div class="screen" id="screen">
            <div class="empty"><div class="ornament"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span></div><strong data-i18n="ready">请选择宣传片</strong><span data-i18n="chooseBelow">从下方列表选择宣传片播放</span></div>
            <video id="player" controls playsinline preload="metadata" data-i18n-aria="videoPlayer" aria-label="视频播放器"></video>
          </div>
          <div class="player-bottom"><div><h2 id="playing-title" data-i18n="chooseVideo">选择一个视频</h2><p id="playing-description" data-i18n="chooseVideoHint">选择视频后将在这里播放</p></div><span class="pill"><span class="material-symbols-rounded" aria-hidden="true" style="font-size:15px;vertical-align:middle">cloud</span> &nbsp; <span data-i18n="driveVideo">云端视频</span></span></div>
        </div>
        <aside class="side"><div class="kicker" data-i18n="sideKicker">合集说明</div><h2 data-i18n="sideTitle">官方宣传片，玩家整理。</h2><p data-i18n="sideText">包含高清皮肤、地图与活动等 3D坦克 宣传片。</p><div class="side-rule"></div><div class="side-meta"><div><strong id="total-count">—</strong><br><span data-i18n="videosInCollection">个视频</span></div><span class="star material-symbols-rounded" aria-hidden="true">auto_awesome</span></div></aside>
      </section>
      <section class="library" aria-labelledby="library-title">
        <div class="library-head"><div><div class="eyebrow" data-i18n="explore">宣传片列表</div><h2 id="library-title" data-i18n="exploreAll">全部宣传片</h2></div><label class="searchbox"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="搜索视频名称" aria-label="搜索视频名称" data-i18n-placeholder="search" data-i18n-aria="search"></label></div>
        <div class="toolbar" role="group" data-i18n-aria="categories" aria-label="视频分类">
          <button class="tab" data-category="all" aria-pressed="true" data-i18n="all">全部</button><button class="tab" data-category="skins-equipment" aria-pressed="false" data-i18n="skinsEquipment">皮肤与装备</button><button class="tab" data-category="other" aria-pressed="false" data-i18n="mapsOther">地图、活动与其他</button>
        </div>
        <div id="filters" class="filters" role="group" data-i18n-aria="filters" aria-label="细分筛选"></div>
        <p id="status" class="statusline" role="status" aria-live="polite">正在读取视频列表…</p>
        <div id="grid" class="grid"></div>
      </section>
    </main>
  </div>
<script>
/*

  HD 使用 skin_icons/standard.svg；XT HD 仍使用 XT_HD.svg。
  分类只是命名规则推断：没有匹配到皮肤系列或装备的文件归入「地图与其他」。
*/

// 根据浏览器提供的首选语言选择中文或英文；文件名保留 Drive 原文。
const isChinese = /^zh(?:-|$)/i.test(navigator.language || '');
const translations = isChinese ? {

};

document.documentElement.lang = isChinese ? 'zh-CN' : 'en';

document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });

// 已知装备中文名参考网站已有 translations.js，未收录的专有名称保留原名。

  firebird:'火焰炮', freeze:'冰风暴', isida:'磁力炮', hammer:'滑膛炮', twins:'离子炮',
  ricochet:'火龙珠', smoky:'轰天炮', striker:'火箭炮', vulcan:'极速炮', thunder:'雷暴炮',
  railgun:'激光炮', shaft:'镭射炮', magnum:'马格南', gauss:'电磁炮', tesla:'特斯拉',
  scorpion:'蝎子', wasp:'黄蜂轻甲', hornet:'蜂王', hunter:'猎人中甲', viking:'维京',
  dictator:'主宰者', titan:'泰坦', mammoth:'猛犸象', ares:'阿瑞斯', crusader:'十字军',
  paladin:'圣骑士', hopper:'霍珀', juggernaut:'剑圣', terminator:'终结者',
};
function itemLabel(kind, item) {
  if (isChinese && kind === 'equipment') return EQUIPMENT_ZH[item.key] || item.label;
  if (isChinese && item.key === 'standard' && kind === 'skin') return '标准';
  return item.label;
}

const $ = (selector) => document.querySelector(selector);
const player = $('#player'), screen = $('#screen'), grid = $('#grid'), status = $('#status'), filters = $('#filters');
let videos = [], category = 'all', selectedSeries = '', selectedId = '';
status.textContent = t.loading;

function containsTerm(name, term) {

function classify(name) {

function renderFilters() {

  const heading = document.createElement('span'); heading.className = 'filter-heading'; heading.textContent = t.series; row.append(heading);

    button.setAttribute('aria-pressed', String(selectedSeries === key));
    if (icon) button.append(image(iconPath('skin', icon), ''));
    const text = document.createElement('span'); text.textContent = label; button.append(text);
    if (count !== null) { const total = document.createElement('span'); total.className = 'count'; total.textContent = count; button.append(total); }
    button.addEventListener('click', () => { selectedSeries = selectedSeries === key ? '' : key; render(); });
    row.append(button);
  }
  addChip('', t.all, null, null);
  for (const series of SKIN_SERIES) {
    const count = videos.filter(v => v.skins.some(x => x.key === series.key)).length;
    if (count) addChip(series.key, itemLabel('skin', series), series.icon, count);
  }
  // 文件名没写系列但识别出装备的宣传不猜成 standard，单独显示。
  const unmarked = videos.filter(v => !v.skins.length && v.equipment.length).length;
  if (unmarked) addChip('__unmarked__', t.unmarked, null, unmarked);
  filters.append(row);
}
function render() {

  const keyword = $('#search').value.trim().toLocaleLowerCase();
  const list = videos.filter(v => {
    if (!matchingCategory(v) || !v.name.toLocaleLowerCase().includes(keyword)) return false;
    if (category === 'skins-equipment') {
      if (selectedSeries === '__unmarked__' && (v.skins.length || !v.equipment.length)) return false;
      if (selectedSeries && selectedSeries !== '__unmarked__' && !v.skins.some(x => x.key === selectedSeries)) return false;
    }

  status.textContent = t.count(list.length, videos.length);
  grid.replaceChildren();
  if (!list.length) {

  }

    const button = document.createElement('button'); button.type = 'button'; button.className = 'card';
    button.setAttribute('aria-label', t.play(video.name)); button.setAttribute('aria-current', String(video.id === selectedId));
    const top = document.createElement('div'); top.className = 'card-top';

    if (!icons.children.length) { const label = document.createElement('span'); label.className = 'category-label'; label.textContent = video.skins.length ? t.skin : t.otherShort; icons.append(label); }
    const play = document.createElement('span'); play.className = 'play-bubble'; play.setAttribute('aria-hidden','true');
    const playIcon = document.createElement('span'); playIcon.className = 'material-symbols-rounded'; playIcon.textContent = 'play_arrow'; play.append(playIcon);
    top.append(icons,play);
    const text = document.createElement('div'); const name = document.createElement('div'); name.className = 'card-name'; name.textContent = video.name;
    const sub = document.createElement('div'); sub.className = 'card-sub';
    sub.textContent = [...video.skins.map(x => itemLabel('skin',x)), ...video.equipment.map(x => itemLabel('equipment',x))].join(' · ') || t.other;
    text.append(name,sub); button.append(top,text);
    button.addEventListener('click', async () => {
      selectedId = video.id; $('#playing-title').textContent = video.name;
      $('#playing-description').textContent = sub.textContent;
      screen.classList.add('has-video');
      player.src = '/api/promo-videos?action=video&id=' + encodeURIComponent(video.id);
      player.load(); render();
      screen.scrollIntoView({behavior:'smooth',block:'center'});
      try { await player.play(); } catch { /* Autoplay can be blocked; use the player controls. */ }
    });
    grid.append(button);
  }
}
document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
  category = button.dataset.category; selectedSeries = '';
  document.querySelectorAll('.tab').forEach(tab => tab.setAttribute('aria-pressed', String(tab === button)));
  render();
}));
$('#search').addEventListener('input', render);
player.addEventListener('error', () => { $('#playing-description').textContent = t.playbackError; });
async function loadVideos() {
  try {
    const response = await fetch('/api/promo-videos?action=list', {cache:'no-store'});
    if (!response.ok) throw new Error(`${t.loadFailure} (HTTP ${response.status})`);
    const data = await response.json();
    if (!Array.isArray(data.videos)) throw new Error(t.badList);
    videos = data.videos.filter(v => typeof v.id === 'string' && typeof v.name === 'string').map(v => ({...v,...classify(v.name)}));
    $('#total-count').textContent = videos.length; render();
  } catch (error) {
    status.textContent = t.loadError;
    const message = document.createElement('div'); message.className = 'message';
    message.textContent = error instanceof SyntaxError ? t.badList : (error.message?.startsWith(t.loadFailure) || error.message === t.badList ? error.message : t.loadFailure);
    grid.replaceChildren(message);
  }
}
loadVideos();
</script>
