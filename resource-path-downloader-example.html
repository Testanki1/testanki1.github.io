<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resource Path Downloader (Example)</title>
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js/dist/zip.min.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: monospace;
        font-size: 24px;
        color: #000;
        background-color: #fff;
    }
</style>
</head>
<body>
    <div id="p">0.00 MB / 0.00 MB (0.0%)</div>

<script>
const host = "https://res.3dtank.com/";

const dirs = [
    // Libraries
    "553/105167/27/302/30546776460526/",
    "570/174542/371/71/31167243462337/",
    
    // Sandbox REMASTER MM
    "570/174542/371/60/31656237623505/",
    "570/174542/371/64/31656237623467/",
    "570/174542/371/65/31656237623460/",
    "570/174542/371/61/31656237623514/",
    "570/174542/371/66/31656237623464/",
    "570/174542/371/62/31656237623520/",
    "0/1/304/263/31656237623476/",
    
    // Forest REMASTER MM
    "0/16723/204/372/31656237623200/",
    "0/16723/204/143/31656237623216/",
    "0/16723/204/144/31656237623222/",
    
    // Sandal REMASTER MM
    "544/77313/263/311/31656237623450/",
    "544/77313/263/312/31656237623442/",
    "544/77313/263/313/31656237623432/",
    "544/77313/263/314/31656237623436/",
    
    // New Year REMASTER
    "570/174542/371/72/31656237624047/",
    
    // Highland REMASTER MM
    "570/174542/371/116/31656237623240/",
    "570/174542/371/160/31656237625001/",
    "570/174542/371/121/31656237623231/",
    "570/174542/371/124/31656237623250/",
    
    // Cross REMASTER MM
    "570/174542/371/130/31656237623152/",
    "570/174542/371/146/31656237623143/",
    "570/174542/371/133/31656237623140/",
    "570/174542/371/136/31656237623161/",
    
    // Parma REMASTER MM
    "570/174542/371/104/31656237623400/",
    "570/174542/371/107/31656237623367/",
    "570/174542/371/112/31656237623407/"
];

const el = document.getElementById("p");
let dlBytes = 0;
let totBytes = 0;

function update() {
    const d = (dlBytes / 1048576).toFixed(2);
    const t = (totBytes / 1048576).toFixed(2);
    const pct = totBytes > 0 ? ((dlBytes / totBytes) * 100).toFixed(1) : "0.0";
    el.innerText = `${d} MB / ${t} MB (${pct}%)`;
}

function parsePath(str) {
    try {
        const p = str.split('/').filter(x => x);
        if (p.length !== 5) return { folder: str, date: new Date() };
        
        const v = p.map(x => BigInt("0o" + x));
        const id = (v[0] << 32n) | (v[1] << 16n) | (v[2] << 8n) | v[3];
        
        const tsNumber = Number(v[4]);

        return {
            folder: `${id}_${tsNumber}`,
            date: new Date(tsNumber) 
        };
    } catch {
        return { folder: str, date: new Date() };
    }
}

async function run() {
    const zipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"));
    const q = [];

    const metaPromises = dirs.map(async (d) => {
        try {
            const res = await fetch(host + d + "meta.info");
            if (!res.ok) return;
            
            const parsed = parsePath(d);
            const folderName = parsed.folder;
            const itemDate = parsed.date;

            await zipWriter.add(folderName + "/", null, { directory: true, lastModDate: itemDate });

            const list = await res.json();
            
            for (let f of list) {
                const n = f.name.toLowerCase();
                if (n.endsWith(".ktx") || n.endsWith(".meta") || n.endsWith(".info")) continue;
                
                totBytes += f.size;
                q.push({
                    url: host + d + f.name,
                    path: folderName + "/" + f.name,
                    date: itemDate
                });
            }
        } catch (e) {}
    });

    await Promise.all(metaPromises);
    update();

    const dlPromises = q.map(async (item) => {
        try {
            const res = await fetch(item.url);
            if (!res.ok) return;

            const reader = res.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                dlBytes += value.length;
                update();
            }

            const blobObj = new Blob(chunks);
            await zipWriter.add(item.path, new zip.BlobReader(blobObj), { lastModDate: item.date });
        } catch (e) {}
    });

    await Promise.all(dlPromises);

    el.innerText = `Finalizing ZIP...`;
    const blob = await zipWriter.close();

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "assets.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    
    el.innerText = "Done";
}

window.onload = run;
</script>

</body>
</html>
