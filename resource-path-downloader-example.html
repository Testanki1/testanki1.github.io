<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resource Path Downloader (Example)</title>
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js/dist/zip.min.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: monospace;
        font-size: 24px;
        color: #000;
        background-color: #fff;
    }
</style>
</head>
<body>
    <div id="p">0.00 MB / 0.00 MB (0.0%)</div>

<script>
const host = "https://res.3dtank.com/";

const resources = [
    // Libraries
    { id: 1561396189122, version: 1697451237718 },
    { id: 1619091716409, version: 1734001714399 },
    
    // Sandbox REMASTER MM
    { id: 1619091716400, version: 1775742428997 },
    { id: 1619091716404, version: 1775742428983 },
    { id: 1619091716405, version: 1775742428976 },
    { id: 1619091716401, version: 1775742429004 },
    { id: 1619091716406, version: 1775742428980 },
    { id: 1619091716402, version: 1775742429008 },
    { id: 115891,          version: 1775742428990 },
    
    // Forest REMASTER MM
    { id: 500401402,       version: 1775742428800 },
    { id: 500401251,       version: 1775742428814 },
    { id: 500401252,       version: 1775742428818 },
    
    // Sandal REMASTER MM
    { id: 1531135636425,   version: 1775742428968 },
    { id: 1531135636426,   version: 1775742428962 },
    { id: 1531135636427,   version: 1775742428954 },
    { id: 1531135636428,   version: 1775742428958 },
    
    // New Year REMASTER
    { id: 1619091716410,   version: 1775742429223 },
    
    // Highland REMASTER MM
    { id: 1619091716430,   version: 1775742428832 },
    { id: 1619091716464,   version: 1775742429697 },
    { id: 1619091716433,   version: 1775742428825 },
    { id: 1619091716436,   version: 1775742428840 },
    
    // Cross REMASTER MM
    { id: 1619091716440,   version: 1775742428778 },
    { id: 1619091716454,   version: 1775742428771 },
    { id: 1619091716443,   version: 1775742428768 },
    { id: 1619091716446,   version: 1775742428785 },
    
    // Parma REMASTER MM
    { id: 1619091716420,   version: 1775742428928 },
    { id: 1619091716423,   version: 1775742428919 },
    { id: 1619091716426,   version: 1775742428935 }
];

const el = document.getElementById("p");
let dlBytes = 0;
let totBytes = 0;

function update() {
    const d = (dlBytes / 1048576).toFixed(2);
    const t = (totBytes / 1048576).toFixed(2);
    const pct = totBytes > 0 ? ((dlBytes / totBytes) * 100).toFixed(1) : "0.0";
    el.innerText = `${d} MB / ${t} MB (${pct}%)`;
}

function buildPath(id, version) {
    const v0 = Math.floor(id / 4294967296).toString(8);
    const v1 = (Math.floor(id / 65536) % 65536).toString(8);
    const v2 = (Math.floor(id / 256) % 256).toString(8);
    const v3 = (id % 256).toString(8);
    const v4 = version.toString(8);

    return `${v0}/${v1}/${v2}/${v3}/${v4}/`;
}

async function run() {
    const zipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"));
    const q = [];

    const metaPromises = resources.map(async (item) => {
        try {
            const d = buildPath(item.id, item.version);
            const folderName = `${item.id}_${item.version}`;
            const itemDate = new Date(item.version);

            const res = await fetch(host + d + "meta.info");
            if (!res.ok) return;

            await zipWriter.add(folderName + "/", null, { directory: true, lastModDate: itemDate });

            const list = await res.json();
            
            for (let f of list) {
                const n = f.name.toLowerCase();
                if (n.endsWith(".ktx") || n.endsWith(".meta") || n.endsWith(".info")) continue;
                
                totBytes += f.size;
                q.push({
                    url: host + d + f.name,
                    path: folderName + "/" + f.name,
                    date: itemDate
                });
            }
        } catch (e) {}
    });

    await Promise.all(metaPromises);
    update();

    const dlPromises = q.map(async (item) => {
        try {
            const res = await fetch(item.url);
            if (!res.ok) return;

            const reader = res.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                dlBytes += value.length;
                update();
            }

            const blobObj = new Blob(chunks);
            await zipWriter.add(item.path, new zip.BlobReader(blobObj), { lastModDate: item.date });
        } catch (e) {}
    });

    await Promise.all(dlPromises);

    el.innerText = `Finalizing ZIP...`;
    const blob = await zipWriter.close();

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "assets.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    
    el.innerText = "Done";
}

window.onload = run;
</script>

</body>
</html>
